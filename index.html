<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DateMind v08.7.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .tinder-gradient { background: linear-gradient(135deg, #ff7854 0%, #fd267d 100%); }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 2rem; cursor: pointer; transition: 0.3s; position: relative; }
        .phase-ice { border-left: 6px solid #94a3b8; }
        .phase-fire { border-left: 6px solid #fd267d; }
        .phase-check { border-left: 6px solid #22c55e; }
        .hidden { display: none !important; }
        #loadingOverlay { position: fixed; inset: 0; z-index: 100; background: #0f172a; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="loadingOverlay"><p class="animate-pulse font-black uppercase tracking-widest text-[#fd267d]">Sincronizando...</p></div>

    <div id="authSection" class="hidden h-screen flex items-center justify-center p-6 text-slate-900">
        <div class="bg-white p-10 rounded-[3rem] w-full max-w-sm shadow-2xl text-center">
            <h2 class="text-3xl font-black italic mb-6 text-[#fd267d]">DateMind</h2>
            <input type="email" id="email" placeholder="E-mail" class="w-full p-4 bg-slate-100 rounded-2xl mb-4 outline-none">
            <input type="password" id="pass" placeholder="Senha" class="w-full p-4 bg-slate-100 rounded-2xl mb-6 outline-none">
            <button id="btnPrimary" class="tinder-gradient w-full py-4 rounded-2xl text-white font-black uppercase">Entrar / Cadastrar</button>
        </div>
    </div>

    <div id="mainApp" class="hidden flex flex-col min-h-screen">
        <header class="p-6 border-b border-white/10 flex justify-between items-center bg-[#0f172a]/95 backdrop-blur-md sticky top-0 z-50">
            <h1 class="text-xl font-black italic">DateMind <span class="text-[#fd267d]">v08.7</span></h1>
            <div class="flex items-center gap-4">
                <button id="btnLogout" class="text-[10px] font-bold text-slate-500 uppercase">Sair</button>
                <label class="tinder-gradient px-6 py-2 rounded-full font-bold text-[10px] uppercase cursor-pointer">
                    <input type="file" id="chatUpload" class="hidden" accept=".txt"> Novo Dossiê
                </label>
            </div>
        </header>
        <main id="crmBoard" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 p-8"></main>
    </div>

    <div id="modal" class="hidden fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/90 backdrop-blur-lg">
        <div class="bg-white text-slate-900 w-full max-w-xl rounded-[2.5rem] overflow-hidden relative shadow-2xl">
            <button id="btnCloseModal" class="absolute top-6 right-6 text-slate-300 text-2xl"><i class="fa-solid fa-circle-xmark"></i></button>
            <div class="h-32 tinder-gradient p-8 flex flex-col justify-end">
                <h2 id="mName" class="text-4xl font-black text-white">---</h2>
                <select id="mPhaseSelector" class="mt-2 bg-white/20 text-white text-[9px] font-black uppercase p-1 rounded-lg border-none outline-none">
                    <option value="ice">❄️ Gelo</option>
                    <option value="fire">🔥 Fogo</option>
                    <option value="check">📍 Marcado</option>
                </select>
            </div>
            <div class="p-8 space-y-4">
                <div id="mTags" class="flex flex-wrap gap-2"></div>
                <p id="mBio" class="bg-slate-50 p-4 rounded-2xl italic text-slate-600 text-xs border border-slate-100"></p>
                <button id="btnDelete" class="w-full py-3 bg-rose-50 text-rose-500 text-[9px] font-black uppercase rounded-xl">Excluir</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, onSnapshot, orderBy, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCV1GoLh63JnbosKXY4eTMptOUedA29Jcs",
            authDomain: "memorymsg.firebaseapp.com",
            projectId: "memorymsg",
            storageBucket: "memorymsg.firebasestorage.app",
            messagingSenderId: "66381936065",
            appId: "1:66381936065:web:b440c0bbdfe63804f32b40"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        document.getElementById('btnPrimary').onclick = async () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            try { await signInWithEmailAndPassword(auth, email, pass); }
            catch { await createUserWithEmailAndPassword(auth, email, pass).catch(e => alert(e.message)); }
        };

        document.getElementById('btnLogout').onclick = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            document.getElementById('loadingOverlay').classList.add('hidden');
            if (user) {
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                syncBoard(user.uid);
            } else {
                document.getElementById('authSection').classList.remove('hidden');
                document.getElementById('mainApp').classList.add('hidden');
            }
        });

        document.getElementById('chatUpload').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const text = await file.text();
            const lowText = text.toLowerCase();
            const tags = [];
            
            const cleanName = file.name.replace('.txt','').replace('Conversa do WhatsApp com ','').split(' ')[0];
            if (lowText.includes("filho")) tags.push("👶 Pais");
            const bairro = lowText.match(/moro no ([\wáéíóúâêîôûãõç]+)/) || lowText.match(/moro em ([\wáéíóúâêîôûãõç]+)/);
            if(bairro) tags.push("📍 " + bairro[1]);
            const prof = lowText.match(/sou ([\wáéíóúâêîôûãõç]+)/) || lowText.match(/trabalho com ([\wáéíóúâêîôûãõç]+)/);
            if(prof) tags.push("💼 " + prof[1]);

            const data = {
                nome: cleanName,
                tags: tags,
                fase: "ice",
                uid: auth.currentUser.uid,
                createdAt: Date.now(),
                bio: `Dossiê de ${cleanName}. Analisado localmente.`
            };

            await addDoc(collection(db, "profiles"), data);
        };

        function syncBoard(uid) {
            const q = query(collection(db, "profiles"), where("uid", "==", uid), orderBy("createdAt", "desc"));
            onSnapshot(q, (snap) => {
                const board = document.getElementById('crmBoard');
                board.innerHTML = '';
                snap.forEach(docSnap => {
                    const d = docSnap.data();
                    const id = docSnap.id;
                    const card = document.createElement('div');
                    card.className = `glass-card p-8 animate-in fade-in duration-500 phase-${d.fase || 'ice'}`;
                    card.onclick = () => {
                        window.currentProfileId = id;
                        document.getElementById('mName').innerText = d.nome;
                        document.getElementById('mBio').innerText = d.bio;
                        document.getElementById('mPhaseSelector').value = d.fase || 'ice';
                        document.getElementById('mTags').innerHTML = d.tags.map(t => `<span class="bg-slate-100 text-slate-500 text-[10px] font-black px-4 py-2 rounded-xl border border-slate-100 uppercase">${t}</span>`).join('');
                        document.getElementById('modal').classList.remove('hidden');
                    };
                    card.innerHTML = `<h3 class="text-2xl font-black">${d.nome}</h3><div class="mt-4 flex flex-wrap gap-2">${d.tags.map(t => `<span class="bg-slate-800 text-[8px] font-bold px-2 py-1 rounded-md text-slate-400 uppercase">${t}</span>`).join('')}</div>`;
                    board.appendChild(card);
                });
            });
        }

        document.getElementById('mPhaseSelector').onchange = async (e) => {
            await updateDoc(doc(db, "profiles", window.currentProfileId), { fase: e.target.value });
        };

        document.getElementById('btnCloseModal').onclick = () => document.getElementById('modal').classList.add('hidden');
        document.getElementById('btnDelete').onclick = async () => {
            if(confirm("Excluir?")) {
                await deleteDoc(doc(db, "profiles", window.currentProfileId));
                document.getElementById('modal').classList.add('hidden');
            }
        };
    </script>
</body>
</html>
