<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DateMind | CRM Inteligente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .tinder-gradient { background: linear-gradient(135deg, #ff7854 0%, #fd267d 100%); }
        .crm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; padding: 2rem; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); cursor: pointer; transition: all 0.3s ease; }
        .glass-card:hover { transform: scale(1.02); border-color: #fd267d; }
        .modal-bg { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px); }
        .tag-badge { background: #f1f5f9; color: #475569; padding: 6px 14px; border-radius: 12px; font-size: 11px; font-weight: 800; text-transform: uppercase; border: 1px solid #e2e8f0; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="p-6 border-b border-white/10 flex justify-between items-center sticky top-0 z-40 bg-[#0f172a]/90">
        <div class="flex items-center gap-3">
            <div class="p-2 bg-white rounded-lg shadow-lg shadow-rose-500/20"><i class="fa-solid fa-fire text-[#fd267d] text-xl"></i></div>
            <h1 class="text-xl font-extrabold tracking-tighter uppercase italic">DateMind <span class="text-[#fd267d]">Intelligence</span></h1>
        </div>
        <label class="tinder-gradient px-8 py-3 rounded-full font-bold text-xs uppercase tracking-widest cursor-pointer shadow-xl hover:scale-105 transition-all flex items-center gap-2">
            <input type="file" id="chatUpload" class="hidden" accept=".txt">
            <i class="fa-solid fa-bolt"></i> Processar Novo Chat
        </label>
    </header>

    <main class="flex-1 overflow-y-auto">
        <div id="welcome" class="h-full flex flex-col items-center justify-center py-40 opacity-20">
            <i class="fa-solid fa-address-book text-9xl mb-6"></i>
            <p class="font-black uppercase tracking-[0.4em] text-[10px] text-center">Dashboard de Gestão de Relacionamentos</p>
        </div>
        <div id="crmBoard" class="crm-grid hidden"></div>
    </main>

    <div id="modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 modal-bg">
        <div class="bg-white text-slate-900 w-full max-w-xl rounded-[3rem] overflow-hidden shadow-2xl relative animate-in fade-in zoom-in duration-300">
            <button onclick="closeModal()" class="absolute top-8 right-8 text-slate-300 hover:text-rose-500 transition-colors text-3xl z-10">
                <i class="fa-solid fa-circle-xmark"></i>
            </button>
            
            <div class="h-44 tinder-gradient p-12 flex flex-col justify-end relative">
                <h2 id="modalName" class="text-5xl font-black text-white tracking-tighter leading-none">---</h2>
                <div id="modalStatus" class="mt-3 inline-block bg-white/20 text-white text-[10px] font-black uppercase px-4 py-1 rounded-full border border-white/30 backdrop-blur-sm">---</div>
            </div>

            <div class="p-12 space-y-8 overflow-y-auto" style="max-height: 500px;">
                <section>
                    <h3 class="text-[10px] font-black uppercase text-slate-400 mb-4 tracking-[0.2em] flex items-center gap-2">
                        <i class="fa-solid fa-id-card-clip text-[#fd267d]"></i> Ficha Técnica (Tags Extraídas)
                    </h3>
                    <div id="keyTags" class="flex flex-wrap gap-3">
                        </div>
                </section>

                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-slate-50 p-6 rounded-3xl border border-slate-100">
                        <span class="block text-[9px] font-black text-slate-400 uppercase mb-1">Total de Mensagens</span>
                        <span id="modalMsgs" class="text-2xl font-black text-slate-800 tracking-tighter">0</span>
                    </div>
                    <div class="bg-slate-50 p-6 rounded-3xl border border-slate-100">
                        <span class="block text-[9px] font-black text-slate-400 uppercase mb-1">Último Papo</span>
                        <span id="modalDate" class="text-2xl font-black text-slate-800 tracking-tighter">--/--</span>
                    </div>
                </div>

                <section class="bg-rose-50 p-8 rounded-[2.5rem] border border-rose-100 relative overflow-hidden">
                    <div class="relative z-10">
                        <h4 class="text-[10px] font-black text-[#fd267d] uppercase mb-3 tracking-widest flex items-center gap-2">
                            <i class="fa-solid fa-lightbulb"></i> Resumo Estratégico
                        </h4>
                        <p id="modalBio" class="text-slate-700 text-sm font-bold leading-relaxed italic"></p>
                    </div>
                    <i class="fa-solid fa-quote-right absolute -bottom-4 -right-2 text-rose-200/50 text-8xl"></i>
                </section>
            </div>
        </div>
    </div>

    <script>
        const chatUpload = document.getElementById('chatUpload');
        const crmBoard = document.getElementById('crmBoard');
        const welcome = document.getElementById('welcome');

        chatUpload.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const text = await file.text();
            const fileName = file.name.replace('.txt', '').replace('Conversa do WhatsApp com ', '');
            renderCard(extractData(text, fileName));
        });

        function extractData(text, fileName) {
            const lines = text.split('\n');
            const total = lines.length;
            const textLow = text.toLowerCase();

            // 1. Lógica de Filhos
            let filhos = null;
            if (textLow.includes("meu filho") || textLow.includes("minha filha")) filhos = "Tem Filhos";
            if (textLow.match(/tenho \d filhos/)) filhos = textLow.match(/tenho \d filhos/)[0];

            // 2. Lógica de Bairro
            let bairro = null;
            const bairroMatch = textLow.match(/moro no ([\wáéíóúâêîôûãõç]+)/) || textLow.match(/moro em ([\wáéíóúâêîôûãõç]+)/);
            if (bairroMatch) bairro = "Bairro: " + bairroMatch[1];

            // 3. Lógica de Profissão
            let profissao = null;
            const profMatch = textLow.match(/sou ([\wáéíóúâêîôûãõç]+)/) || textLow.match(/trabalho com ([\wáéíóúâêîôûãõç]+)/);
            if (profMatch && !['você', 'eu', 'o'].includes(profMatch[1])) profissao = profMatch[1];

            // 4. Termômetro
            const hotCount = (text.match(/❤️|🔥|😍|😘|🥰/g) || []).length;
            const interesse = hotCount > 15 || total > 1000 ? "Interesse: Quente" : (total < 100 ? "Frio" : "Morno");

            // Tags de Interesse Comum (Palavras mais repetidas)
            const words = textLow.replace(/[^\w\s]/gi, '').split(/\s+/);
            const freq = {};
            const stop = ['você', 'muito', 'minha', 'nossa', 'está', 'fazer', 'coisa', 'disse', 'áudio', 'oculto', 'mensagem', 'então', 'amanhã', 'acho', 'pode', 'hoje', 'tá'];
            words.forEach(w => { if(w.length > 5 && !stop.includes(w)) freq[w] = (freq[w] || 0) + 1; });
            const topTags = Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0, 3).map(i => i[0]);

            return {
                nome: fileName.split(' ')[0],
                total: total,
                data: text.match(/\d{2}\/\d{2}\/\d{2,4}/g)?.pop() || "Recente",
                status: interesse,
                filhos: filhos,
                bairro: bairro,
                profissao: profissao,
                tags: topTags,
                bio: `Conversa com alto engajamento (${total} msgs). Temas frequentes: ${topTags.join(', ')}. O tom sugere um nível de intimidade ${interesse.split(':')[1]}.`
            };
        }

        function renderCard(data) {
            welcome.classList.add('hidden');
            crmBoard.classList.remove('hidden');

            const card = document.createElement('div');
            card.className = "glass-card rounded-[2.5rem] overflow-hidden flex flex-col";
            card.onclick = () => openModal(data);
            
            const color = data.status.includes('Quente') ? 'text-rose-500' : 'text-orange-400';

            card.innerHTML = `
                <div class="h-28 tinder-gradient p-8 flex flex-col justify-end relative shadow-inner">
                    <h3 class="text-xl font-black text-white tracking-tighter">${data.nome}</h3>
                    <div class="absolute bottom-4 right-8 bg-white/20 px-3 py-1 rounded-full text-[8px] font-black text-white uppercase">Ver Ficha</div>
                </div>
                <div class="p-8">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-[9px] font-black text-slate-500 uppercase">Relacionamento</span>
                        <span class="text-[10px] font-black ${color} uppercase tracking-widest">${data.status.split(':')[1]}</span>
                    </div>
                    <div class="flex flex-wrap gap-2">
                        ${data.filhos ? `<span class="bg-rose-50 text-rose-500 text-[8px] font-black px-2 py-1 rounded-lg uppercase">👶 Pais</span>` : ''}
                        ${data.profissao ? `<span class="bg-blue-50 text-blue-500 text-[8px] font-black px-2 py-1 rounded-lg uppercase">💼 ${data.profissao}</span>` : ''}
                    </div>
                </div>
            `;
            crmBoard.prepend(card);
        }

        function openModal(data) {
            document.getElementById('modalName').innerText = data.nome;
            document.getElementById('modalMsgs').innerText = data.total;
            document.getElementById('modalDate').innerText = data.data;
            document.getElementById('modalStatus').innerText = data.status;
            document.getElementById('modalBio').innerText = data.bio;

            const tagsContainer = document.getElementById('keyTags');
            tagsContainer.innerHTML = '';
            
            // Injeção Condicional de Tags
            if (data.filhos) tagsContainer.innerHTML += `<div class="tag-badge"><i class="fa-solid fa-child-reaching mr-1"></i> ${data.filhos}</div>`;
            if (data.bairro) tagsContainer.innerHTML += `<div class="tag-badge"><i class="fa-solid fa-location-dot mr-1"></i> ${data.bairro}</div>`;
            if (data.profissao) tagsContainer.innerHTML += `<div class="tag-badge"><i class="fa-solid fa-briefcase mr-1"></i> Profissão: ${data.profissao}</div>`;
            
            data.tags.forEach(t => {
                tagsContainer.innerHTML += `<div class="tag-badge" style="background: #fdf2f8; color: #db2777; border-color: #fce7f3"># ${t}</div>`;
            });

            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('modal').classList.add('hidden'); }
    </script>
</body>
</html>
