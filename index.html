<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memória T | CRM Amoroso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs (Versão Compat para facilitar uso em arquivo único) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .pipeline-col { min-width: 300px; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .modal-overlay { background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); }
        .toast { transform: translateY(100px); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .toast.show { transform: translateY(0); }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

    <!-- AVISO DE ERRO (Toast) -->
    <div id="error-toast" class="toast fixed bottom-6 left-1/2 -translate-x-1/2 z-[200] bg-red-600 text-white px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-3">
        <i data-lucide="alert-circle"></i>
        <span id="error-message">Erro ao conectar</span>
        <button onclick="hideError()"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>

    <!-- TELA DE LOGIN -->
    <div id="login-screen" class="fixed inset-0 z-[100] bg-gray-950 flex items-center justify-center p-6 text-white">
        <div class="max-w-md w-full bg-gray-900 rounded-[3rem] p-10 border border-gray-800 text-center space-y-8 shadow-2xl">
            <div class="w-24 h-24 bg-gradient-to-br from-pink-500 to-rose-600 rounded-[2rem] mx-auto flex items-center justify-center shadow-xl shadow-pink-500/20">
                <i data-lucide="lock" class="text-white w-12 h-12"></i>
            </div>
            <div>
                <h1 class="text-4xl font-black tracking-tight">Memória T</h1>
                <p class="text-gray-500 mt-2 text-sm font-medium uppercase tracking-[0.2em]">Personal CRM Advisor</p>
            </div>
            
            <button id="btn-login" onclick="login()" class="w-full bg-white text-black py-5 rounded-3xl font-black hover:bg-gray-200 transition-all flex justify-center items-center gap-3 text-lg">
                Entrar no Dashboard
            </button>
            <p class="text-[10px] text-gray-600 uppercase font-bold tracking-widest">Acesso seguro via Firebase Auth</p>
        </div>
    </div>

    <!-- APP PRINCIPAL -->
    <div id="app-content" class="hidden min-h-screen flex flex-col">
        <header class="bg-white/80 backdrop-blur-md border-b px-6 py-4 flex justify-between items-center sticky top-0 z-40">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-pink-500 rounded-xl flex items-center justify-center shadow-lg shadow-pink-100">
                    <i data-lucide="heart" class="text-white fill-white w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black text-gray-800 leading-none">Memória T</h1>
                    <p class="text-[9px] text-gray-400 uppercase font-black tracking-widest mt-1">Sincronizado</p>
                </div>
            </div>
            <button onclick="openModal('import-modal')" class="bg-black text-white px-6 py-3 rounded-2xl text-sm font-bold flex items-center gap-2 shadow-xl hover:scale-105 transition-all active:scale-95">
                <i data-lucide="plus" class="w-4 h-4"></i> Novo Registro
            </button>
        </header>

        <div class="flex border-b bg-white sticky top-[77px] z-30">
            <button onclick="switchTab('pipeline')" id="tab-pipeline" class="px-8 py-4 text-xs font-black uppercase tracking-[0.2em] border-b-4 border-pink-500 text-pink-500 transition-all">Pipeline</button>
            <button onclick="switchTab('lista')" id="tab-lista" class="px-8 py-4 text-xs font-black uppercase tracking-[0.2em] border-b-4 border-transparent text-gray-400 transition-all">Lista Completa</button>
        </div>

        <main id="main-view" class="p-6 flex-1 overflow-x-auto hide-scroll bg-gray-50">
            <!-- Conteúdo injetado -->
        </main>
    </div>

    <!-- MODAIS -->
    <div id="import-modal" class="hidden fixed inset-0 z-[60] modal-overlay flex items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] w-full max-w-xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
            <div class="p-8 border-b flex justify-between items-center bg-gray-50/50">
                <div>
                    <h3 class="font-black text-xl">Importar Conversas</h3>
                    <p class="text-xs text-gray-400">Suba os ficheiros .txt do WhatsApp</p>
                </div>
                <button onclick="closeModal('import-modal')" class="p-2 hover:bg-gray-100 rounded-full transition-colors"><i data-lucide="x" class="w-6 h-6 text-gray-400"></i></button>
            </div>
            <div class="p-8 space-y-6 overflow-y-auto flex-1">
                <div class="border-2 border-dashed border-gray-200 rounded-[2rem] p-12 text-center relative group hover:border-pink-300 hover:bg-pink-50 transition-all">
                    <input type="file" id="file-input" multiple accept=".txt" onchange="handleFiles(this)" class="absolute inset-0 opacity-0 cursor-pointer">
                    <div class="bg-white w-16 h-16 rounded-2xl shadow-sm flex items-center justify-center mx-auto mb-4 text-gray-400 group-hover:text-pink-500 transition-colors">
                        <i data-lucide="upload-cloud" class="w-8 h-8"></i>
                    </div>
                    <p class="font-bold text-gray-700">Clique ou arraste os ficheiros</p>
                    <p class="text-[10px] text-gray-400 mt-1 uppercase font-bold">Apenas arquivos de texto</p>
                </div>
                <div id="file-list" class="space-y-3"></div>
            </div>
            <div class="p-8 border-t bg-white">
                <button id="btn-analyze" onclick="startAnalysis()" disabled class="w-full bg-pink-600 text-white py-5 rounded-[1.5rem] font-black text-lg shadow-xl shadow-pink-100 disabled:opacity-30 flex justify-center items-center gap-3 transition-all">
                    <i data-lucide="brain" class="w-6 h-6"></i> Alimentar Memória
                </button>
            </div>
        </div>
    </div>

    <div id="detail-modal" class="hidden fixed inset-0 z-[60] modal-overlay flex items-center justify-center p-4"></div>

    <script>
        // --- CONFIGURAÇÃO FIREBASE (Atualizada com seus dados) ---
        const firebaseConfig = {
            apiKey: "AIzaSyCV1GoLh63JnbosKXY4eTMptOUedA29Jcs",
            authDomain: "memorymsg.firebaseapp.com",
            projectId: "memorymsg",
            storageBucket: "memorymsg.firebasestorage.app",
            messagingSenderId: "66381936065",
            appId: "1:66381936065:web:b440c0bbdfe63804f32b40"
        };
        
        // --- IMPORTANTE: COLOQUE SUA CHAVE DO GEMINI AQUI ---
        const geminiApiKey = "AIzaSyCNvMbzSa_xyzUvbCKr-bljTeWVaa7Omxk"; 

        // Inicialização
        try {
            firebase.initializeApp(firebaseConfig);
        } catch (e) { console.error("Erro config:", e); }
        
        const auth = firebase.auth();
        const db = firebase.firestore();
        let currentUser = null;
        let allProfiles = [];
        let currentTab = 'pipeline';
        let pendingFiles = [];

        const STAGES = [
            { id: 'match', label: 'Match/Tinder', color: 'bg-blue-100 text-blue-700' },
            { id: 'talking', label: 'Conversando', color: 'bg-purple-100 text-purple-700' },
            { id: 'date_scheduled', label: 'Date Marcado', color: 'bg-yellow-100 text-yellow-700' },
            { id: 'ongoing', label: 'Em Progresso', color: 'bg-pink-100 text-pink-700' },
            { id: 'archived', label: 'Arquivo/Amizade', color: 'bg-gray-100 text-gray-700' }
        ];

        // --- AUTH ---
        async function login() {
            const btn = document.getElementById('btn-login');
            btn.disabled = true;
            btn.innerHTML = `<span class="animate-spin mr-2">◌</span> Validando Acesso...`;

            try {
                await auth.signInAnonymously();
            } catch (err) {
                let msg = "Erro. Verifique se o 'Login Anônimo' está ativo no Firebase.";
                if (err.code === "auth/operation-not-allowed") msg = "Ative 'Anonymous Auth' no console do Firebase!";
                showError(msg);
                btn.disabled = false;
                btn.innerHTML = "Entrar no Dashboard";
            }
        }

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                initData();
            }
        });

        // --- DATA ---
        function initData() {
            db.collection('artifacts').doc('memoria-t').collection('users').doc(currentUser.uid).collection('profiles')
                .orderBy('createdAt', 'desc')
                .onSnapshot(snapshot => {
                    allProfiles = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    render();
                }, err => showError("Erro DB: " + err.message));
        }

        // --- RENDER ---
        function render() {
            const main = document.getElementById('main-view');
            main.innerHTML = "";

            if (currentTab === 'pipeline') {
                const container = document.createElement('div');
                container.className = "flex gap-6 h-full";
                STAGES.forEach(stage => {
                    const col = document.createElement('div');
                    col.className = "pipeline-col flex flex-col gap-4";
                    col.innerHTML = `<div class="p-4 rounded-2xl font-black text-[10px] uppercase tracking-[0.2em] text-center ${stage.color}">${stage.label}</div>`;
                    
                    const list = document.createElement('div');
                    list.className = "space-y-4 flex-1";
                    allProfiles.filter(p => p.stage === stage.id).forEach(p => {
                        list.appendChild(createCard(p));
                    });
                    col.appendChild(list);
                    container.appendChild(col);
                });
                main.appendChild(container);
            } else {
                const grid = document.createElement('div');
                grid.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 max-w-7xl mx-auto w-full";
                allProfiles.forEach(p => grid.appendChild(createCard(p)));
                main.appendChild(grid);
            }
            lucide.createIcons();
        }

        function createCard(p) {
            const div = document.createElement('div');
            div.className = "bg-white p-6 rounded-3xl border border-gray-100 cursor-pointer hover:shadow-2xl hover:-translate-y-1 transition-all group";
            div.onclick = () => openDetails(p);
            
            const hasKids = p.hasChildren && p.hasChildren.toLowerCase() !== 'não' && p.hasChildren.toLowerCase() !== 'não mencionado';
            const firstName = p.name ? p.name.split(' ')[0] : '???';
            
            div.innerHTML = `
                <div class="flex justify-between items-start mb-4">
                    <h4 class="font-black text-2xl text-gray-800 group-hover:text-pink-600 transition-colors">${firstName}, ${p.age || '00'}</h4>
                </div>
                <div class="space-y-3">
                    <div class="flex items-center gap-3 text-sm text-gray-500 font-medium">
                        <div class="bg-pink-50 p-2 rounded-lg text-pink-400"><i data-lucide="briefcase" class="w-4 h-4"></i></div>
                        <span class="truncate">${p.profession}</span>
                    </div>
                    <div class="flex items-center gap-3 text-sm text-gray-500 font-medium">
                        <div class="bg-blue-50 p-2 rounded-lg text-blue-400"><i data-lucide="map-pin" class="w-4 h-4"></i></div>
                        <span class="truncate">${p.location}</span>
                    </div>
                    ${hasKids ? `
                    <div class="mt-4 flex items-center gap-2 text-[10px] text-amber-600 font-black uppercase bg-amber-50 w-fit px-3 py-1.5 rounded-xl border border-amber-100">
                        <i data-lucide="baby" class="w-3.5 h-3.5"></i> ${p.hasChildren}
                    </div>` : ''}
                </div>
            `;
            return div;
        }

        // --- ACTIONS ---
        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-pipeline').className = tab === 'pipeline' ? "px-8 py-4 text-xs font-black uppercase tracking-[0.2em] border-b-4 border-pink-500 text-pink-500" : "px-8 py-4 text-xs font-black uppercase tracking-[0.2em] border-b-4 border-transparent text-gray-400";
            document.getElementById('tab-lista').className = tab === 'lista' ? "px-8 py-4 text-xs font-black uppercase tracking-[0.2em] border-b-4 border-pink-500 text-pink-500" : "px-8 py-4 text-xs font-black uppercase tracking-[0.2em] border-b-4 border-transparent text-gray-400";
            render();
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        async function handleFiles(input) {
            const files = Array.from(input.files);
            for (const file of files) {
                const text = await file.text();
                pendingFiles.push({ id: Math.random(), name: file.name, content: text, status: 'ready' });
            }
            updateFileList();
        }

        function updateFileList() {
            const list = document.getElementById('file-list');
            list.innerHTML = pendingFiles.map(f => `
                <div class="flex items-center gap-3 p-4 bg-gray-50 rounded-2xl border border-gray-100">
                    <i data-lucide="file-text" class="w-5 h-5 text-gray-400"></i>
                    <span class="flex-1 text-sm font-bold truncate text-gray-700">${f.name}</span>
                    ${f.status === 'done' ? '<i data-lucide="check-circle" class="text-green-500 w-5 h-5"></i>' : ''}
                </div>
            `).join('');
            const btn = document.getElementById('btn-analyze');
            btn.disabled = pendingFiles.length === 0 || pendingFiles.every(f => f.status === 'done');
            btn.style.opacity = btn.disabled ? "0.3" : "1";
            lucide.createIcons();
        }

        async function startAnalysis() {
            if (!geminiApiKey) return showError("Configure a sua geminiApiKey no código!");
            
            const btn = document.getElementById('btn-analyze');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<span class="animate-spin mr-3">◌</span> Sincronizando Memória...`;
            btn.disabled = true;

            const systemPrompt = `Você é a Memória T. Analise o log e retorne APENAS JSON: {"name": "String", "age": "String", "profession": "String", "hasChildren": "Sim (Quantidade) ou Não", "location": "Bairro - Cidade", "vibe": "String", "summary": "Resumo da relação", "notes": "Gostos e qualidades"}`;

            for (let i = 0; i < pendingFiles.length; i++) {
                if (pendingFiles[i].status === 'done') continue;
                
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${geminiApiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `Analise esta conversa: ${pendingFiles[i].content}` }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] },
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });
                    const data = await response.json();
                    const result = JSON.parse(data.candidates[0].content.parts[0].text);
                    
                    await db.collection('artifacts').doc('memoria-t').collection('users').doc(currentUser.uid).collection('profiles').add({
                        ...result,
                        stage: 'talking',
                        createdAt: new Date().toISOString()
                    });
                    
                    pendingFiles[i].status = 'done';
                    updateFileList();
                } catch (e) { 
                    console.error(e);
                    showError("Erro na IA. Verifique sua chave Gemini.");
                }
            }
            
            setTimeout(() => {
                closeModal('import-modal');
                pendingFiles = [];
                updateFileList();
                btn.innerHTML = originalText;
            }, 1000);
        }

        function openDetails(p) {
            const modal = document.getElementById('detail-modal');
            const hasKids = p.hasChildren && p.hasChildren.toLowerCase() !== 'não';

            modal.innerHTML = `
                <div class="bg-white rounded-[3rem] w-full max-w-4xl overflow-hidden shadow-2xl relative flex flex-col md:flex-row max-h-[90vh]">
                    <button onclick="closeModal('detail-modal')" class="absolute top-6 right-6 z-10 p-2 bg-gray-100 rounded-full hover:bg-gray-200 transition-colors"><i data-lucide="x" class="w-6 h-6 text-gray-500"></i></button>
                    
                    <div class="md:w-1/3 bg-gray-50 p-10 border-r flex flex-col items-center md:items-start text-center md:text-left">
                        <div class="w-32 h-32 bg-pink-500 rounded-[2.5rem] flex items-center justify-center text-5xl font-black text-white shadow-2xl shadow-pink-200 mb-8">${p.name ? p.name[0] : '?'}</div>
                        <h2 class="text-3xl font-black text-gray-800 leading-tight">${p.name}, ${p.age}</h2>
                        <p class="text-[10px] font-black text-pink-500 uppercase tracking-widest mt-2 px-3 py-1 bg-pink-50 rounded-lg border border-pink-100">${p.stage}</p>
                        
                        <div class="mt-10 space-y-4 w-full">
                            <div class="flex items-center gap-4 text-sm font-bold text-gray-600 bg-white p-4 rounded-2xl shadow-sm"><i data-lucide="briefcase" class="w-5 h-5 text-gray-400"></i> ${p.profession}</div>
                            <div class="flex items-center gap-4 text-sm font-bold text-gray-600 bg-white p-4 rounded-2xl shadow-sm"><i data-lucide="map-pin" class="w-5 h-5 text-gray-400"></i> ${p.location}</div>
                            ${hasKids ? `<div class="flex items-center gap-4 text-sm font-bold text-amber-700 bg-amber-50 p-4 rounded-2xl border border-amber-100"><i data-lucide="baby" class="w-5 h-5 text-amber-500"></i> ${p.hasChildren}</div>` : ''}
                        </div>
                    </div>

                    <div class="flex-1 p-10 overflow-y-auto hide-scroll">
                        <div class="bg-gray-900 p-8 rounded-[2.5rem] text-white shadow-xl relative overflow-hidden">
                            <div class="absolute top-0 right-0 p-6 opacity-10"><i data-lucide="brain" class="w-20 h-20"></i></div>
                            <h3 class="font-black text-pink-400 flex items-center gap-2 mb-4 uppercase tracking-widest text-xs">Insight Memória T</h3>
                            <p class="text-xl font-medium leading-relaxed italic">"${p.summary || "Nenhuma análise disponível ainda."}"</p>
                        </div>

                        <div class="mt-8 grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="p-6 border border-gray-100 rounded-[2rem] bg-gray-50/50">
                                <h4 class="font-black text-[10px] uppercase text-gray-400 mb-2 tracking-widest">Vibe Geral</h4>
                                <p class="text-sm text-gray-700 leading-relaxed font-medium">${p.vibe}</p>
                            </div>
                            <div class="p-6 border border-gray-100 rounded-[2rem] bg-gray-50/50">
                                <h4 class="font-black text-[10px] uppercase text-gray-400 mb-2 tracking-widest">Qualidades & Notas</h4>
                                <p class="text-sm text-gray-700 leading-relaxed font-medium">${p.notes}</p>
                            </div>
                        </div>

                        <div class="mt-10 pt-6 border-t">
                            <h4 class="font-black text-[10px] uppercase text-gray-400 mb-4 tracking-widest">Alterar Estágio</h4>
                            <div class="flex flex-wrap gap-2">
                                ${STAGES.map(s => `
                                    <button onclick="updateProfileStage('${p.id}', '${s.id}')" 
                                    class="px-4 py-2 rounded-2xl text-[10px] font-black uppercase transition-all 
                                    ${p.stage === s.id ? 'bg-black text-white shadow-lg' : 'bg-gray-100 text-gray-400 hover:bg-gray-200'}">
                                        ${s.label}
                                    </button>`).join('')}
                            </div>
                            <div class="mt-8 pt-8 border-t flex justify-end">
                                <button onclick="deleteProfile('${p.id}')" class="flex items-center gap-2 text-red-400 font-black text-[10px] uppercase hover:text-red-600 transition-colors">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i> Eliminar Registro
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            modal.classList.remove('hidden');
            lucide.createIcons();
        }

        async function updateProfileStage(id, stage) {
            await db.collection('artifacts').doc('memoria-t').collection('users').doc(currentUser.uid).collection('profiles').doc(id).update({ stage });
            closeModal('detail-modal');
        }

        async function deleteProfile(id) {
            if(confirm("Deseja apagar permanentemente este registro da sua memória?")) {
                await db.collection('artifacts').doc('memoria-t').collection('users').doc(currentUser.uid).collection('profiles').doc(id).delete();
                closeModal('detail-modal');
            }
        }

        function showError(text) {
            document.getElementById('error-message').innerText = text;
            document.getElementById('error-toast').classList.add('show');
            lucide.createIcons();
            setTimeout(hideError, 6000);
        }
        function hideError() { document.getElementById('error-toast').classList.remove('show'); }

        lucide.createIcons();
    </script>
</body>
</html>
