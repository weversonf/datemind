<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DateMind | v04.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f0f2f5; }
        .tinder-gradient { background: linear-gradient(262deg, #ff7854 0%, #fd267d 100%); }
        .sidebar-item:hover { background-color: #f3f4f6; }
        .glass-badge { background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .card-appear { animation: slideUp 0.5s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .loader { border-top-color: #fd267d; animation: spinner 1s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="w-80 bg-white border-r flex flex-col z-20 shadow-xl">
        <div class="p-8 border-b">
            <h1 class="text-2xl font-black text-[#fd267d] tracking-tighter italic uppercase">DateMind</h1>
            <span class="text-[9px] text-gray-400 font-bold tracking-widest uppercase text-center block">Stability Patch v04.5</span>
        </div>
        <div class="overflow-y-auto flex-1 px-2 py-4" id="sideList">
            <div id="emptyMsg" class="p-10 text-center text-gray-300">
                <p class="text-[10px] font-black uppercase tracking-widest">Aguardando Importação</p>
            </div>
        </div>
        <div class="p-6 bg-gray-50 border-t">
            <label class="tinder-gradient text-white w-full py-4 rounded-2xl font-black text-xs uppercase tracking-widest flex items-center justify-center cursor-pointer shadow-lg hover:scale-[1.02] transition-all active:scale-95">
                <input type="file" id="chatUpload" class="hidden" accept=".txt">
                Subir Novo .txt
            </label>
        </div>
    </aside>

    <main class="flex-1 flex flex-col items-center justify-center p-12 relative">
        <div id="loadingOverlay" class="hidden absolute inset-0 bg-white/95 z-50 flex flex-col items-center justify-center backdrop-blur-sm">
            <div class="loader w-14 h-14 border-4 border-gray-100 rounded-full mb-4"></div>
            <p class="text-[#fd267d] font-black text-[10px] uppercase tracking-widest">Processando Inteligência...</p>
        </div>

        <div id="profileCard" class="hidden w-full max-w-md bg-white rounded-[3rem] shadow-2xl overflow-hidden flex flex-col card-appear border border-white">
            <div class="h-72 tinder-gradient relative flex items-end p-8">
                <div id="badgeContainer" class="absolute top-8 right-8 px-4 py-1.5 rounded-full">
                    <span id="interestBadge" class="text-white text-[10px] font-black uppercase tracking-tighter"></span>
                </div>
                <div class="z-10 text-white">
                    <h2 id="cardName" class="text-4xl font-black tracking-tight mb-1 leading-none">Nome</h2>
                    <p class="text-[10px] font-bold opacity-80 uppercase tracking-widest flex items-center gap-2">
                        <i class="fa-solid fa-clock"></i> Última Interação: <span id="lastDate">--/--</span>
                    </p>
                </div>
                <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
            </div>

            <div class="p-8 space-y-6 bg-white overflow-y-auto" style="max-height: 450px;">
                <section>
                    <h3 class="text-[9px] font-black uppercase tracking-widest text-gray-400 mb-2 border-l-2 border-[#fd267d] pl-2">Análise de Perfil</h3>
                    <p id="bioText" class="text-gray-600 text-sm leading-relaxed font-medium"></p>
                </section>
                
                <section>
                    <h3 class="text-[9px] font-black uppercase tracking-widest text-gray-400 mb-3 border-l-2 border-[#fd267d] pl-2 uppercase">Dossiê</h3>
                    <div id="tagContainer" class="flex flex-wrap gap-2"></div>
                </section>

                <section class="bg-gray-50 p-6 rounded-[2.5rem] border border-gray-100">
                    <h3 class="text-[9px] font-black uppercase text-[#fd267d] mb-2 flex items-center gap-2">
                        <i class="fa-solid fa-wand-magic-sparkles text-xs"></i> Próximo Passo sugerido
                    </h3>
                    <p id="aiInsight" class="text-gray-800 text-sm font-bold italic leading-snug"></p>
                </section>
            </div>
        </div>

        <div id="welcomeMsg" class="flex flex-col items-center opacity-10">
            <i class="fa-solid fa-heart-pulse text-8xl mb-4"></i>
        </div>
    </main>

    <script>
        const API_KEY = "AIzaSyA5DZ2XJSw9eNq972bZm3aRXkYPpH7T1XU";

        document.getElementById('chatUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            document.getElementById('loadingOverlay').classList.remove('hidden');

            reader.onload = async (event) => {
                let content = event.target.result;
                
                // LIMPEZA TÉCNICA: Remove ruídos do WhatsApp mas mantém DATA e MENSAGEM
                content = content.replace(/<Mídia oculta>/g, "[Mídia]");
                content = content.replace(/As mensagens e ligações são protegidas.*/g, "");
                content = content.replace(/.*está na sua lista de contatos/g, "");

                const fileName = file.name.split('com ')[1]?.replace('.txt', '') || file.name.replace('.txt', '');
                await callGeminiAI(fileName, content.slice(-15000)); 
            };
            reader.readAsText(file);
        });

        async function callGeminiAI(name, chatText) {
            const prompt = `Analise este chat com ${name}. Foque na cronologia das datas. 
            Responda EXCLUSIVAMENTE com um objeto JSON válido. Não adicione texto antes ou depois.
            Modelo:
            {
              "nome": "${name}",
              "ultimo_papo": "data formatada",
              "ocupacao": "trabalho",
              "personalidade": "resumo psicológico",
              "tags": ["fato1", "fato2", "gosto"],
              "insight": "estratégia de convite",
              "interesse": "Quente/Morno/Frio"
            }
            Chat:\n${chatText}`;

            try {
                const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await resp.json();
                let rawText = data.candidates[0].content.parts[0].text;
                
                // EXTRATOR DE JSON BLINDADO
                const jsonStart = rawText.indexOf('{');
                const jsonEnd = rawText.lastIndexOf('}') + 1;
                const cleanJson = rawText.substring(jsonStart, jsonEnd);
                
                updateUI(JSON.parse(cleanJson));
            } catch (e) {
                console.error("Erro detalhado:", e);
                alert("Erro ao processar dados. Tente um arquivo menor ou verifique sua conexão.");
            } finally {
                document.getElementById('loadingOverlay').classList.add('hidden');
            }
        }

        function updateUI(data) {
            document.getElementById('welcomeMsg').classList.add('hidden');
            document.getElementById('profileCard').classList.remove('hidden');
            document.getElementById('cardName').innerText = data.nome;
            document.getElementById('lastDate').innerText = data.ultimo_papo;
            document.getElementById('bioText').innerText = data.personalidade;
            document.getElementById('aiInsight').innerText = data.insight;

            const badge = document.getElementById('badgeContainer');
            const intBadge = document.getElementById('interestBadge');
            intBadge.innerText = data.interesse;
            
            if(data.interesse.toLowerCase() === 'quente') {
                badge.className = "absolute top-8 right-8 bg-red-500 shadow-xl px-4 py-1.5 rounded-full animate-pulse";
            } else {
                badge.className = "absolute top-8 right-8 glass-badge px-4 py-1.5 rounded-full";
            }

            document.getElementById('tagContainer').innerHTML = data.tags.map(t => 
                `<span class="bg-gray-100 text-gray-800 px-3 py-1.5 rounded-xl text-[10px] font-black uppercase border border-gray-100 tracking-tighter">${t}</span>`
            ).join('');

            if(document.getElementById('emptyMsg')) document.getElementById('emptyMsg').remove();
            const div = document.createElement('div');
            div.className = "sidebar-item p-4 mb-2 flex items-center cursor-pointer transition-all rounded-2xl mx-2 bg-white shadow-sm border border-gray-100";
            div.innerHTML = `<div class="w-10 h-10 rounded-full tinder-gradient mr-3 flex items-center justify-center text-white font-black text-xs shadow-sm">${data.nome.charAt(0)}</div><div class="text-sm font-bold text-gray-700">${data.nome}</div>`;
            document.getElementById('sideList').prepend(div);
        }
    </script>
</body>
</html>
