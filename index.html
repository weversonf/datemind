<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Match Analytics Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-dark: #09090b;
            --card-dark: #18181b;
            --accent-gold: #fbbf24;
            --accent-purple: #8b5cf6;
            --accent-pink: #ec4899;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-dark); 
            color: #ffffff;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        .glass-card { 
            background: rgba(24, 24, 27, 0.8); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
        }

        /* Status Colors */
        .status-conheci { border-left: 4px solid #3b82f6; }
        .status-sai { border-left: 4px solid #a855f7; }
        .status-fiquei { border-left: 4px solid #ec4899; }
        .status-transei { border-left: 4px solid #ef4444; }

        .btn-gold {
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.3);
        }

        .bottom-nav {
            background: rgba(24, 24, 27, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-active {
            color: #ffffff;
            background: linear-gradient(135deg, #ec4899 0%, #ef4444 100%);
            border-radius: 999px;
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.3);
        }

        /* Utils */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen pb-32">

    <!-- Header Fixo -->
    <header class="sticky top-0 z-40 bg-[#09090b]/80 backdrop-blur-md p-6 flex justify-between items-center max-w-lg mx-auto">
        <div class="flex items-center gap-2">
            <span class="text-xl font-extrabold tracking-tighter">MAP<span class="text-pink-500">.</span></span>
            <div class="bg-[#27272a] px-3 py-1 rounded-full flex items-center gap-2 border border-white/5">
                <div class="w-1.5 h-1.5 rounded-full bg-yellow-500 animate-pulse"></div>
                <span class="text-[10px] font-black text-yellow-500" id="global-score">0.00</span>
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="switchTab('profile')" class="bg-[#27272a] p-2 rounded-xl border border-white/5">
                <i data-lucide="user" class="w-5 h-5 text-zinc-400"></i>
            </button>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-lg mx-auto px-6">
        
        <!-- ABA: DASHBOARD -->
        <div id="tab-home" class="tab-content active space-y-8">
            <section class="grid grid-cols-2 gap-4 mt-4">
                <div class="glass-card p-5 rounded-[2.5rem] relative overflow-hidden">
                    <i data-lucide="users" class="w-6 h-6 text-purple-400 mb-4"></i>
                    <h3 class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest">Total Matches</h3>
                    <p id="stat-total" class="text-2xl font-black mt-1">0</p>
                </div>
                <div class="glass-card p-5 rounded-[2.5rem] relative overflow-hidden">
                    <i data-lucide="flame" class="w-6 h-6 text-red-400 mb-4"></i>
                    <h3 class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest">Taxa de Êxito</h3>
                    <p id="stat-rate" class="text-2xl font-black mt-1">0%</p>
                </div>
            </section>

            <section>
                <h3 class="text-[10px] font-black uppercase text-zinc-500 mb-4 tracking-widest flex justify-between">
                    <span>Iniciais Ativas</span>
                    <span id="active-letters-count" class="text-pink-500">0</span>
                </h3>
                <div id="alphabet-scroll" class="flex gap-4 overflow-x-auto no-scrollbar pb-2">
                    <!-- Gerado por JS -->
                </div>
            </section>

            <section class="glass-card p-6 rounded-[2.5rem]">
                <h3 class="text-sm font-bold mb-4 text-zinc-300 flex items-center gap-2">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i> Novo Registo
                </h3>
                <div class="space-y-3">
                    <div class="flex gap-2">
                        <input type="text" id="match-name" placeholder="Nome..." 
                            class="flex-[2] bg-zinc-900 border border-white/5 rounded-2xl px-4 py-4 outline-none focus:border-yellow-500/30 text-sm">
                        <input type="number" id="match-age" placeholder="Idade" 
                            class="flex-1 bg-zinc-900 border border-white/5 rounded-2xl px-4 py-4 outline-none focus:border-yellow-500/30 text-sm">
                    </div>
                    <div class="flex gap-2">
                        <select id="match-status" class="flex-1 bg-zinc-900 border border-white/5 rounded-2xl px-4 py-4 outline-none focus:border-yellow-500/30 text-sm appearance-none cursor-pointer">
                            <option value="conheci">Conheci</option>
                            <option value="sai">Saí</option>
                            <option value="fiquei">Fiquei</option>
                            <option value="transei">Transei</option>
                        </select>
                        <button onclick="addMatch()" class="btn-gold px-8 rounded-2xl font-black text-black text-sm active:scale-95 transition-all">
                            ADD
                        </button>
                    </div>
                </div>
            </section>

            <section class="space-y-4">
                <h3 class="text-[10px] font-black uppercase text-zinc-500 tracking-widest">Últimas Conquistas</h3>
                <div id="recent-list" class="space-y-3">
                    <!-- Gerado por JS -->
                </div>
            </section>
        </div>

        <!-- ABA: SEARCH -->
        <div id="tab-search" class="tab-content space-y-6">
            <h2 class="text-2xl font-black mt-4">Explorar</h2>
            <div class="relative">
                <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-500"></i>
                <input type="text" id="search-input" oninput="render()" placeholder="Procurar por nome..." 
                    class="w-full bg-zinc-900 border border-white/5 rounded-2xl pl-12 pr-4 py-4 outline-none focus:border-pink-500/30 text-sm">
            </div>
            <div id="search-results" class="space-y-3">
                <!-- Gerado por JS -->
            </div>
        </div>

        <!-- ABA: STATS -->
        <div id="tab-stats" class="tab-content space-y-8">
            <h2 class="text-2xl font-black mt-4">Analytics</h2>
            
            <div class="glass-card p-6 rounded-[2.5rem] space-y-6">
                <h3 class="text-xs font-black uppercase text-zinc-500 tracking-widest">Distribuição por Status</h3>
                <div id="status-bars" class="space-y-4">
                    <!-- Barras de progresso geradas via JS -->
                </div>
            </div>

            <div class="glass-card p-6 rounded-[2.5rem]">
                <h3 class="text-xs font-black uppercase text-zinc-500 tracking-widest mb-4">Abecedário Completo</h3>
                <div id="full-alphabet-grid" class="grid grid-cols-4 gap-2">
                    <!-- Grid gerada via JS -->
                </div>
            </div>
        </div>

        <!-- ABA: BOOKMARKS -->
        <div id="tab-bookmarks" class="tab-content space-y-6">
            <h2 class="text-2xl font-black mt-4">Favoritos</h2>
            <p class="text-zinc-500 text-sm italic">Pessoas que marcaram a diferença.</p>
            <div id="bookmarks-list" class="space-y-3">
                <!-- Gerado por JS -->
            </div>
        </div>

        <!-- ABA: PROFILE -->
        <div id="tab-profile" class="tab-content space-y-8 text-center pt-10">
            <div class="inline-block p-1 rounded-full bg-gradient-to-tr from-pink-500 to-yellow-500">
                <div class="w-24 h-24 rounded-full bg-zinc-900 flex items-center justify-center border-4 border-zinc-950 overflow-hidden">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="avatar" class="w-full h-full object-cover">
                </div>
            </div>
            <div>
                <h2 class="text-2xl font-black">Don Juan</h2>
                <p class="text-zinc-500 text-xs font-bold uppercase tracking-widest mt-1">Nível Elite</p>
            </div>

            <div class="glass-card p-6 rounded-[2.5rem] text-left">
                <h3 class="text-xs font-black uppercase text-zinc-500 mb-4 tracking-widest">Sistema</h3>
                <button onclick="confirmReset()" class="w-full bg-red-500/10 text-red-500 border border-red-500/20 py-4 rounded-2xl font-bold text-sm hover:bg-red-500/20 transition-all flex items-center justify-center gap-2">
                    <i data-lucide="alert-triangle" class="w-4 h-4"></i> Apagar Todos os Dados
                </button>
            </div>

            <p class="text-[10px] text-zinc-600 font-bold uppercase tracking-widest">Versão 2.5.0 Pro Build</p>
        </div>

    </main>

    <!-- Barra de Navegação Inferior -->
    <nav class="fixed bottom-0 left-0 right-0 p-4 z-50">
        <div class="max-w-md mx-auto bottom-nav rounded-[2.5rem] p-2 flex justify-around items-center">
            <button onclick="switchTab('home')" id="nav-home" class="p-4 text-zinc-500 transition-all nav-active">
                <i data-lucide="layout-grid" class="w-6 h-6"></i>
            </button>
            <button onclick="switchTab('search')" id="nav-search" class="p-4 text-zinc-500 transition-all">
                <i data-lucide="search" class="w-6 h-6"></i>
            </button>
            <button onclick="switchTab('stats')" id="nav-stats" class="p-4 text-zinc-500 transition-all">
                <i data-lucide="bar-chart-3" class="w-6 h-6"></i>
            </button>
            <button onclick="switchTab('bookmarks')" id="nav-bookmarks" class="p-4 text-zinc-500 transition-all">
                <i data-lucide="bookmark" class="w-6 h-6"></i>
            </button>
            <button onclick="switchTab('profile')" id="nav-profile" class="p-4 text-zinc-500 transition-all">
                <i data-lucide="user" class="w-6 h-6"></i>
            </button>
        </div>
    </nav>

    <script>
        // Init Lucide
        lucide.createIcons();

        // State
        let matches = JSON.parse(localStorage.getItem('mapMatches_v2')) || [];
        let activeTab = 'home';

        // Lógica de Tabs
        function switchTab(tabId) {
            activeTab = tabId;
            
            // UI Update
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.getElementById(`tab-${tabId}`).classList.add('active');

            // Nav Icons Update
            document.querySelectorAll('.bottom-nav button').forEach(btn => btn.classList.remove('nav-active'));
            document.getElementById(`nav-${tabId}`).classList.add('nav-active');

            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // CRUD Operations
        function addMatch() {
            const name = document.getElementById('match-name').value.trim();
            const age = document.getElementById('match-age').value.trim();
            const status = document.getElementById('match-status').value;

            if (!name) return;

            const entry = {
                id: Date.now(),
                name,
                age: age || null,
                status,
                isFavorite: false,
                date: new Date().toLocaleDateString('pt-PT')
            };

            matches.unshift(entry);
            save();
            
            // Feedback Visual
            document.getElementById('match-name').value = '';
            document.getElementById('match-age').value = '';
        }

        function toggleFavorite(id) {
            matches = matches.map(m => m.id === id ? { ...m, isFavorite: !m.isFavorite } : m);
            save();
        }

        function deleteMatch(id) {
            if (confirm("Tens a certeza que queres apagar este registo?")) {
                matches = matches.filter(m => m.id !== id);
                save();
            }
        }

        function updateStatus(id, newStatus) {
            matches = matches.map(m => m.id === id ? { ...m, status: newStatus } : m);
            save();
        }

        function confirmReset() {
            if (confirm("⚠️ ATENÇÃO: Isto apagará permanentemente toda a tua base de dados. Continuar?")) {
                matches = [];
                save();
                switchTab('home');
            }
        }

        function save() {
            localStorage.setItem('mapMatches_v2', JSON.stringify(matches));
            render();
        }

        // Rendering Logic
        function render() {
            const searchTerm = document.getElementById('search-input')?.value.toLowerCase() || "";
            
            // Update Core Stats
            const stats = { conheci: 0, sai: 0, fiquei: 0, transei: 0 };
            matches.forEach(m => stats[m.status]++);
            
            const total = matches.length;
            const rate = total > 0 ? (stats.transei / total * 100).toFixed(0) : 0;
            const score = (total * 10) + (stats.sai * 20) + (stats.transei * 50);

            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-rate').textContent = rate + '%';
            document.getElementById('global-score').textContent = score.toFixed(2);

            // 1. Dashboard Recent List
            const recentList = document.getElementById('recent-list');
            const filteredMatches = activeTab === 'search' 
                ? matches.filter(m => m.name.toLowerCase().includes(searchTerm))
                : activeTab === 'bookmarks'
                ? matches.filter(m => m.isFavorite)
                : matches.slice(0, 5); // Default to top 5

            const listHTML = filteredMatches.length > 0 
                ? filteredMatches.map(m => renderCard(m)).join('')
                : `<div class="p-10 text-center text-zinc-600 italic text-xs">Sem registos encontrados.</div>`;

            if (activeTab === 'home') recentList.innerHTML = listHTML;
            if (activeTab === 'search') document.getElementById('search-results').innerHTML = listHTML;
            if (activeTab === 'bookmarks') document.getElementById('bookmarks-list').innerHTML = listHTML;

            // 2. Alphabet Circle Scroll
            const alphabetContainer = document.getElementById('alphabet-scroll');
            const letters = {};
            matches.forEach(m => {
                const l = m.name[0].toUpperCase();
                letters[l] = (letters[l] || 0) + 1;
            });

            document.getElementById('active-letters-count').textContent = Object.keys(letters).length;
            alphabetContainer.innerHTML = Object.keys(letters).sort().map(l => `
                <div class="flex flex-col items-center gap-2 shrink-0">
                    <div class="w-14 h-14 rounded-full border-2 border-pink-500/50 p-0.5 relative">
                        <div class="w-full h-full rounded-full bg-zinc-800 border border-white/10 flex items-center justify-center font-black text-lg">
                            ${l}
                        </div>
                    </div>
                    <span class="text-[9px] font-black text-zinc-600 uppercase tracking-tighter">${letters[l]} PAX</span>
                </div>
            `).join('');

            // 3. Stats Tab (Bars and Grid)
            if (activeTab === 'stats') {
                const barsContainer = document.getElementById('status-bars');
                const colors = { conheci: '#3b82f6', sai: '#a855f7', fiquei: '#ec4899', transei: '#ef4444' };
                barsContainer.innerHTML = Object.entries(stats).map(([key, val]) => {
                    const perc = total > 0 ? (val / total * 100).toFixed(0) : 0;
                    return `
                        <div class="space-y-1">
                            <div class="flex justify-between text-[10px] font-black uppercase tracking-widest text-zinc-400">
                                <span>${key}</span>
                                <span>${val} (${perc}%)</span>
                            </div>
                            <div class="w-full h-2 bg-zinc-900 rounded-full overflow-hidden border border-white/5">
                                <div class="h-full" style="width: ${perc}%; background-color: ${colors[key]}"></div>
                            </div>
                        </div>
                    `;
                }).join('');

                const gridContainer = document.getElementById('full-alphabet-grid');
                gridContainer.innerHTML = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map(l => `
                    <div class="p-3 rounded-2xl ${letters[l] ? 'bg-zinc-800 border-pink-500/20 text-white' : 'bg-zinc-900/50 text-zinc-700'} border flex flex-col items-center">
                        <span class="text-xs font-black">${l}</span>
                        <span class="text-[8px] font-bold">${letters[l] || 0}</span>
                    </div>
                `).join('');
            }

            lucide.createIcons();
        }

        function renderCard(m) {
            return `
                <div class="glass-card p-4 rounded-3xl flex items-center justify-between border-l-4 status-${m.status}">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-2xl bg-zinc-800 flex items-center justify-center font-black text-zinc-500 border border-white/5 uppercase text-xs">
                            ${m.name[0]}
                        </div>
                        <div>
                            <h3 class="font-bold text-zinc-100 flex items-center gap-1.5">
                                ${m.name} ${m.age ? `<span class="text-zinc-500 text-xs">(${m.age})</span>` : ''}
                                ${m.isFavorite ? '<i data-lucide="star" class="w-3 h-3 fill-yellow-500 text-yellow-500"></i>' : ''}
                            </h3>
                            <p class="text-[9px] text-zinc-600 font-bold uppercase tracking-widest">${m.date}</p>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-1">
                        <button onclick="toggleFavorite(${m.id})" class="p-2 ${m.isFavorite ? 'text-yellow-500' : 'text-zinc-600'}">
                            <i data-lucide="star" class="w-4 h-4"></i>
                        </button>
                        <select onchange="updateStatus(${m.id}, this.value)" 
                            class="text-[9px] bg-zinc-800 border-none rounded-xl px-2 py-2 outline-none font-black uppercase appearance-none text-center min-w-[70px]">
                            <option value="conheci" ${m.status === 'conheci' ? 'selected' : ''}>Conheci</option>
                            <option value="sai" ${m.status === 'sai' ? 'selected' : ''}>Saí</option>
                            <option value="fiquei" ${m.status === 'fiquei' ? 'selected' : ''}>Fiquei</option>
                            <option value="transei" ${m.status === 'transei' ? 'selected' : ''}>Transei</option>
                        </select>
                        <button onclick="deleteMatch(${m.id})" class="p-2 text-zinc-700 hover:text-red-500 transition-colors">
                            <i data-lucide="x" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        // Start
        render();
    </script>
</body>
</html>
