<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DateMind | v04.7</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f0f2f5; }
        .tinder-gradient { background: linear-gradient(262deg, #ff7854 0%, #fd267d 100%); }
        .sidebar-item:hover { background-color: #f3f4f6; }
        .glass-badge { background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .loader { border-top-color: #fd267d; animation: spinner 1s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="w-80 bg-white border-r flex flex-col z-20 shadow-xl">
        <div class="p-8 border-b">
            <h1 class="text-2xl font-black text-[#fd267d] tracking-tighter italic uppercase">DateMind</h1>
            <span class="text-[9px] text-gray-400 font-bold tracking-widest uppercase text-center block italic font-mono">v04.7 - Bulletproof</span>
        </div>
        <div class="overflow-y-auto flex-1 px-2 py-4" id="sideList">
            <div id="emptyMsg" class="p-10 text-center text-gray-300">
                <p class="text-[10px] font-black uppercase tracking-widest italic">Aguardando Ficheiro</p>
            </div>
        </div>
        <div class="p-6 bg-gray-50 border-t">
            <label class="tinder-gradient text-white w-full py-4 rounded-2xl font-black text-[10px] uppercase tracking-widest flex items-center justify-center cursor-pointer shadow-lg hover:brightness-110 active:scale-95 transition-all">
                <input type="file" id="chatUpload" class="hidden" accept=".txt">
                Subir Histórico .txt
            </label>
        </div>
    </aside>

    <main class="flex-1 flex flex-col items-center justify-center p-12 relative">
        <div id="loadingOverlay" class="hidden absolute inset-0 bg-white/95 z-50 flex flex-col items-center justify-center backdrop-blur-sm">
            <div class="loader w-14 h-14 border-4 border-gray-100 rounded-full mb-4"></div>
            <p class="text-[#fd267d] font-black text-[10px] uppercase tracking-widest">IA a Processar Dados...</p>
        </div>

        <div id="profileCard" class="hidden w-full max-w-md bg-white rounded-[3rem] shadow-2xl overflow-hidden flex flex-col border border-white animate-pulse">
            <div class="h-72 tinder-gradient relative flex items-end p-8">
                <div id="badgeContainer" class="absolute top-8 right-8 px-4 py-1.5 rounded-full">
                    <span id="interestBadge" class="text-white text-[10px] font-black uppercase tracking-tighter"></span>
                </div>
                <div class="z-10 text-white">
                    <h2 id="cardName" class="text-4xl font-black tracking-tight mb-1 leading-none">Nome</h2>
                    <p class="text-[10px] font-bold opacity-80 uppercase tracking-widest flex items-center gap-2">
                        <i class="fa-solid fa-clock"></i> Última Msg: <span id="lastDate">---</span>
                    </p>
                </div>
                <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
            </div>

            <div class="p-8 space-y-6 bg-white overflow-y-auto" style="max-height: 450px;">
                <section>
                    <h3 class="text-[9px] font-black uppercase tracking-widest text-gray-400 mb-2 border-l-2 border-[#fd267d] pl-2">Análise</h3>
                    <p id="bioText" class="text-gray-600 text-sm leading-relaxed font-medium italic"></p>
                </section>
                
                <section>
                    <h3 class="text-[9px] font-black uppercase tracking-widest text-gray-400 mb-3 border-l-2 border-[#fd267d] pl-2 uppercase">Dossiê</h3>
                    <div id="tagContainer" class="flex flex-wrap gap-2"></div>
                </section>

                <section class="bg-gray-50 p-6 rounded-[2.5rem] border border-gray-100">
                    <h3 class="text-[9px] font-black uppercase text-[#fd267d] mb-2 flex items-center gap-2">
                        <i class="fa-solid fa-wand-magic-sparkles text-xs"></i> Estratégia
                    </h3>
                    <p id="aiInsight" class="text-gray-800 text-sm font-bold italic"></p>
                </section>
            </div>
        </div>

        <div id="welcomeMsg" class="flex flex-col items-center opacity-10">
            <i class="fa-solid fa-comment-dots text-8xl"></i>
        </div>
    </main>

    <script>
        const API_KEY = "AIzaSyA5DZ2XJSw9eNq972bZm3aRXkYPpH7T1XU";

        document.getElementById('chatUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            document.getElementById('loadingOverlay').classList.remove('hidden');

            reader.onload = async (event) => {
                let content = event.target.result;
                // Reduzir ruído para otimizar tokens
                content = content.substring(content.length - 12000); 
                const fileName = file.name.replace('Conversa do WhatsApp com ', '').replace('.txt', '');
                await callGeminiAI(fileName, content);
            };
            reader.readAsText(file);
        });

        async function callGeminiAI(name, chatText) {
            const prompt = `Analise este chat com ${name}. Retorne APENAS um JSON plano, sem aspas duplas dentro dos valores (use aspas simples se necessário). 
            Modelo: {"nome": "N", "ultimo_papo": "D", "ocupacao": "O", "personalidade": "P", "tags": ["T1", "T2"], "insight": "I", "interesse": "Quente"}`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt + "\nChat:\n" + chatText }] }] })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);

                let rawText = data.candidates[0].content.parts[0].text;
                
                // Extração agressiva do JSON
                const start = rawText.indexOf('{');
                const end = rawText.lastIndexOf('}') + 1;
                let jsonStr = rawText.substring(start, end);
                
                // Limpeza de caracteres que quebram o JSON.parse
                jsonStr = jsonStr.replace(/\n/g, " ").replace(/\r/g, " ");

                updateUI(JSON.parse(jsonStr));

            } catch (err) {
                console.error("DEBUG DATEMIND:", err);
                alert("Erro Técnico: " + err.message + "\nVerifique o Console (F12).");
            } finally {
                document.getElementById('loadingOverlay').classList.add('hidden');
                document.getElementById('profileCard').classList.remove('animate-pulse');
            }
        }

        function updateUI(data) {
            document.getElementById('welcomeMsg').classList.add('hidden');
            document.getElementById('profileCard').classList.remove('hidden');
            
            document.getElementById('cardName').innerText = data.nome || "Não Identificado";
            document.getElementById('lastDate').innerText = data.ultimo_papo || "Desconhecida";
            document.getElementById('bioText').innerText = data.personalidade || "";
            document.getElementById('aiInsight').innerText = data.insight || "";
            
            const badge = document.getElementById('badgeContainer');
            const intBadge = document.getElementById('interestBadge');
            const int = (data.interesse || "Morno").toLowerCase();
            intBadge.innerText = data.interesse;

            badge.className = (int === 'quente') ? 
                "absolute top-8 right-8 bg-red-500 shadow-lg px-4 py-1.5 rounded-full animate-bounce" : 
                "absolute top-8 right-8 glass-badge px-4 py-1.5 rounded-full";

            document.getElementById('tagContainer').innerHTML = (data.tags || []).map(t => 
                `<span class="bg-gray-100 text-gray-700 px-3 py-1.5 rounded-xl text-[10px] font-black uppercase border border-gray-100">${t}</span>`
            ).join('');

            // Sidebar Update
            if(document.getElementById('emptyMsg')) document.getElementById('emptyMsg').remove();
            const div = document.createElement('div');
            div.className = "sidebar-item p-4 mb-2 flex items-center cursor-pointer transition-all rounded-2xl mx-2 bg-white shadow-sm border border-gray-50";
            div.innerHTML = `<div class="w-10 h-10 rounded-full tinder-gradient mr-3 flex items-center justify-center text-white font-black text-xs">${(data.nome || "X").charAt(0)}</div><div class="text-sm font-bold text-gray-700">${data.nome}</div>`;
            document.getElementById('sideList').prepend(div);
        }
    </script>
</body>
</html>
