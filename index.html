<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DateMind v11.0 | Simplified CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: #f8fafc; }
        .tinder-gradient { background: linear-gradient(135deg, #ff7854 0%, #fd267d 100%); }
        .glass-card { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 2.5rem; transition: 0.3s ease; cursor: pointer; border-left: 8px solid #94a3b8; }
        .glass-card:hover { transform: translateY(-5px); border-color: #fd267d; }
        .temp-bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.1); overflow: hidden; }
        .temp-fill { height: 100%; transition: width 0.5s ease; }
        .phase-ice { border-left-color: #94a3b8; }
        .phase-fire { border-left-color: #fd267d; }
        .phase-check { border-left-color: #22c55e; }
        .status-btn { opacity: 0.3; transition: 0.3s; cursor: pointer; }
        .status-btn.active { opacity: 1; transform: scale(1.1); }
        .hidden { display: none !important; }
    </style>
</head>
<body class="min-h-screen">

    <div id="mainApp" class="hidden flex flex-col min-h-screen">
        <header class="p-8 flex justify-between items-center sticky top-0 z-50 bg-[#020617]/80 backdrop-blur-xl border-b border-white/5">
            <h1 class="text-3xl font-black italic uppercase tracking-tighter">DateMind <span class="text-[#fd267d]">V11</span></h1>
            <div class="flex items-center gap-6">
                <button id="btnLogout" class="text-[10px] font-black text-slate-500 uppercase">Sair</button>
                <label class="tinder-gradient px-10 py-4 rounded-full font-black text-[10px] uppercase tracking-widest cursor-pointer shadow-2xl flex items-center gap-3">
                    <input type="file" id="chatUpload" class="hidden" accept=".txt">
                    <i class="fa-solid fa-plus"></i> Adicionar Contato
                </label>
            </div>
        </header>
        <main id="crmBoard" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8 p-10"></main>
    </div>

    <div id="modal" class="hidden fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/95 backdrop-blur-2xl">
        <div class="bg-white text-slate-900 w-full max-w-2xl rounded-[4rem] overflow-hidden relative shadow-2xl">
            <button id="btnCloseModal" class="absolute top-10 right-10 text-slate-200 hover:text-rose-500 text-3xl"><i class="fa-solid fa-circle-xmark"></i></button>
            
            <div class="h-48 tinder-gradient p-12 flex flex-col justify-end">
                <input type="text" id="mName" class="bg-transparent text-5xl font-black text-white outline-none border-b border-white/30 mb-4" placeholder="Nome, Idade">
                <div class="flex gap-4">
                    <button onclick="updatePhase('ice')" id="btnIce" class="status-btn active bg-white/20 p-3 rounded-2xl text-xl">❄️</button>
                    <button onclick="updatePhase('fire')" id="btnFire" class="status-btn bg-white/20 p-3 rounded-2xl text-xl">🔥</button>
                    <button onclick="updatePhase('check')" id="btnCheck" class="status-btn bg-white/20 p-3 rounded-2xl text-xl">📍</button>
                </div>
            </div>

            <div class="p-10 space-y-6 overflow-y-auto" style="max-height: 500px;">
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Profissão</label>
                        <input type="text" id="mProf" placeholder="Ex: Advogada" class="w-full p-4 bg-slate-50 rounded-2xl text-sm outline-none">
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Bairro</label>
                        <input type="text" id="mBairro" placeholder="Ex: Aldeota" class="w-full p-4 bg-slate-50 rounded-2xl text-sm outline-none">
                    </div>
                </div>

                <div class="space-y-3">
                    <div class="flex justify-between">
                        <label class="text-[10px] font-black text-slate-400 uppercase">Interesse (%)</label>
                        <input type="number" id="mTempInput" class="w-12 text-sm font-black text-[#fd267d]" value="50">
                    </div>
                    <input type="range" id="mTempSlider" min="0" max="100" class="w-full h-2 bg-slate-100 rounded-lg appearance-none cursor-pointer accent-[#fd267d]">
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] font-black text-slate-400 uppercase ml-4">Notas e Preferências</label>
                    <textarea id="mNotes" class="w-full p-6 bg-slate-50 rounded-[2rem] text-sm text-slate-600 outline-none italic" rows="4" placeholder="O que ela gosta? Tem filhos? Anote aqui..."></textarea>
                </div>

                <div class="flex gap-4">
                    <button id="btnDelete" class="flex-1 py-4 bg-rose-50 text-rose-500 text-[10px] font-black uppercase rounded-2xl">Remover</button>
                    <button id="btnSaveData" class="flex-1 py-4 tinder-gradient text-white text-[10px] font-black uppercase rounded-2xl shadow-xl font-bold">Salvar Dossiê</button>
                </div>
            </div>
        </div>
    </div>

    <div id="authSection" class="hidden h-screen flex items-center justify-center p-6 text-slate-900">
        <div class="bg-white p-14 rounded-[4rem] w-full max-w-sm shadow-2xl text-center">
            <h2 class="text-3xl font-black mb-10 text-[#fd267d]">DATEMIND</h2>
            <input type="email" id="email" placeholder="E-mail" class="w-full p-5 bg-slate-100 rounded-3xl mb-4 outline-none">
            <input type="password" id="pass" placeholder="Senha" class="w-full p-5 bg-slate-100 rounded-3xl mb-8 outline-none">
            <button id="btnPrimary" class="tinder-gradient w-full py-5 rounded-3xl text-white font-black uppercase shadow-lg">Entrar</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, onSnapshot, orderBy, doc, deleteDoc, updateDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCV1GoLh63JnbosKXY4eTMptOUedA29Jcs", authDomain: "memorymsg.firebaseapp.com", projectId: "memorymsg", storageBucket: "memorymsg.firebasestorage.app", messagingSenderId: "66381936065", appId: "1:66381936065:web:b440c0bbdfe63804f32b40" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        document.getElementById('btnPrimary').onclick = async () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            try { await signInWithEmailAndPassword(auth, email, pass); }
            catch { await createUserWithEmailAndPassword(auth, email, pass).catch(e => alert("Erro no acesso.")); }
        };
        document.getElementById('btnLogout').onclick = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) { document.getElementById('authSection').classList.add('hidden'); document.getElementById('mainApp').classList.remove('hidden'); syncBoard(user.uid); }
            else { document.getElementById('authSection').classList.remove('hidden'); document.getElementById('mainApp').classList.add('hidden'); }
        });

        // UPLOAD SIMPLIFICADO (SEM IA)
        document.getElementById('chatUpload').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            let rawName = file.name.replace('.txt','').replace('Conversa do WhatsApp com ','').split(' ')[0].toLowerCase();
            const cleanName = rawName.charAt(0).toUpperCase() + rawName.slice(1);

            const profileData = { nome: cleanName, tags: [], interesse: 50, notas: "", uid: auth.currentUser.uid, createdAt: Date.now(), fase: "ice" };
            
            const q = query(collection(db, "profiles"), where("uid", "==", auth.currentUser.uid), where("nome", "==", cleanName));
            const snap = await getDocs(q);
            if (snap.empty) { await addDoc(collection(db, "profiles"), profileData); }
            alert("Contato " + cleanName + " adicionado!");
        };

        function syncBoard(uid) {
            const q = query(collection(db, "profiles"), where("uid", "==", uid));
            onSnapshot(q, (snap) => {
                const board = document.getElementById('crmBoard'); board.innerHTML = '';
                let docs = []; snap.forEach(d => docs.push({id: d.id, ...d.data()}));
                docs.sort((a,b) => b.createdAt - a.createdAt);

                docs.forEach(d => {
                    const card = document.createElement('div');
                    card.className = `glass-card p-8 animate-in fade-in phase-${d.fase || 'ice'}`;
                    card.onclick = () => {
                        window.currentProfileId = d.id;
                        document.getElementById('mName').value = d.nome;
                        document.getElementById('mProf').value = d.profissao || "";
                        document.getElementById('mBairro').value = d.bairro || "";
                        document.getElementById('mNotes').value = d.notas || "";
                        document.getElementById('mTempSlider').value = d.interesse || 50;
                        document.getElementById('mTempInput').value = d.interesse || 50;
                        updateStatusButtons(d.fase || 'ice');
                        document.getElementById('modal').classList.remove('hidden');
                    };
                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-4"><h3 class="text-2xl font-black uppercase tracking-tighter">${d.nome}</h3><span class="text-[10px] font-black text-[#fd267d]">${d.interesse}%</span></div>
                        <div class="temp-bar bg-white/5 mb-6"><div class="temp-fill tinder-gradient" style="width: ${d.interesse}%"></div></div>
                        <div class="flex flex-wrap gap-2">
                            ${d.profissao ? `<span class="bg-white/5 text-[8px] font-bold px-3 py-1.5 rounded-lg text-slate-400 uppercase">💼 ${d.profissao}</span>` : ''}
                            ${d.bairro ? `<span class="bg-white/5 text-[8px] font-bold px-3 py-1.5 rounded-lg text-slate-400 uppercase">🏠 ${d.bairro}</span>` : ''}
                        </div>
                    `;
                    board.appendChild(card);
                });
            });
        }

        document.getElementById('mTempSlider').oninput = (e) => { document.getElementById('mTempInput').value = e.target.value; };
        document.getElementById('btnSaveData').onclick = async () => {
            const data = { 
                nome: document.getElementById('mName').value,
                profissao: document.getElementById('mProf').value,
                bairro: document.getElementById('mBairro').value,
                notas: document.getElementById('mNotes').value,
                interesse: parseInt(document.getElementById('mTempSlider').value)
            };
            await updateDoc(doc(db, "profiles", window.currentProfileId), data);
            document.getElementById('modal').classList.add('hidden');
        };

        window.updatePhase = async (p) => { await updateDoc(doc(db, "profiles", window.currentProfileId), { fase: p }); updateStatusButtons(p); };
        function updateStatusButtons(active) { ['ice', 'fire', 'check'].forEach(p => { document.getElementById('btn' + p.charAt(0).toUpperCase() + p.slice(1)).classList.toggle('active', p === active); }); }
        document.getElementById('btnCloseModal').onclick = () => document.getElementById('modal').classList.add('hidden');
        document.getElementById('btnDelete').onclick = async () => { if(confirm("Remover?")) { await deleteDoc(doc(db, "profiles", window.currentProfileId)); document.getElementById('modal').classList.add('hidden'); } };
    </script>
</body>
</html>
