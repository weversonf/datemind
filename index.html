<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DateMind v12 | Strategic Funnel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: #f8fafc; }
        .tinder-gradient { background: linear-gradient(135deg, #ff7854 0%, #fd267d 100%); }
        .glass-card { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 2.5rem; transition: 0.3s ease; cursor: pointer; border-left: 8px solid #94a3b8; }
        .glass-card:hover { transform: translateY(-5px); border-color: #fd267d; }
        
        /* Cores das Fases */
        .phase-ice { border-left-color: #94a3b8; }    /* Conversando */
        .phase-fire { border-left-color: #f59e0b; }   /* Marcado */
        .phase-flow { border-left-color: #fd267d; }   /* Fiquei */
        .phase-elite { border-left-color: #8b5cf6; }  /* VIP/Final */

        .status-btn { opacity: 0.2; transition: 0.3s; cursor: pointer; filter: grayscale(1); }
        .status-btn.active { opacity: 1; transform: scale(1.2); filter: grayscale(0); }
        
        .filter-btn { padding: 8px 20px; border-radius: 12px; font-size: 10px; font-weight: 800; text-transform: uppercase; border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; }
        .filter-btn.active { background: white; color: black; border-color: white; }
        
        .temp-bar { height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
        .temp-fill { height: 100%; transition: width 0.5s ease; }
    </style>
</head>
<body class="min-h-screen">

    <div id="mainApp" class="hidden flex flex-col min-h-screen">
        <header class="p-8 sticky top-0 z-50 bg-[#020617]/90 backdrop-blur-xl border-b border-white/5">
            <div class="flex justify-between items-center mb-8">
                <h1 class="text-2xl font-black italic uppercase tracking-tighter">DateMind <span class="text-[#fd267d]">V12</span></h1>
                <div class="flex items-center gap-4">
                    <button id="btnLogout" class="text-[10px] font-black text-slate-500 uppercase">Sair</button>
                    <label class="tinder-gradient px-6 py-3 rounded-2xl font-black text-[10px] uppercase cursor-pointer">
                        <input type="file" id="chatUpload" class="hidden" accept=".txt"> Novo Contato
                    </label>
                </div>
            </div>
            
            <div class="flex gap-2 overflow-x-auto pb-2 no-scrollbar">
                <button onclick="filterBy('all')" class="filter-btn active" id="f-all">Todos</button>
                <button onclick="filterBy('ice')" class="filter-btn" id="f-ice">❄️ Conversando</button>
                <button onclick="filterBy('fire')" class="filter-btn" id="f-fire">🔥 Marcado</button>
                <button onclick="filterBy('flow')" class="filter-btn" id="f-flow">✨ Flow</button>
                <button onclick="filterBy('elite')" class="filter-btn" id="f-elite">🏆 Elite</button>
            </div>
        </header>

        <main id="crmBoard" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 p-8"></main>
    </div>

    <div id="modal" class="hidden fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/95 backdrop-blur-2xl">
        <div class="bg-white text-slate-900 w-full max-w-xl rounded-[3rem] overflow-hidden relative shadow-2xl">
            <div class="h-40 tinder-gradient p-10 flex flex-col justify-end">
                <input type="text" id="mName" class="bg-transparent text-4xl font-black text-white outline-none border-b border-white/20 mb-4 uppercase italic">
                <div class="flex gap-6">
                    <button onclick="updatePhase('ice')" id="btnIce" class="status-btn" title="Conversando">❄️</button>
                    <button onclick="updatePhase('fire')" id="btnFire" class="status-btn" title="Marcado">🔥</button>
                    <button onclick="updatePhase('flow')" id="btnFlow" class="status-btn" title="Fiquei">✨</button>
                    <button onclick="updatePhase('elite')" id="btnElite" class="status-btn" title="VIP">🏆</button>
                </div>
            </div>

            <div class="p-8 space-y-6">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="mProf" placeholder="Profissão" class="p-4 bg-slate-50 rounded-2xl text-xs outline-none">
                    <input type="text" id="mBairro" placeholder="Bairro" class="p-4 bg-slate-50 rounded-2xl text-xs outline-none">
                </div>
                
                <div class="space-y-2">
                    <div class="flex justify-between text-[10px] font-black uppercase text-slate-400 px-2">
                        <span>Nível de Interesse</span>
                        <span id="tempVal">50%</span>
                    </div>
                    <input type="range" id="mTempSlider" min="0" max="100" class="w-full h-1 bg-slate-100 rounded-lg appearance-none accent-[#fd267d]">
                </div>

                <textarea id="mNotes" class="w-full p-6 bg-slate-50 rounded-3xl text-sm outline-none italic" rows="3" placeholder="Notas estratégicas..."></textarea>

                <div class="flex gap-3">
                    <button id="btnDelete" class="p-4 bg-rose-50 text-rose-500 rounded-2xl hover:bg-rose-100 transition-all"><i class="fa-solid fa-trash"></i></button>
                    <button id="btnSaveData" class="flex-1 py-4 tinder-gradient text-white text-[10px] font-black uppercase rounded-2xl shadow-xl">Salvar Alterações</button>
                </div>
            </div>
        </div>
    </div>

    <div id="authSection" class="hidden h-screen flex items-center justify-center p-6 text-slate-900">
        <div class="bg-white p-12 rounded-[3.5rem] w-full max-w-sm shadow-2xl text-center">
            <h2 class="text-3xl font-black mb-8 text-[#fd267d] italic">DATEMIND</h2>
            <input type="email" id="email" placeholder="E-mail" class="w-full p-4 bg-slate-100 rounded-2xl mb-3 outline-none">
            <input type="password" id="pass" placeholder="Senha" class="w-full p-4 bg-slate-100 rounded-2xl mb-6 outline-none">
            <button id="btnPrimary" class="tinder-gradient w-full py-4 rounded-2xl text-white font-black uppercase shadow-lg">Entrar</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, onSnapshot, doc, deleteDoc, updateDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCV1GoLh63JnbosKXY4eTMptOUedA29Jcs", authDomain: "memorymsg.firebaseapp.com", projectId: "memorymsg", storageBucket: "memorymsg.firebasestorage.app", messagingSenderId: "66381936065", appId: "1:66381936065:web:b440c0bbdfe63804f32b40" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentFilter = 'all';

        // AUTH
        document.getElementById('btnPrimary').onclick = async () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            try { await signInWithEmailAndPassword(auth, email, pass); }
            catch { await createUserWithEmailAndPassword(auth, email, pass); }
        };
        document.getElementById('btnLogout').onclick = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) { document.getElementById('authSection').classList.add('hidden'); document.getElementById('mainApp').classList.remove('hidden'); syncBoard(user.uid); }
            else { document.getElementById('authSection').classList.remove('hidden'); document.getElementById('mainApp').classList.add('hidden'); }
        });

        // FILTRO
        window.filterBy = (f) => {
            currentFilter = f;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('f-'+f).classList.add('active');
            syncBoard(auth.currentUser.uid);
        };

        // BOARD
        function syncBoard(uid) {
            let q = query(collection(db, "profiles"), where("uid", "==", uid));
            onSnapshot(q, (snap) => {
                const board = document.getElementById('crmBoard'); board.innerHTML = '';
                let docs = []; snap.forEach(d => {
                    const data = d.data();
                    if (currentFilter === 'all' || data.fase === currentFilter) {
                        docs.push({id: d.id, ...data});
                    }
                });
                docs.sort((a,b) => b.createdAt - a.createdAt);

                docs.forEach(d => {
                    const card = document.createElement('div');
                    card.className = `glass-card p-6 phase-${d.fase || 'ice'}`;
                    card.onclick = () => openModal(d);
                    card.innerHTML = `
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-lg font-black uppercase italic">${d.nome}</h3>
                            <span class="text-[9px] font-black opacity-40">${(d.fase || 'ice').toUpperCase()}</span>
                        </div>
                        <div class="temp-bar mb-4"><div class="temp-fill tinder-gradient" style="width: ${d.interesse}%"></div></div>
                        <div class="flex flex-wrap gap-2">
                            ${d.profissao ? `<span class="text-[8px] font-bold text-slate-400 uppercase">💼 ${d.profissao}</span>` : ''}
                            ${d.bairro ? `<span class="text-[8px] font-bold text-slate-400 uppercase">🏠 ${d.bairro}</span>` : ''}
                        </div>
                    `;
                    board.appendChild(card);
                });
            });
        }

        function openModal(d) {
            window.currentProfileId = d.id;
            document.getElementById('mName').value = d.nome;
            document.getElementById('mProf').value = d.profissao || "";
            document.getElementById('mBairro').value = d.bairro || "";
            document.getElementById('mNotes').value = d.notas || "";
            document.getElementById('mTempSlider').value = d.interesse || 50;
            document.getElementById('tempVal').innerText = (d.interesse || 50) + '%';
            updateStatusButtons(d.fase || 'ice');
            document.getElementById('modal').classList.remove('hidden');
        }

        document.getElementById('chatUpload').onchange = async (e) => {
            const file = e.target.files[0]; if (!file) return;
            let name = file.name.replace('.txt','').split(' ')[0];
            await addDoc(collection(db, "profiles"), { nome: name, fase: "ice", interesse: 50, uid: auth.currentUser.uid, createdAt: Date.now() });
        };

        document.getElementById('mTempSlider').oninput = (e) => { document.getElementById('tempVal').innerText = e.target.value + '%'; };
        
        document.getElementById('btnSaveData').onclick = async () => {
            await updateDoc(doc(db, "profiles", window.currentProfileId), {
                nome: document.getElementById('mName').value,
                profissao: document.getElementById('mProf').value,
                bairro: document.getElementById('mBairro').value,
                notas: document.getElementById('mNotes').value,
                interesse: parseInt(document.getElementById('mTempSlider').value)
            });
            document.getElementById('modal').classList.add('hidden');
        };

        window.updatePhase = async (p) => { 
            await updateDoc(doc(db, "profiles", window.currentProfileId), { fase: p }); 
            updateStatusButtons(p); 
        };

        function updateStatusButtons(active) {
            ['Ice', 'Fire', 'Flow', 'Elite'].forEach(p => {
                document.getElementById('btn' + p).classList.toggle('active', p.toLowerCase() === active);
            });
        }

        document.getElementById('btnCloseModal').onclick = () => document.getElementById('modal').classList.add('hidden');
        document.getElementById('btnDelete').onclick = async () => { if(confirm("Remover?")) { await deleteDoc(doc(db, "profiles", window.currentProfileId)); document.getElementById('modal').classList.add('hidden'); } };
    </script>
</body>
</html>
