<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DateMind v08.4.3 | GitHub Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .tinder-gradient { background: linear-gradient(135deg, #ff7854 0%, #fd267d 100%); }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); cursor: pointer; transition: all 0.3s ease; }
        #loadingOverlay { background: #0f172a; position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="min-h-screen">

    <div id="loadingOverlay">
        <div class="flex flex-col items-center">
            <i class="fa-solid fa-fire text-[#fd267d] text-5xl animate-pulse"></i>
            <p class="text-[10px] font-black uppercase tracking-[0.3em] mt-4 opacity-50">Sincronizando Dossiês...</p>
        </div>
    </div>

    <div id="authSection" class="hidden h-screen flex items-center justify-center p-6">
        <div class="bg-white p-10 md:p-14 rounded-[3rem] w-full max-w-md shadow-2xl text-slate-900">
            <div class="text-center mb-8">
                <i class="fa-solid fa-fire text-[#fd267d] text-6xl mb-4"></i>
                <h2 id="authTitle" class="text-3xl font-black italic tracking-tighter uppercase">DateMind</h2>
            </div>
            <div class="space-y-4">
                <input type="email" id="email" placeholder="E-mail" class="w-full p-4 bg-slate-100 rounded-2xl outline-none">
                <input type="password" id="pass" placeholder="Senha" class="w-full p-4 bg-slate-100 rounded-2xl outline-none">
                <button id="btnPrimary" class="tinder-gradient w-full py-4 rounded-2xl text-white font-black uppercase tracking-widest shadow-lg">Entrar</button>
                <div class="pt-6 text-center border-t">
                    <button id="btnSwitch" class="text-[10px] font-black uppercase text-slate-400 hover:text-[#fd267d]">Alternar Login/Cadastro</button>
                </div>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden flex flex-col min-h-screen">
        <header class="p-6 border-b border-white/10 flex justify-between items-center sticky top-0 z-40 bg-[#0f172a]/95 backdrop-blur-md">
            <h1 class="text-xl font-black italic uppercase">DateMind <span class="text-[#fd267d]">PRO</span></h1>
            <div class="flex items-center gap-4">
                <button id="btnLogout" class="text-[10px] font-black uppercase text-slate-500 hover:text-white transition-colors">Sair da Conta</button>
                <label class="tinder-gradient px-8 py-3 rounded-full font-bold text-[10px] uppercase tracking-widest cursor-pointer shadow-xl flex items-center gap-2">
                    <input type="file" id="chatUpload" class="hidden" accept=".txt">
                    <i class="fa-solid fa-plus-circle"></i> Enviar Dossiê
                </label>
            </div>
        </header>
        <main id="crmBoard" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 p-8"></main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, onSnapshot, orderBy } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCV1GoLh63JnbosKXY4eTMptOUedA29Jcs",
            authDomain: "memorymsg.firebaseapp.com",
            projectId: "memorymsg",
            storageBucket: "memorymsg.firebasestorage.app",
            messagingSenderId: "66381936065",
            appId: "1:66381936065:web:b440c0bbdfe63804f32b40"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let isLoginMode = true;

        // CORREÇÃO DOS CLIQUES (VINCULANDO EVENTOS VIA JAVASCRIPT)
        document.getElementById('btnSwitch').onclick = () => {
            isLoginMode = !isLoginMode;
            document.getElementById('authTitle').innerText = isLoginMode ? "DATEMIND" : "CADASTRO";
            document.getElementById('btnPrimary').innerText = isLoginMode ? "Entrar" : "Criar Conta";
        };

        document.getElementById('btnPrimary').onclick = () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            if (isLoginMode) {
                signInWithEmailAndPassword(auth, email, pass).catch(e => alert("Erro: " + e.message));
            } else {
                createUserWithEmailAndPassword(auth, email, pass).catch(e => alert("Erro: " + e.message));
            }
        };

        document.getElementById('btnLogout').onclick = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            document.getElementById('loadingOverlay').classList.add('hidden');
            if (user) {
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                syncBoard(user.uid);
            } else {
                document.getElementById('authSection').classList.remove('hidden');
                document.getElementById('mainApp').classList.add('hidden');
            }
        });

        // MOTOR DE ANÁLISE OLD SCHOOL (PARA FUNCIONAR SEM CHAVE DE API GOOGLE)
        document.getElementById('chatUpload').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const text = await file.text();
            const lowText = text.toLowerCase();
            const tags = [];

            // Captura de Itens Chave
            if (lowText.includes("filho") || lowText.includes("filha")) tags.push("👶 Pais");
            const bairro = lowText.match(/moro no ([\wáéíóúâêîôûãõç]+)/) || lowText.match(/moro em ([\wáéíóúâêîôûãõç]+)/);
            if(bairro) tags.push("📍 " + bairro[1]);
            const prof = lowText.match(/sou ([\wáéíóúâêîôûãõç]+)/) || lowText.match(/trabalho com ([\wáéíóúâêîôûãõç]+)/);
            if(prof && !['eu','você'].includes(prof[1])) tags.push("💼 " + prof[1]);

            const profile = {
                nome: file.name.split(' ')[0],
                tags: tags,
                uid: auth.currentUser.uid,
                createdAt: Date.now(),
                status: "🔥 Processado"
            };

            await addDoc(collection(db, "profiles"), profile);
        };

        function syncBoard(uid) {
            const q = query(collection(db, "profiles"), where("uid", "==", uid), orderBy("createdAt", "desc"));
            onSnapshot(q, (snap) => {
                const board = document.getElementById('crmBoard');
                board.innerHTML = '';
                snap.forEach(docSnap => {
                    const d = docSnap.data();
                    const card = document.createElement('div');
                    card.className = "glass-card rounded-[2.5rem] p-8 animate-in fade-in duration-500";
                    card.innerHTML = `
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-2xl font-black">${d.nome}</h3>
                            <span class="text-[8px] font-black uppercase text-rose-500">${d.status}</span>
                        </div>
                        <div class="flex flex-wrap gap-2">
                            ${d.tags.map(t => `<span class="bg-slate-800 text-[8px] font-bold px-2 py-1 rounded-md text-slate-400 border border-white/5 uppercase">${t}</span>`).join('')}
                        </div>
                    `;
                    board.appendChild(card);
                });
            });
        }
    </script>
</body>
</html>
