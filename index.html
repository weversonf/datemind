<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DateMind | v04.1</title>
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <link href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css)" rel="stylesheet">
    <style>
        .tinder-gradient { background: linear-gradient(262deg, #ff7854 0%, #fd267d 100%); }
        .sidebar-item:hover { background-color: #f3f4f6; }
        .active-match { border-right: 4px solid #fd267d; background-color: #fff1f2; }
        .loader { border-top-color: #fd267d; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        body { background-color: #f0f2f5; font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="w-80 bg-white border-r flex flex-col z-20 shadow-lg">
        <div class="p-6 border-b flex items-center justify-between">
            <h1 class="text-2xl font-bold text-[#fd267d]"><i class="fa-solid fa-fire"></i> DateMind</h1>
            <span class="text-[10px] bg-gray-100 px-2 py-1 rounded text-gray-400 font-mono font-bold">v04.1</span>
        </div>
        
        <div class="overflow-y-auto flex-1" id="sideList">
            <div class="p-8 text-center text-gray-400 text-sm italic" id="emptyMsg">
                Nenhum histórico carregado.
            </div>
        </div>

        <div class="p-4 border-t bg-gray-50">
            <label class="tinder-gradient text-white w-full py-4 rounded-2xl font-bold flex items-center justify-center cursor-pointer shadow-lg hover:scale-[1.02] active:scale-95 transition-all">
                <i class="fa-solid fa-cloud-arrow-up mr-2"></i> Importar WhatsApp .txt
                <input type="file" id="chatUpload" class="hidden" accept=".txt">
            </label>
        </div>
    </aside>

    <main class="flex-1 flex flex-col items-center justify-center p-10 relative">
        
        <div id="loadingOverlay" class="hidden absolute inset-0 bg-white/80 z-50 flex flex-col items-center justify-center backdrop-blur-sm">
            <div class="loader w-12 h-12 border-4 border-gray-200 rounded-full mb-4"></div>
            <p class="text-[#fd267d] font-bold animate-pulse text-center">IA analisando sentimentos e fatos...<br><span class="text-xs text-gray-400 font-normal">Isso pode levar alguns segundos.</span></p>
        </div>

        <div id="profileCard" class="hidden w-full max-w-md bg-white rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col border border-gray-100 transition-all duration-500">
            
            <div class="h-64 tinder-gradient relative">
                <div class="absolute top-6 right-6">
                    <span id="interestBadge" class="bg-white/20 backdrop-blur-md text-white px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest border border-white/30">Morno</span>
                </div>
                <div class="absolute bottom-6 left-8 text-white z-10">
                    <h2 class="text-3xl font-extrabold" id="cardName">Nome</h2>
                    <p class="text-sm opacity-90 flex items-center gap-2 font-medium">
                        <i class="fa-solid fa-briefcase"></i> <span id="jobTitle">Ocupação</span>
                    </p>
                </div>
            </div>

            <div class="p-8 overflow-y-auto bg-white" style="max-height: 450px;">
                <section class="mb-6">
                    <h3 class="text-[10px] font-black uppercase tracking-widest text-gray-400 mb-3 text-center">Perfil do Contatinho</h3>
                    <p id="bioText" class="text-gray-700 text-sm leading-relaxed font-medium text-center italic"></p>
                </section>

                <section class="mb-6 border-t border-b py-4">
                    <h3 class="text-[10px] font-black uppercase tracking-widest text-gray-400 mb-3 text-center tracking-widest">Dossiê de Interesses</h3>
                    <div id="tagContainer" class="flex flex-wrap gap-2 justify-center"></div>
                </section>

                <div class="p-6 bg-rose-50 rounded-3xl border border-rose-100">
                    <h3 class="text-[10px] font-black uppercase text-[#fd267d] mb-2 flex items-center gap-2">
                        <i class="fa-solid fa-chess-knight"></i> Jogada Estratégica:
                    </h3>
                    <p id="aiInsight" class="text-sm text-gray-800 font-semibold italic"></p>
                </div>
            </div>
        </div>

        <div id="welcomeMsg" class="text-gray-300 flex flex-col items-center">
            <i class="fa-solid fa-address-book text-8xl mb-4 opacity-10"></i>
            <p class="text-xl font-medium text-gray-400 uppercase tracking-widest text-sm">Seu CRM Amoroso v04.1</p>
        </div>
    </main>

    <script>
        const API_KEY = "AIzaSyA5DZ2XJSw9eNq972bZm3aRXkYPpH7T1XU";

        document.getElementById('chatUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = async function(event) {
                    const content = event.target.result;
                    const fileName = file.name.replace('.txt', '').replace('Conversa do WhatsApp com ', '');
                    document.getElementById('loadingOverlay').classList.remove('hidden');
                    await callGeminiAI(fileName, content);
                };
                reader.readAsText(file);
            }
        });

        async function callGeminiAI(name, chatText) {
            const truncatedChat = chatText.slice(-15000); 

            const prompt = `Analise este chat de WhatsApp com ${name}. 
            Retorne APENAS um objeto JSON puro, sem markdown, seguindo este modelo:
            {
              "nome": "Nome",
              "ocupacao": "Área de atuação",
              "personalidade": "Resumo em 2 frases",
              "tags": ["Tag1", "Tag2", "Tag3", "Tag4"],
              "insight": "Dica estratégica",
              "interesse": "Frio, Morno ou Quente"
            }
            Conversa: ${truncatedChat}`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                let responseText = data.candidates[0].content.parts[0].text;
                
                // LIMPEZA DE SEGURANÇA PARA O JSON
                const cleanJson = responseText.replace(/```json/g, "").replace(/```/g, "").trim();
                const profileData = JSON.parse(cleanJson);

                updateUI(profileData);

            } catch (error) {
                console.error("Erro na análise:", error);
                alert("Erro ao ler o JSON da IA. Tente novamente com outro arquivo ou verifique se o chat é muito curto.");
            } finally {
                document.getElementById('loadingOverlay').classList.add('hidden');
            }
        }

        function updateUI(data) {
            document.getElementById('welcomeMsg').classList.add('hidden');
            document.getElementById('profileCard').classList.remove('hidden');

            document.getElementById('cardName').innerText = data.nome;
            document.getElementById('jobTitle').innerText = data.ocupacao;
            document.getElementById('bioText').innerText = data.personalidade;
            document.getElementById('aiInsight').innerText = data.insight;
            document.getElementById('interestBadge').innerText = data.interesse;

            // Cores do Badge de Interesse
            const badge = document.getElementById('interestBadge');
            if(data.interesse.toLowerCase() === 'quente') badge.className = "bg-red-500 text-white px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest shadow-lg animate-pulse";
            else if(data.interesse.toLowerCase() === 'morno') badge.className = "bg-orange-400 text-white px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest";
            else badge.className = "bg-blue-400 text-white px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest";

            document.getElementById('tagContainer').innerHTML = data.tags.map(t => 
                `<span class="bg-gray-100 text-gray-700 px-3 py-1.5 rounded-xl text-[10px] font-black uppercase border border-gray-200">${t}</span>`
            ).join('');
            
            const sideList = document.getElementById('sideList');
            if(document.getElementById('emptyMsg')) document.getElementById('emptyMsg').remove();
            
            const div = document.createElement('div');
            div.className = "sidebar-item active-match p-4 flex items-center cursor-pointer transition border-b border-gray-50";
            div.innerHTML = `
                <div class="w-10 h-10 rounded-full tinder-gradient mr-3 flex items-center justify-center text-white font-bold text-xs">${data.nome.charAt(0)}</div>
                <div class="flex-1">
                    <div class="font-bold text-gray-800 text-sm">${data.nome}</div>
                    <div class="text-[9px] text-gray-400 font-bold uppercase">${data.interesse}</div>
                </div>
            `;
            sideList.prepend(div);
        }
    </script>
</body>
</html>
