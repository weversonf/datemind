<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DateMind | v04.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #f0f2f5; }
        .tinder-gradient { background: linear-gradient(262deg, #ff7854 0%, #fd267d 100%); }
        .sidebar-item:hover { background-color: #f3f4f6; }
        .active-match { border-right: 4px solid #fd267d; background-color: #fff1f2; }
        
        /* Glassmorphism */
        .glass-badge {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* Animação de entrada do Card */
        .card-appear {
            animation: slideUp 0.6s cubic-bezier(0.17, 0.67, 0.83, 0.67);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loader { border-top-color: #fd267d; animation: spinner 1s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="w-80 bg-white border-r flex flex-col z-20 shadow-xl">
        <div class="p-8 border-b flex flex-col gap-1">
            <h1 class="text-2xl font-black text-[#fd267d] tracking-tighter italic">
                <i class="fa-solid fa-fire-flame-curved"></i> DATEMIND
            </h1>
            <span class="text-[9px] text-gray-400 font-bold tracking-widest uppercase">Inteligência Amorosa v04.2</span>
        </div>
        
        <div class="overflow-y-auto flex-1 px-2 py-4" id="sideList">
            <div id="emptyMsg" class="p-10 text-center text-gray-300">
                <i class="fa-solid fa-cloud-arrow-up text-3xl mb-4 block opacity-20"></i>
                <p class="text-xs font-bold uppercase tracking-tight">Importe um histórico para começar</p>
            </div>
        </div>

        <div class="p-6 bg-gray-50 border-t">
            <label class="tinder-gradient text-white w-full py-4 rounded-2xl font-black text-xs uppercase tracking-widest flex items-center justify-center cursor-pointer shadow-lg hover:brightness-110 active:scale-95 transition-all">
                <input type="file" id="chatUpload" class="hidden" accept=".txt">
                Subir conversa .txt
            </label>
        </div>
    </aside>

    <main class="flex-1 flex flex-col items-center justify-center p-12 bg-[#f0f2f5] relative">
        
        <div id="loadingOverlay" class="hidden absolute inset-0 bg-white/90 z-50 flex flex-col items-center justify-center backdrop-blur-md">
            <div class="loader w-14 h-14 border-4 border-gray-100 rounded-full mb-6"></div>
            <p class="text-gray-900 font-black text-sm uppercase tracking-widest">A analisar conexões...</p>
        </div>

        <div id="profileCard" class="hidden w-full max-w-md bg-white rounded-[3rem] shadow-[0_20px_50px_rgba(0,0,0,0.1)] overflow-hidden flex flex-col card-appear border border-white">
            
            <div class="h-80 tinder-gradient relative flex items-end p-8">
                <div class="absolute top-8 right-8 glass-badge px-4 py-1.5 rounded-full">
                    <span id="interestBadge" class="text-white text-[10px] font-black uppercase tracking-tighter">Analizando...</span>
                </div>
                <div class="z-10 text-white">
                    <div class="flex items-center gap-2 mb-1">
                        <h2 id="cardName" class="text-4xl font-black tracking-tight">Nome</h2>
                        <i class="fa-solid fa-circle-check text-blue-400 text-lg"></i>
                    </div>
                    <p class="text-sm font-semibold opacity-90 uppercase tracking-widest flex items-center gap-2">
                        <i class="fa-solid fa-briefcase text-xs"></i> <span id="jobTitle">Ocupação</span>
                    </p>
                </div>
                <div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>
            </div>

            <div class="p-8 space-y-8 bg-white overflow-y-auto" style="max-height: 420px;">
                
                <section>
                    <div class="flex items-center gap-2 mb-3">
                        <div class="w-1 h-4 tinder-gradient rounded-full"></div>
                        <h3 class="text-[10px] font-black uppercase tracking-widest text-gray-400">Vibe da Pessoa</h3>
                    </div>
                    <p id="bioText" class="text-gray-600 text-sm leading-relaxed font-medium"></p>
                </section>

                <section>
                    <div class="flex items-center gap-2 mb-4">
                        <div class="w-1 h-4 tinder-gradient rounded-full"></div>
                        <h3 class="text-[10px] font-black uppercase tracking-widest text-gray-400">Dossiê de Interesses</h3>
                    </div>
                    <div id="tagContainer" class="flex flex-wrap gap-2"></div>
                </section>

                <section class="bg-gray-50 p-6 rounded-[2rem] border border-gray-100">
                    <h3 class="text-[10px] font-black uppercase text-[#fd267d] mb-3 flex items-center gap-2">
                        <i class="fa-solid fa-chess-knight"></i> Jogada Estratégica
                    </h3>
                    <p id="aiInsight" class="text-gray-800 text-sm font-bold italic leading-snug"></p>
                </section>
            </div>

            <div class="p-8 flex justify-between items-center bg-white border-t border-gray-50">
                <button class="w-12 h-12 rounded-full border border-gray-100 text-yellow-500 shadow-sm flex items-center justify-center hover:scale-110 transition"><i class="fa-solid fa-rotate-left"></i></button>
                <button class="w-16 h-16 rounded-full bg-white border border-gray-100 text-red-500 shadow-lg flex items-center justify-center text-2xl font-bold hover:scale-110 transition">✕</button>
                <button class="w-16 h-16 rounded-full bg-white border border-gray-100 text-green-500 shadow-lg flex items-center justify-center text-2xl hover:scale-110 transition"><i class="fa-solid fa-heart"></i></button>
                <button class="w-12 h-12 rounded-full border border-gray-100 text-purple-500 shadow-sm flex items-center justify-center hover:scale-110 transition"><i class="fa-solid fa-bolt"></i></button>
            </div>
        </div>

        <div id="welcomeMsg" class="flex flex-col items-center text-center max-w-xs">
            <div class="w-24 h-24 rounded-full bg-white shadow-xl flex items-center justify-center mb-6">
                <i class="fa-solid fa-fire text-4xl text-gray-200"></i>
            </div>
            <h3 class="text-gray-400 font-black uppercase tracking-widest text-xs mb-2">Pronto para a análise</h3>
            <p class="text-gray-400 text-sm">Carrega um ficheiro .txt para desbloquear o CRM inteligente.</p>
        </div>
    </main>

    <script>
        const API_KEY = "AIzaSyA5DZ2XJSw9eNq972bZm3aRXkYPpH7T1XU";

        document.getElementById('chatUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = async function(event) {
                    const content = event.target.result;
                    const fileName = file.name.replace('.txt', '').replace('Conversa do WhatsApp com ', '');
                    document.getElementById('loadingOverlay').classList.remove('hidden');
                    await callGeminiAI(fileName, content);
                };
                reader.readAsText(file);
            }
        });

        async function callGeminiAI(name, chatText) {
            const truncatedChat = chatText.slice(-15000); 
            const prompt = `Analise este chat com ${name}. Retorne APENAS um JSON:
            {"nome": "Nome", "ocupacao": "Área", "personalidade": "Resumo 2 frases", "tags": ["Tag1", "Tag2", "Tag3"], "insight": "Dica estratégica", "interesse": "Frio, Morno ou Quente"}`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                let responseText = data.candidates[0].content.parts[0].text;
                const cleanJson = responseText.replace(/```json/g, "").replace(/```/g, "").trim();
                updateUI(JSON.parse(cleanJson));
            } catch (e) { alert("Erro ao processar. Tenta novamente."); }
            finally { document.getElementById('loadingOverlay').classList.add('hidden'); }
        }

        function updateUI(data) {
            document.getElementById('welcomeMsg').classList.add('hidden');
            document.getElementById('profileCard').classList.remove('hidden');
            
            // Textos
            document.getElementById('cardName').innerText = data.nome;
            document.getElementById('jobTitle').innerText = data.ocupacao;
            document.getElementById('bioText').innerText = data.personalidade;
            document.getElementById('aiInsight').innerText = data.insight;
            
            // Badge de Interesse
            const badge = document.getElementById('interestBadge');
            badge.innerText = data.interesse;
            if(data.interesse.toLowerCase() === 'quente') badge.parentElement.className = "absolute top-8 right-8 bg-red-500 shadow-[0_0_15px_rgba(239,68,68,0.5)] px-4 py-1.5 rounded-full animate-pulse";
            else badge.parentElement.className = "absolute top-8 right-8 glass-badge px-4 py-1.5 rounded-full";

            // Tags
            document.getElementById('tagContainer').innerHTML = data.tags.map(t => 
                `<span class="bg-gray-100 text-gray-800 px-4 py-2 rounded-2xl text-[10px] font-extrabold uppercase tracking-tighter border border-gray-50">${t}</span>`
            ).join('');
            
            // Sidebar
            if(document.getElementById('emptyMsg')) document.getElementById('emptyMsg').remove();
            const div = document.createElement('div');
            div.className = "sidebar-item p-4 mb-2 flex items-center cursor-pointer transition-all rounded-2xl mx-2 border border-transparent hover:border-gray-100";
            div.innerHTML = `
                <div class="w-12 h-12 rounded-full tinder-gradient mr-3 flex items-center justify-center text-white font-black text-xs shadow-md">${data.nome.charAt(0)}</div>
                <div class="flex-1 text-sm font-bold text-gray-700">${data.nome}</div>
            `;
            document.getElementById('sideList').prepend(div);
        }
    </script>
</body>
</html>
