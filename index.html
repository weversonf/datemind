<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Hub Pro | Encrypted BD</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <style>
        :root {
            --bg-color: #0f1012;
            --card-bg: #1c1e22;
            --input-bg: #25282e;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            
            /* NOVAS CORES DE STATUS */
            --color-conheci: #10b981;      /* Verde */
            --color-conversando: #eab308;  /* Amarelo */
            --color-fiquei: #ef4444;       /* Vermelho */
            --color-transei: #3b82f6;      /* Azul */
            
            --color-whatsapp: #25D366;
            --color-instagram: #E1306C;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; padding-bottom: 100px; }
        .app-container { width: 100%; max-width: 450px; padding: 20px; }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .header-title { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.5px; }
        .status-indicator { font-size: 0.7rem; color: var(--color-conheci); display: flex; align-items: center; gap: 5px; }
        .status-dot { width: 8px; height: 8px; background: var(--color-conheci); border-radius: 50%; box-shadow: 0 0 8px var(--color-conheci); }

        /* Dashboard Card */
        .dashboard-card { background: var(--card-bg); border-radius: 24px; padding: 20px; margin-bottom: 20px; border: 1px solid #2d3139; }
        .charts-row { display: flex; align-items: center; gap: 20px; }
        .chart-container { position: relative; width: 100px; height: 100px; }
        svg { transform: rotate(-90deg); width: 100%; height: 100%; }
        circle { fill: none; stroke-width: 7; stroke-linecap: round; transition: stroke-dashoffset 0.8s ease; }
        .bg-circle { stroke: #2d3139; }
        
        .legend { flex: 1; display: flex; flex-direction: column; gap: 6px; }
        .legend-item { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--text-muted); text-transform: capitalize; }
        .dot { width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        .funnel-bar { height: 4px; background: #2d3139; border-radius: 2px; margin-top: 15px; display: flex; overflow: hidden; }
        .funnel-segment { height: 100%; transition: width 0.5s ease; }

        /* Search & Filters */
        .search-bar { background: var(--input-bg); border-radius: 12px; padding: 12px 16px; display: flex; align-items: center; margin-bottom: 15px; border: 1px solid transparent; transition: 0.3s; }
        .search-bar:focus-within { border-color: var(--color-transei); }
        .search-bar input { background: transparent; border: none; color: white; width: 100%; outline: none; font-size: 0.9rem; }

        /* Alphabet Filters */
        .alpha-filters { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 20px; padding-bottom: 8px; scrollbar-width: none; }
        .alpha-filters::-webkit-scrollbar { display: none; }
        .alpha-btn { background: var(--card-bg); border: 1px solid #2d3139; color: var(--text-muted); border-radius: 12px; padding: 8px 12px; cursor: pointer; text-align: center; min-width: 48px; flex-shrink: 0; transition: 0.3s; display: flex; flex-direction: column; align-items: center; }
        .alpha-btn.active { background: #333; color: white; border-color: #555; }
        .alpha-btn .letter { font-weight: 800; font-size: 1rem; }
        .alpha-btn .count { font-size: 0.65rem; opacity: 0.8; margin-top: 2px; }

        /* Contact Cards */
        .contact-card { background: var(--card-bg); border-radius: 18px; padding: 16px; margin-bottom: 12px; border: 1px solid #2d3139; position: relative; }
        .card-main { display: flex; justify-content: space-between; align-items: flex-start; }
        .contact-info h3 { font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
        .contact-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
        .tag { font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; background: #2d3139; color: var(--text-muted); text-transform: capitalize; }
        
        /* Expansible Details */
        .card-details { margin-top: 12px; padding-top: 12px; border-top: 1px solid #2d3139; display: none; }
        .card-details.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        
        .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .detail-item { font-size: 0.75rem; background: var(--input-bg); padding: 8px; border-radius: 8px; }
        .detail-item strong { display: block; color: var(--text-muted); font-size: 0.65rem; text-transform: uppercase; margin-bottom: 2px; }
        
        .social-links { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-social { flex: 1; padding: 8px; border-radius: 8px; text-align: center; text-decoration: none; font-size: 0.8rem; font-weight: bold; color: white; display: flex; justify-content: center; align-items: center; gap: 5px; }
        .btn-wa { background: rgba(37, 211, 102, 0.1); border: 1px solid var(--color-whatsapp); color: var(--color-whatsapp); }
        .btn-ig { background: rgba(225, 48, 108, 0.1); border: 1px solid var(--color-instagram); color: var(--color-instagram); }
        
        .expand-btn { font-size: 0.7rem; color: var(--text-muted); cursor: pointer; margin-top: 5px; display: inline-block; background: none; border: none; text-decoration: underline; }

        /* Floating Button & Modal */
        .fab { position: fixed; bottom: 30px; right: 20px; width: 60px; height: 60px; background: var(--text-main); color: var(--bg-color); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 28px; border: none; box-shadow: 0 10px 25px rgba(255, 255, 255, 0.2); cursor: pointer; z-index: 100; transition: 0.3s; }
        
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px; overflow-y: auto; }
        .modal { background: var(--card-bg); width: 100%; max-width: 400px; padding: 24px; border-radius: 28px; border: 1px solid #2d3139; margin: auto; }
        .modal h2 { margin-bottom: 20px; font-size: 1.2rem; }
        
        /* Form Grid */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .form-full { width: 100%; margin-bottom: 12px; }
        .modal input, .modal select, .modal textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #3a3d46; background: var(--input-bg); color: white; outline: none; font-size: 0.85rem; }
        
        .modal-btns { display: flex; gap: 10px; margin-top: 15px; }
        .btn-primary { flex: 1; padding: 14px; border-radius: 12px; border: none; background: var(--text-main); color: var(--bg-color); font-weight: bold; cursor: pointer; }
        .btn-secondary { flex: 1; padding: 14px; border-radius: 12px; border: 1px solid #2d3139; background: transparent; color: var(--text-muted); cursor: pointer; }

        /* Cores Dinâmicas por Status - ATUALIZADAS */
        .status-conheci { border-left: 4px solid var(--color-conheci); }
        .status-conversando { border-left: 4px solid var(--color-conversando); }
        .status-fiquei { border-left: 4px solid var(--color-fiquei); }
        .status-transei { border-left: 4px solid var(--color-transei); }
        
        #loadingMsg { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-top: 20px; }
        .security-badge { display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 0.65rem; color: var(--color-conheci); margin-bottom: 15px; background: rgba(16, 185, 129, 0.1); padding: 5px; border-radius: 8px;}
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="header-title">Contact Hub <span style="color: var(--color-transei);">.</span></div>
        <div class="status-indicator">
            <div class="status-dot"></div>
            Seguro & Sincronizado
        </div>
    </header>

    <div class="dashboard-card">
        <div class="charts-row">
            <div class="chart-container">
                <svg viewBox="0 0 120 120">
                    <circle class="bg-circle" cx="60" cy="60" r="50"></circle>
                    <circle id="ring-conheci" stroke="var(--color-conheci)" cx="60" cy="60" r="50" stroke-dasharray="314" stroke-dashoffset="314"></circle>
                    
                    <circle class="bg-circle" cx="60" cy="60" r="38"></circle>
                    <circle id="ring-conversando" stroke="var(--color-conversando)" cx="60" cy="60" r="38" stroke-dasharray="238" stroke-dashoffset="238"></circle>
                    
                    <circle class="bg-circle" cx="60" cy="60" r="26"></circle>
                    <circle id="ring-fiquei" stroke="var(--color-fiquei)" cx="60" cy="60" r="26" stroke-dasharray="163" stroke-dashoffset="163"></circle>
                    
                    <circle class="bg-circle" cx="60" cy="60" r="14"></circle>
                    <circle id="ring-transei" stroke="var(--color-transei)" cx="60" cy="60" r="14" stroke-dasharray="88" stroke-dashoffset="88"></circle>
                </svg>
            </div>
            <div class="legend">
                <div class="legend-item"><span><i class="dot" style="background:var(--color-conheci)"></i>Conheci</span> <b id="perc-conheci">0%</b></div>
                <div class="legend-item"><span><i class="dot" style="background:var(--color-conversando)"></i>Conversando</span> <b id="perc-conversando">0%</b></div>
                <div class="legend-item"><span><i class="dot" style="background:var(--color-fiquei)"></i>Fiquei</span> <b id="perc-fiquei">0%</b></div>
                <div class="legend-item"><span><i class="dot" style="background:var(--color-transei)"></i>Transei</span> <b id="perc-transei">0%</b></div>
            </div>
        </div>
        <div class="funnel-bar">
            <div id="bar-conheci" class="funnel-segment" style="background:var(--color-conheci); width:0%"></div>
            <div id="bar-conversando" class="funnel-segment" style="background:var(--color-conversando); width:0%"></div>
            <div id="bar-fiquei" class="funnel-segment" style="background:var(--color-fiquei); width:0%"></div>
            <div id="bar-transei" class="funnel-segment" style="background:var(--color-transei); width:0%"></div>
        </div>
    </div>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Procurar por nome, bairro ou nota..." oninput="renderList()">
    </div>

    <div class="alpha-filters" id="alphaFilters">
        </div>

    <div id="loadingMsg">Sincronizando com Banco de Dados...</div>
    <div id="contactList"></div>
    
    <button class="fab" onclick="toggleModal(true)">+</button>
</div>

<div class="modal-overlay" id="modal">
    <div class="modal">
        <h2>Novo Registro</h2>
        <div class="security-badge">🔒 Dados Criptografados de Ponta a Ponta</div>
        
        <input type="text" id="nome" class="form-full" placeholder="Nome Completo / Apelido">
        
        <div class="form-grid">
            <select id="status">
                <option value="conheci">Conheci</option>
                <option value="conversando">Conversando</option>
                <option value="fiquei">Fiquei</option>
                <option value="transei">Transei</option>
            </select>
            <input type="text" id="origin" placeholder="Origem (ex: Tinder)">
        </div>

        <div class="form-grid">
            <input type="tel" id="whatsapp" placeholder="WhatsApp (DDD+Num)">
            <input type="text" id="instagram" placeholder="Instagram (@)">
        </div>

        <div class="form-grid">
            <input type="number" id="age" placeholder="Idade">
            <input type="text" id="profession" placeholder="Profissão">
        </div>

        <div class="form-grid">
            <input type="text" id="college" placeholder="Faculdade">
            <input type="number" id="children" placeholder="Filhos (Qtd)">
        </div>

        <input type="text" id="neighborhood" class="form-full" placeholder="Bairro">

        <div class="form-grid">
            <input type="text" id="city" value="Fortaleza" placeholder="Cidade">
            <input type="text" id="state" value="CE" placeholder="UF">
        </div>

        <textarea id="notes" class="form-full" placeholder="Notas e observações internas..." rows="2"></textarea>
        
        <div class="modal-btns">
            <button class="btn-secondary" onclick="toggleModal(false)">Cancelar</button>
            <button class="btn-primary" onclick="saveContact()">Gravar BD</button>
        </div>
    </div>
</div>

<script>
    // ⚠️ CONFIGURAÇÕES DE SEGURANÇA E CONEXÃO ⚠️
    const API_URL = "https://script.google.com/macros/s/AKfycbzmNqRIo7AHp1bCV27XokIcQDauV5m__9AC7nGbaYjDx2gIf_4yD5UKYZk8wIH_DmaT/exec";
    const SECRET_KEY = "WeversonCRM_2026_!@#"; 

    let contacts = JSON.parse(localStorage.getItem('contact_hub_cache')) || [];
    let currentInitialFilter = 'All';

    // --- FUNÇÕES DE CRIPTOGRAFIA ---
    function encryptText(text) {
        if (!text) return "";
        return CryptoJS.AES.encrypt(text.toString(), SECRET_KEY).toString();
    }

    function decryptText(ciphertext) {
        if (!ciphertext) return "";
        if (!ciphertext.toString().startsWith('U2FsdGVk')) return ciphertext;
        try {
            const bytes = CryptoJS.AES.decrypt(ciphertext.toString(), SECRET_KEY);
            return bytes.toString(CryptoJS.enc.Utf8);
        } catch(e) {
            return "Erro: Senha Incorreta";
        }
    }

    async function init() {
        buildAlphaFiltersUI(); 
        if(contacts.length > 0) renderList(); 
        
        try {
            const res = await fetch(API_URL);
            const data = await res.json();
            
            if(Array.isArray(data) && data.length > 0) {
                contacts = data.map(c => ({
                    id: c.id,
                    nome: decryptText(c.nome || c.Nome || c.name),
                    status: c.status,
                    origin: decryptText(c.origin || c.Origem),
                    whatsapp: decryptText(c.whatsapp || c.Whatsapp),
                    instagram: decryptText(c.instagram || c.Instagram),
                    age: c.age || c.Idade, 
                    profession: decryptText(c.profession || c.Profissao),
                    college: decryptText(c.college || c.Faculdade),
                    children: c.children || c.Filhos,
                    neighborhood: decryptText(c.neighborhood || c.Bairro),
                    city: decryptText(c.city || c.Cidade),
                    state: decryptText(c.state || c.Estado),
                    notes: decryptText(c.notes || c.Notas),
                    updated: c.updated || c.Atualizado
                }));

                localStorage.setItem('contact_hub_cache', JSON.stringify(contacts));
            }
            document.getElementById('loadingMsg').style.display = 'none';
            renderList();
        } catch(e) {
            console.error("Erro na API", e);
            document.getElementById('loadingMsg').innerText = "Modo Offline";
        }
    }

    function buildAlphaFiltersUI() {
        const container = document.getElementById('alphaFilters');
        const alphabet = ['All', ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('')];

        alphabet.forEach(letter => {
            const btn = document.createElement('button');
            btn.className = 'alpha-btn';
            btn.id = `alpha-btn-${letter}`;
            btn.onclick = () => setInitialFilter(letter);

            const spanLetter = document.createElement('span');
            spanLetter.className = 'letter';
            spanLetter.innerText = letter === 'All' ? 'Tudo' : letter;

            const spanCount = document.createElement('span');
            spanCount.className = 'count';
            spanCount.id = `alpha-count-${letter}`;
            spanCount.innerText = '(0)';

            btn.appendChild(spanLetter);
            btn.appendChild(spanCount);
            container.appendChild(btn);
        });

        document.getElementById('alpha-btn-All').classList.add('active');
    }

    function setInitialFilter(letter) {
        currentInitialFilter = letter;
        document.querySelectorAll('.alpha-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`alpha-btn-${letter}`).classList.add('active');
        renderList(); 
    }

    function updateAlphaCounts() {
        const counts = { All: contacts.length };
        'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(l => counts[l] = 0);

        contacts.forEach(c => {
            const name = (c.nome || '').trim();
            if (name) {
                const initial = name.charAt(0).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
                if (counts[initial] !== undefined) {
                    counts[initial]++;
                }
            }
        });

        for (const [letter, count] of Object.entries(counts)) {
            const btn = document.getElementById(`alpha-btn-${letter}`);
            const countSpan = document.getElementById(`alpha-count-${letter}`);
            
            if (btn && countSpan) {
                countSpan.innerText = `(${count})`;
                if (count === 0 && letter !== 'All') {
                    btn.style.opacity = '0.3';
                } else {
                    btn.style.opacity = '1';
                }
            }
        }
    }

    function toggleModal(show) {
        document.getElementById('modal').style.display = show ? 'flex' : 'none';
        if(!show) {
            const keepCity = document.getElementById('city').value;
            const keepState = document.getElementById('state').value;
            document.querySelectorAll('.modal input, .modal textarea').forEach(el => el.value = '');
            document.getElementById('city').value = keepCity || 'Fortaleza';
            document.getElementById('state').value = keepState || 'CE';
        }
    }

    function buildWaLink(num) {
        if(!num) return '';
        let clean = String(num).replace(/\D/g, '');
        if(clean.length === 10 || clean.length === 11) clean = '55' + clean;
        return `https://wa.me/${clean}`;
    }

    function buildIgLink(user) {
        if(!user) return '';
        let clean = String(user).replace('@', '').trim();
        return `https://instagram.com/${clean}`;
    }

    async function saveContact() {
        const nome = document.getElementById('nome').value;
        if(!nome) { alert("Nome é obrigatório"); return; }

        const localData = {
            id: Date.now(),
            nome: nome,
            status: document.getElementById('status').value,
            origin: document.getElementById('origin').value || 'Direto',
            whatsapp: document.getElementById('whatsapp').value,
            instagram: document.getElementById('instagram').value,
            age: document.getElementById('age').value,
            profession: document.getElementById('profession').value,
            college: document.getElementById('college').value,
            children: document.getElementById('children').value,
            neighborhood: document.getElementById('neighborhood').value,
            city: document.getElementById('city').value,
            state: document.getElementById('state').value,
            notes: document.getElementById('notes').value,
            updated: new Date().toLocaleDateString('pt-BR')
        };

        const encryptedPayload = {
            id: localData.id,
            nome: encryptText(localData.nome),
            status: localData.status, 
            origin: encryptText(localData.origin),
            whatsapp: encryptText(localData.whatsapp),
            instagram: encryptText(localData.instagram),
            age: localData.age, 
            profession: encryptText(localData.profession),
            college: encryptText(localData.college),
            children: localData.children,
            neighborhood: encryptText(localData.neighborhood),
            city: encryptText(localData.city),
            state: encryptText(localData.state),
            notes: encryptText(localData.notes),
            updated: localData.updated
        };

        contacts.push(localData);
        renderList();
        toggleModal(false);
        localStorage.setItem('contact_hub_cache', JSON.stringify(contacts));

        try {
            await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify(encryptedPayload)
            });
        } catch(e) {
            console.error("Falha ao salvar no BD remoto.");
        }
    }

    function toggleDetails(id) {
        document.getElementById(`details-${id}`).classList.toggle('active');
    }

    function renderList() {
        updateAlphaCounts(); 

        const list = document.getElementById('contactList');
        const query = document.getElementById('searchInput').value.toLowerCase();
        list.innerHTML = '';

        const filtered = contacts.filter(c => {
            const nomeStr = c.nome || '';
            const bairroStr = c.neighborhood || '';
            const notaStr = c.notes || '';
            
            const searchStr = `${nomeStr} ${bairroStr} ${notaStr}`.toLowerCase();
            const matchesSearch = searchStr.includes(query);

            let matchesLetter = true;
            if (currentInitialFilter !== 'All') {
                const initial = nomeStr.charAt(0).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
                matchesLetter = (initial === currentInitialFilter);
            }

            return matchesSearch && matchesLetter;
        }).reverse(); 

        filtered.forEach(c => {
            const displayNome = c.nome || 'Desconhecido';
            const displayIdade = c.age ? `, ${c.age}` : '';
            const displayStatus = c.status ? c.status.toLowerCase() : 'conheci';
            
            const waLink = buildWaLink(c.whatsapp);
            const igLink = buildIgLink(c.instagram);
            
            const card = document.createElement('div');
            card.className = `contact-card status-${displayStatus}`;
            
            const prof = c.profession ? c.profession : '-';
            const fac = c.college ? c.college : '-';
            const bair = c.neighborhood ? `${c.neighborhood}, ${c.city || 'Fortaleza'}` : '-';
            
            card.innerHTML = `
                <div class="card-main">
                    <div class="contact-info">
                        <h3>${displayNome}${displayIdade}</h3>
                        <div class="contact-tags">
                            <span class="tag" style="border: 1px solid var(--color-${displayStatus});">${displayStatus}</span>
                            <span class="tag">📍 ${c.origin || 'Direto'}</span>
                        </div>
                        <button class="expand-btn" onclick="toggleDetails('${c.id}')">Ficha completa ▼</button>
                    </div>
                </div>
                
                <div class="card-details" id="details-${c.id}">
                    ${waLink || igLink ? `
                    <div class="social-links">
                        ${waLink ? `<a href="${waLink}" target="_blank" class="btn-social btn-wa">💬 WhatsApp</a>` : ''}
                        ${igLink ? `<a href="${igLink}" target="_blank" class="btn-social btn-ig">📷 Instagram</a>` : ''}
                    </div>` : ''}
                    
                    <div class="details-grid">
                        <div class="detail-item"><strong>Profissão</strong>${prof}</div>
                        <div class="detail-item"><strong>Faculdade</strong>${fac}</div>
                        <div class="detail-item"><strong>Local</strong>${bair}</div>
                        <div class="detail-item"><strong>Filhos</strong>${c.children ? c.children : '0'}</div>
                    </div>
                    
                    <div class="detail-item" style="margin-bottom:10px;">
                        <strong>Notas Internas</strong>
                        ${c.notes || 'Sem observações.'}
                    </div>
                    
                    <div style="text-align:right; font-size:0.7rem; color:var(--text-muted);">
                        Atualizado em: ${c.updated || '-'}
                    </div>
                </div>
            `;
            list.appendChild(card);
        });
        updateDashboard();
    }

    function updateDashboard() {
        const total = contacts.length;
        const counts = { conheci: 0, conversando: 0, fiquei: 0, transei: 0 };
        
        contacts.forEach(c => {
            let s = c.status ? c.status.toLowerCase() : '';
            if(counts[s] !== undefined) counts[s]++;
        });

        // Gráfico com 4 Anéis e novas circunferências (314, 238, 163, 88)
        const rings = [
            { id: 'ring-conheci', percId: 'perc-conheci', barId: 'bar-conheci', val: counts.conheci, circ: 314 },
            { id: 'ring-conversando', percId: 'perc-conversando', barId: 'bar-conversando', val: counts.conversando, circ: 238 },
            { id: 'ring-fiquei', percId: 'perc-fiquei', barId: 'bar-fiquei', val: counts.fiquei, circ: 163 },
            { id: 'ring-transei', percId: 'perc-transei', barId: 'bar-transei', val: counts.transei, circ: 88 }
        ];

        rings.forEach(r => {
            const p = total ? Math.round((r.val / total) * 100) : 0;
            const offset = r.circ - (p / 100 * r.circ);
            document.getElementById(r.id).style.strokeDashoffset = offset;
            document.getElementById(r.percId).innerText = p + '%';
            document.getElementById(r.barId).style.width = p + '%';
        });
    }

    init();
</script>
</body>
</html>
