<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Hub v05</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <style>
        :root {
            --bg-color: #0f1012;
            --card-bg: #1c1e22;
            --input-bg: #25282e;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --color-conheci: #10b981;      
            --color-conversando: #eab308;  
            --color-fiquei: #ef4444;       
            --color-transei: #3b82f6;      
            --color-whatsapp: #25D366;
            --color-instagram: #E1306C;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding-bottom: 50px; overflow-x: hidden; }

        /* HEADER & LAYOUT */
        .app-container { 
            width: 100%; max-width: 1400px; margin: 0 auto; padding: 20px;
            display: grid; grid-template-columns: 320px 1fr; gap: 30px;
        }

        header { 
            grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; 
            padding: 20px 10px; border-bottom: 1px solid #2d3139; margin-bottom: 20px;
        }

        .header-title { font-size: 1.8rem; font-weight: 800; }
        .view-toggle { display: flex; background: var(--card-bg); border-radius: 12px; padding: 5px; border: 1px solid #2d3139; }
        .view-btn { padding: 8px 16px; border: none; background: none; color: var(--text-muted); cursor: pointer; border-radius: 8px; font-weight: 600; transition: 0.3s; }
        .view-btn.active { background: #333; color: white; }

        /* KANBAN BOARD */
        .kanban-board { 
            display: none; grid-template-columns: repeat(4, 1fr); gap: 15px; align-items: start;
            grid-column: 1 / -1; width: 100%;
        }
        .kanban-board.active { display: grid; }

        .kanban-column { 
            background: #121417; border-radius: 16px; border: 1px solid #2d3139; min-height: 70vh;
            padding: 15px; transition: 0.3s;
        }
        .kanban-column.drag-over { background: #1a1d21; border-color: var(--text-muted); }
        .column-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding: 0 5px; }
        .column-title { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }

        /* CARDS NOIR */
        .contact-card { 
            background: linear-gradient(145deg, #1c1e22, #16171a); border-radius: 12px; 
            padding: 15px; margin-bottom: 12px; border: 1px solid #2d3139; 
            cursor: grab; transition: 0.2s; position: relative;
        }
        .contact-card:active { cursor: grabbing; }
        .contact-card.dragging { opacity: 0.4; border: 1px dashed var(--text-muted); }
        .card-tag { font-size: 0.6rem; font-weight: 800; padding: 2px 6px; border-radius: 4px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); }

        /* DASHBOARD & FILTERS */
        .side-panel { display: flex; flex-direction: column; gap: 25px; }
        .dashboard-card { background: var(--card-bg); border-radius: 20px; padding: 20px; border: 1px solid #2d3139; }
        .alpha-filters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
        .alpha-btn { background: var(--card-bg); border: 1px solid #2d3139; color: var(--text-muted); border-radius: 8px; padding: 8px; cursor: pointer; font-size: 0.7rem; text-align: center; }
        .alpha-btn.active { background: #333; color: white; border-color: var(--color-transei); }
        .alpha-btn .count { font-size: 0.6rem; display: block; opacity: 0.5; }

        .fab { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; border-radius: 18px; background: white; color: black; font-size: 24px; border: none; cursor: pointer; z-index: 999; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }

        /* MODAL */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 10000; padding: 20px; }
        .modal { background: var(--card-bg); width: 100%; max-width: 550px; padding: 30px; border-radius: 24px; border: 1px solid #2d3139; max-height: 90vh; overflow-y: auto; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .modal input, .modal select, .modal textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #3a3d46; background: var(--input-bg); color: white; margin-bottom: 12px; outline: none; }

        @media (max-width: 1024px) {
            .app-container { display: flex; flex-direction: column; }
            .kanban-board.active { display: flex; overflow-x: auto; padding-bottom: 20px; }
            .kanban-column { min-width: 280px; }
            .side-panel { order: -1; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="header-title">Contact Hub <span style="color: var(--color-transei);">.</span></div>
        <div class="view-toggle">
            <button class="view-btn active" onclick="switchView('list', this)">Lista</button>
            <button class="view-btn" onclick="switchView('kanban', this)">Kanban</button>
        </div>
    </header>

    <aside class="side-panel" id="sidePanel">
        <div class="dashboard-card">
            <p style="font-size: 0.75rem; font-weight: 800; color: var(--text-muted); margin-bottom: 15px; text-transform: uppercase;">Resumo do Funil</p>
            <div id="dashStats" style="display: flex; flex-direction: column; gap: 10px;">
                </div>
        </div>
        <div class="dashboard-card">
            <p style="font-size: 0.75rem; font-weight: 800; color: var(--text-muted); margin-bottom: 15px; text-transform: uppercase;">Alfabeto</p>
            <div class="alpha-filters" id="alphaFilters"></div>
        </div>
    </aside>

    <main class="main-column" id="listView">
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Pesquisar em toda a rede..." oninput="renderList()">
        </div>
        <div id="contactList"></div>
    </main>

    <div class="kanban-board" id="kanbanView">
        <div class="kanban-column" data-status="conheci" ondragover="allowDrop(event)" ondrop="drop(event)" ondragleave="dragLeave(event)" ondragenter="dragEnter(event)">
            <div class="column-header"><span class="column-title" style="color: var(--color-conheci);">Conheci</span></div>
            <div class="kanban-list" id="kanban-conheci"></div>
        </div>
        <div class="kanban-column" data-status="conversando" ondragover="allowDrop(event)" ondrop="drop(event)" ondragleave="dragLeave(event)" ondragenter="dragEnter(event)">
            <div class="column-header"><span class="column-title" style="color: var(--color-conversando);">Conversando</span></div>
            <div class="kanban-list" id="kanban-conversando"></div>
        </div>
        <div class="kanban-column" data-status="fiquei" ondragover="allowDrop(event)" ondrop="drop(event)" ondragleave="dragLeave(event)" ondragenter="dragEnter(event)">
            <div class="column-header"><span class="column-title" style="color: var(--color-fiquei);">Fiquei</span></div>
            <div class="kanban-list" id="kanban-fiquei"></div>
        </div>
        <div class="kanban-column" data-status="transei" ondragover="allowDrop(event)" ondrop="drop(event)" ondragleave="dragLeave(event)" ondragenter="dragEnter(event)">
            <div class="column-header"><span class="column-title" style="color: var(--color-transei);">Transei</span></div>
            <div class="kanban-list" id="kanban-transei"></div>
        </div>
    </div>

    <button class="fab" onclick="openNewModal()">+</button>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <h2 id="modalTitle" style="margin-bottom: 20px;">Novo Registro</h2>
        <input type="text" id="nome" placeholder="Nome">
        <div class="form-grid">
            <select id="status">
                <option value="conheci">Conheci</option>
                <option value="conversando">Conversando</option>
                <option value="fiquei">Fiquei</option>
                <option value="transei">Transei</option>
            </select>
            <input type="text" id="origin" placeholder="Origem (Tinder, Insta)">
        </div>
        <div class="form-grid">
            <input type="tel" id="whatsapp" placeholder="WhatsApp">
            <input type="text" id="instagram" placeholder="Instagram">
        </div>
        <div class="form-grid">
            <input type="number" id="age" placeholder="Idade">
            <input type="text" id="neighborhood" placeholder="Bairro">
        </div>
        <textarea id="notes" placeholder="Notas e observações..." rows="4"></textarea>
        <div style="display: flex; gap: 10px;">
            <button onclick="closeModal()" style="flex:1; padding:12px; background:none; border:1px solid #333; color:white; border-radius:10px;">Cancelar</button>
            <button id="btnSave" onclick="handleSave()" style="flex:1; padding:12px; background:white; color:black; font-weight:bold; border-radius:10px;">Gravar</button>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzmNqRIo7AHp1bCV27XokIcQDauV5m__9AC7nGbaYjDx2gIf_4yD5UKYZk8wIH_DmaT/exec";
    const SECRET_KEY = "WeversonCRM_2026_!@#"; 

    let contacts = JSON.parse(localStorage.getItem('contact_hub_cache')) || [];
    let currentInitialFilter = 'All';
    let editingId = null;

    // --- CRYPTO ---
    function encrypt(text) { return text ? CryptoJS.AES.encrypt(text.toString(), SECRET_KEY).toString() : ""; }
    function decrypt(text) {
        if (!text || !text.toString().startsWith('U2FsdGVk')) return text || "";
        try { return CryptoJS.AES.decrypt(text.toString(), SECRET_KEY).toString(CryptoJS.enc.Utf8); } catch { return ""; }
    }

    // --- VIEW SWITCH ---
    function switchView(view, btn) {
        document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        if(view === 'kanban') {
            document.getElementById('listView').style.display = 'none';
            document.getElementById('sidePanel').style.display = 'none';
            document.getElementById('kanbanView').classList.add('active');
            renderKanban();
        } else {
            document.getElementById('listView').style.display = 'block';
            document.getElementById('sidePanel').style.display = 'flex';
            document.getElementById('kanbanView').classList.remove('active');
            renderList();
        }
    }

    // --- DRAG & DROP ---
    function allowDrop(e) { e.preventDefault(); }
    function dragEnter(e) { e.currentTarget.classList.add('drag-over'); }
    function dragLeave(e) { e.currentTarget.classList.remove('drag-over'); }

    function drag(e) {
        e.dataTransfer.setData("contactId", e.target.getAttribute('data-id'));
        e.target.classList.add('dragging');
    }

    async function drop(e) {
        e.preventDefault();
        e.currentTarget.classList.remove('drag-over');
        const id = e.dataTransfer.getData("contactId");
        const newStatus = e.currentTarget.getAttribute('data-status');
        
        const index = contacts.findIndex(c => String(c.id) === String(id));
        if (index > -1 && contacts[index].status !== newStatus) {
            contacts[index].status = newStatus;
            saveAndSync(contacts[index]);
            renderKanban();
        }
    }

    // --- CORE LOGIC ---
    async function saveAndSync(contactData) {
        localStorage.setItem('contact_hub_cache', JSON.stringify(contacts));
        updateDashboard();

        const payload = {
            action: "update",
            id: contactData.id,
            nome: encrypt(contactData.nome),
            status: encrypt(contactData.status),
            origin: encrypt(contactData.origin),
            whatsapp: encrypt(contactData.whatsapp),
            instagram: encrypt(contactData.instagram),
            age: encrypt(contactData.age),
            neighborhood: encrypt(contactData.neighborhood),
            notes: encrypt(contactData.notes),
            updated: encrypt(new Date().toLocaleDateString('pt-PT'))
        };

        try { await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) }); } catch(e) {}
    }

    function renderKanban() {
        const columns = ['conheci', 'conversando', 'fiquei', 'transei'];
        columns.forEach(st => {
            const container = document.getElementById(`kanban-${st}`);
            container.innerHTML = '';
            contacts.filter(c => c.status === st).forEach(c => {
                const card = document.createElement('div');
                card.className = 'contact-card';
                card.draggable = true;
                card.setAttribute('data-id', c.id);
                card.ondragstart = drag;
                card.ondragend = (e) => e.target.classList.remove('dragging');
                card.onclick = () => openEditModal(c.id);
                card.innerHTML = `
                    <div style="font-weight:700; margin-bottom:5px;">${c.nome}</div>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span class="card-tag">${c.origin}</span>
                        <span style="font-size:0.6rem; opacity:0.5;">${c.neighborhood || ''}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        });
    }

    function renderList() {
        const list = document.getElementById('contactList');
        const query = document.getElementById('searchInput').value.toLowerCase();
        list.innerHTML = '';
        
        const filtered = contacts.filter(c => {
            const matchesSearch = `${c.nome} ${c.notes}`.toLowerCase().includes(query);
            const initial = (c.nome || '').charAt(0).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
            const matchesLetter = currentInitialFilter === 'All' || initial === currentInitialFilter;
            return matchesSearch && matchesLetter;
        }).reverse();

        filtered.forEach(c => {
            const div = document.createElement('div');
            div.className = `contact-card status-${c.status}`;
            div.onclick = () => openEditModal(c.id);
            div.innerHTML = `<div style="font-weight:700;">${c.nome} <span style="opacity:0.4; font-weight:400">, ${c.age || ''}</span></div>
                             <div style="font-size:0.7rem; color:var(--text-muted); margin-top:5px;">${c.status} • ${c.origin}</div>`;
            list.appendChild(div);
        });
        updateDashboard();
        updateAlphaCounts();
    }

    function updateDashboard() {
        const stats = { conheci: 0, conversando: 0, fiquei: 0, transei: 0 };
        contacts.forEach(c => { if(stats[c.status] !== undefined) stats[c.status]++; });
        
        const container = document.getElementById('dashStats');
        container.innerHTML = '';
        Object.entries(stats).forEach(([name, val]) => {
            container.innerHTML += `
                <div style="display:flex; justify-content:space-between; font-size:0.8rem;">
                    <span style="text-transform:capitalize; color:var(--color-${name})">${name}</span>
                    <span style="font-weight:800;">${val}</span>
                </div>
                <div style="height:4px; background:#333; border-radius:2px;"><div style="width:${(val/contacts.length*100) || 0}%; height:100%; background:var(--color-${name}); border-radius:2px;"></div></div>
            `;
        });
    }

    function updateAlphaCounts() {
        const counts = { All: contacts.length };
        'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(l => counts[l] = 0);
        contacts.forEach(c => {
            const initial = (c.nome || '').charAt(0).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
            if(counts[initial] !== undefined) counts[initial]++;
        });
        
        const container = document.getElementById('alphaFilters');
        container.innerHTML = '';
        Object.entries(counts).forEach(([l, count]) => {
            const active = currentInitialFilter === l ? 'active' : '';
            container.innerHTML += `<div class="alpha-btn ${active}" onclick="setAlphaFilter('${l}')" style="opacity:${count === 0 && l !== 'All' ? 0.3 : 1}">
                ${l === 'All' ? 'Tudo' : l} <span class="count">${count}</span>
            </div>`;
        });
    }

    function setAlphaFilter(l) { currentInitialFilter = l; renderList(); }

    // --- MODAL ACTIONS ---
    function openNewModal() {
        editingId = null;
        document.getElementById('modalTitle').innerText = "Novo Registro";
        document.querySelectorAll('.modal input, .modal textarea').forEach(i => i.value = '');
        document.getElementById('modalOverlay').style.display = 'flex';
    }

    function openEditModal(id) {
        const c = contacts.find(item => String(item.id) === String(id));
        if(!c) return;
        editingId = c.id;
        document.getElementById('modalTitle').innerText = "Editar Registro";
        document.getElementById('nome').value = c.nome;
        document.getElementById('status').value = c.status;
        document.getElementById('origin').value = c.origin;
        document.getElementById('whatsapp').value = c.whatsapp;
        document.getElementById('instagram').value = c.instagram;
        document.getElementById('age').value = c.age;
        document.getElementById('neighborhood').value = c.neighborhood;
        document.getElementById('notes').value = c.notes;
        document.getElementById('modalOverlay').style.display = 'flex';
    }

    function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }

    async function handleSave() {
        const contact = {
            id: editingId || Date.now(),
            nome: document.getElementById('nome').value,
            status: document.getElementById('status').value,
            origin: document.getElementById('origin').value,
            whatsapp: document.getElementById('whatsapp').value,
            instagram: document.getElementById('instagram').value,
            age: document.getElementById('age').value,
            neighborhood: document.getElementById('neighborhood').value,
            notes: document.getElementById('notes').value
        };

        if(editingId) {
            const idx = contacts.findIndex(c => String(c.id) === String(editingId));
            contacts[idx] = contact;
        } else {
            contacts.push(contact);
        }

        saveAndSync(contact);
        closeModal();
        renderList();
        if(document.getElementById('kanbanView').classList.contains('active')) renderKanban();
    }

    async function init() {
        renderList();
        try {
            const res = await fetch(API_URL);
            const data = await res.json();
            if(Array.isArray(data)) {
                contacts = data.map(c => ({
                    id: c.id,
                    nome: decrypt(c.nome),
                    status: decrypt(c.status),
                    origin: decrypt(c.origin),
                    whatsapp: decrypt(c.whatsapp),
                    instagram: decrypt(c.instagram),
                    age: decrypt(c.age),
                    neighborhood: decrypt(c.neighborhood),
                    notes: decrypt(c.notes)
                }));
                localStorage.setItem('contact_hub_cache', JSON.stringify(contacts));
                renderList();
            }
        } catch(e) {}
    }

    init();
</script>
</body>
</html>
