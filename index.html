<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DateMind v08.8.1 | Título Dinâmico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .tinder-gradient { background: linear-gradient(135deg, #ff7854 0%, #fd267d 100%); }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 2rem; cursor: pointer; transition: 0.3s ease; border-left: 6px solid #94a3b8; }
        .glass-card:hover { transform: translateY(-5px); border-color: #fd267d; }
        .phase-ice { border-left-color: #94a3b8; }
        .phase-fire { border-left-color: #fd267d; }
        .phase-check { border-left-color: #22c55e; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="loadingOverlay" class="fixed inset-0 z-[100] bg-[#0f172a] flex flex-col items-center justify-center">
        <i class="fa-solid fa-fire text-[#fd267d] text-5xl animate-pulse"></i>
        <p class="text-[10px] font-black uppercase tracking-widest mt-6 opacity-50">Sincronizando Dossiês...</p>
    </div>

    <div id="mainApp" class="hidden flex flex-col min-h-screen">
        <header class="p-6 border-b border-white/10 flex justify-between items-center bg-[#0f172a]/95 backdrop-blur-md sticky top-0 z-50">
            <h1 class="text-xl font-black italic uppercase italic">DateMind <span class="text-[#fd267d]">v08.8</span></h1>
            <div class="flex items-center gap-4">
                <button id="btnLogout" class="text-[10px] font-bold text-slate-500 uppercase">Sair</button>
                <label class="tinder-gradient px-8 py-3 rounded-full font-bold text-[10px] uppercase tracking-widest cursor-pointer shadow-xl hover:scale-105 transition-all flex items-center gap-2">
                    <input type="file" id="chatUpload" class="hidden" accept=".txt">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Novo Dossiê
                </label>
            </div>
        </header>
        <main id="crmBoard" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 p-8"></main>
    </div>

    <div id="authSection" class="hidden h-screen flex items-center justify-center p-6 text-slate-900">
        <div class="bg-white p-10 rounded-[3.5rem] w-full max-w-sm shadow-2xl text-center">
            <h2 class="text-3xl font-black italic mb-8 uppercase tracking-tighter text-[#fd267d]">DateMind</h2>
            <input type="email" id="email" placeholder="E-mail" class="w-full p-4 bg-slate-50 rounded-2xl mb-4 outline-none border-2 border-transparent focus:border-[#fd267d]">
            <input type="password" id="pass" placeholder="Senha" class="w-full p-4 bg-slate-50 rounded-2xl mb-6 outline-none border-2 border-transparent focus:border-[#fd267d]">
            <button id="btnPrimary" class="tinder-gradient w-full py-4 rounded-2xl text-white font-black uppercase shadow-lg">Entrar / Cadastrar</button>
        </div>
    </div>

    <div id="modal" class="hidden fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/90 backdrop-blur-lg">
        <div class="bg-white text-slate-900 w-full max-w-xl rounded-[2.5rem] overflow-hidden relative shadow-2xl">
            <button id="btnCloseModal" class="absolute top-6 right-6 text-slate-300 text-2xl hover:text-rose-500"><i class="fa-solid fa-circle-xmark"></i></button>
            <div class="h-40 tinder-gradient p-10 flex flex-col justify-end">
                <h2 id="mName" class="text-5xl font-black text-white tracking-tighter leading-none">---</h2>
                <div class="flex items-center gap-2 mt-4">
                    <select id="mPhaseSelector" class="bg-white/20 text-white text-[9px] font-black uppercase p-1 rounded-lg border-none outline-none cursor-pointer backdrop-blur-md">
                        <option value="ice">❄️ Gelo</option>
                        <option value="fire">🔥 Fogo</option>
                        <option value="check">📍 Marcado</option>
                    </select>
                </div>
            </div>
            <div class="p-10 space-y-6">
                <div id="mTags" class="flex flex-wrap gap-2"></div>
                <p id="mBio" class="bg-slate-50 p-6 rounded-3xl italic text-slate-600 text-sm border border-slate-100"></p>
                <button id="btnDelete" class="w-full py-4 bg-rose-50 text-rose-500 text-[10px] font-black uppercase rounded-xl hover:bg-rose-500 hover:text-white transition-all">Excluir Permanentemente</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, onSnapshot, orderBy, doc, deleteDoc, updateDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCV1GoLh63JnbosKXY4eTMptOUedA29Jcs",
            authDomain: "memorymsg.firebaseapp.com",
            projectId: "memorymsg",
            storageBucket: "memorymsg.firebasestorage.app",
            messagingSenderId: "66381936065",
            appId: "1:66381936065:web:b440c0bbdfe63804f32b40"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // LOGIN / CADASTRO
        document.getElementById('btnPrimary').onclick = async () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            try { await signInWithEmailAndPassword(auth, email, pass); }
            catch { await createUserWithEmailAndPassword(auth, email, pass).catch(e => alert(e.message)); }
        };

        document.getElementById('btnLogout').onclick = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            document.getElementById('loadingOverlay').classList.add('hidden');
            if (user) {
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                syncBoard(user.uid);
            } else {
                document.getElementById('authSection').classList.remove('hidden');
                document.getElementById('mainApp').classList.add('hidden');
            }
        });

        // MÓDULO DE PROCESSAMENTO E DEDUPLICAÇÃO
        document.getElementById('chatUpload').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const text = await file.text();
            const lowText = text.toLowerCase();
            const tags = [];
            
            // 1. Extrai Nome e Idade
            const rawName = file.name.replace('.txt','').replace('Conversa do WhatsApp com ','').split(' ')[0].toUpperCase();
            const idadeMatch = lowText.match(/(\d{2}) anos/);
            const idadeStr = idadeMatch ? `, ${idadeMatch[1]}` : '';
            const finalTitle = rawName + idadeStr;

            // 2. Extrai Itens Chave
            if (lowText.includes("filho")) tags.push("👶 Pais");
            const bairro = lowText.match(/moro no ([\wáéíóúâêîôûãõç]+)/) || lowText.match(/moro em ([\wáéíóúâêîôûãõç]+)/);
            if(bairro) tags.push("📍 " + bairro[1]);
            const prof = lowText.match(/sou ([\wáéíóúâêîôûãõç]+)/) || lowText.match(/trabalho com ([\wáéíóúâêîôûãõç]+)/);
            if(prof && !['eu','você'].includes(prof[1])) tags.push("💼 " + prof[1]);

            const profileData = {
                nome: finalTitle, // Título unificado (Nome + Idade)
                tags: tags,
                uid: auth.currentUser.uid,
                createdAt: Date.now(),
                bio: `Dossiê estratégico de ${rawName}. Histórico com ${text.split('\n').length} interações analisadas.`
            };

            // 3. Unifica se já existir o mesmo Nome
            const q = query(collection(db, "profiles"), where("uid", "==", auth.currentUser.uid), where("nome", "==", finalTitle));
            const querySnapshot = await getDocs(q);

            if (!querySnapshot.empty) {
                await updateDoc(doc(db, "profiles", querySnapshot.docs[0].id), profileData);
            } else {
                profileData.fase = "ice";
                await addDoc(collection(db, "profiles"), profileData);
            }
        };

        // MÓDULO DE RENDERIZAÇÃO
        function syncBoard(uid) {
            const q = query(collection(db, "profiles"), where("uid", "==", uid));
            onSnapshot(q, (snap) => {
                const board = document.getElementById('crmBoard');
                board.innerHTML = '';
                
                let docs = [];
                snap.forEach(d => docs.push({id: d.id, ...d.data()}));
                docs.sort((a,b) => b.createdAt - a.createdAt);

                docs.forEach(d => {
                    const card = document.createElement('div');
                    card.className = `glass-card p-8 animate-in fade-in duration-500 phase-${d.fase || 'ice'}`;
                    card.onclick = () => {
                        window.currentProfileId = d.id;
                        document.getElementById('mName').innerText = d.nome;
                        document.getElementById('mBio').innerText = d.bio;
                        document.getElementById('mPhaseSelector').value = d.fase || 'ice';
                        document.getElementById('mTags').innerHTML = d.tags.map(t => `<span class="bg-slate-100 text-slate-500 text-[10px] font-black px-4 py-2 rounded-xl border border-slate-200 uppercase">${t}</span>`).join('');
                        document.getElementById('modal').classList.remove('hidden');
                    };
                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-6">
                            <h3 class="text-2xl font-black tracking-tighter uppercase leading-tight">${d.nome}</h3>
                            <i class="fa-solid fa-circle text-[6px] ${d.fase === 'fire' ? 'text-rose-500' : d.fase === 'check' ? 'text-green-500' : 'text-slate-500'}"></i>
                        </div>
                        <div class="flex flex-wrap gap-2">
                            ${d.tags.map(t => `<span class="bg-white/5 text-[8px] font-bold px-2 py-1 rounded-md text-slate-400 border border-white/5 uppercase">${t}</span>`).join('')}
                        </div>
                    `;
                    board.appendChild(card);
                });
            });
        }

        document.getElementById('mPhaseSelector').onchange = async (e) => {
            await updateDoc(doc(db, "profiles", window.currentProfileId), { fase: e.target.value });
        };

        document.getElementById('btnCloseModal').onclick = () => document.getElementById('modal').classList.add('hidden');
        document.getElementById('btnDelete').onclick = async () => {
            if(confirm("Excluir dossiê permanentemente?")) {
                await deleteDoc(doc(db, "profiles", window.currentProfileId));
                document.getElementById('modal').classList.add('hidden');
            }
        };
    </script>
</body>
</html>
