<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Hub Pro | BD Connected</title>
    <style>
        :root {
            --bg-color: #0f1012;
            --card-bg: #1c1e22;
            --input-bg: #25282e;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --color-blue: #3b82f6;
            --color-orange: #f97316;
            --color-teal: #14b8a6;
            --color-danger: #ef4444;
            --color-whatsapp: #25D366;
            --color-instagram: #E1306C;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; padding-bottom: 100px; }
        .app-container { width: 100%; max-width: 450px; padding: 20px; }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .header-title { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.5px; }
        .status-indicator { font-size: 0.7rem; color: var(--color-teal); display: flex; align-items: center; gap: 5px; }
        .status-dot { width: 8px; height: 8px; background: var(--color-teal); border-radius: 50%; box-shadow: 0 0 8px var(--color-teal); }

        /* Dashboard Card */
        .dashboard-card { background: var(--card-bg); border-radius: 24px; padding: 20px; margin-bottom: 20px; border: 1px solid #2d3139; }
        .charts-row { display: flex; align-items: center; gap: 20px; }
        .chart-container { position: relative; width: 100px; height: 100px; }
        svg { transform: rotate(-90deg); width: 100%; height: 100%; }
        circle { fill: none; stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 0.8s ease; }
        .bg-circle { stroke: #2d3139; }
        
        .legend { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .legend-item { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); }
        .dot { width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; display: inline-block; }

        .funnel-bar { height: 4px; background: #2d3139; border-radius: 2px; margin-top: 15px; display: flex; overflow: hidden; }
        .funnel-segment { height: 100%; transition: width 0.5s ease; }

        /* Search */
        .search-bar { background: var(--input-bg); border-radius: 12px; padding: 12px 16px; display: flex; align-items: center; margin-bottom: 20px; border: 1px solid transparent; transition: 0.3s; }
        .search-bar:focus-within { border-color: var(--color-blue); }
        .search-bar input { background: transparent; border: none; color: white; width: 100%; outline: none; font-size: 0.9rem; }

        /* Contact Cards */
        .contact-card { background: var(--card-bg); border-radius: 18px; padding: 16px; margin-bottom: 12px; border: 1px solid #2d3139; position: relative; }
        .card-main { display: flex; justify-content: space-between; align-items: flex-start; }
        .contact-info h3 { font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
        .contact-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
        .tag { font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; background: #2d3139; color: var(--text-muted); }
        
        .counter-box { display: flex; align-items: center; gap: 12px; background: var(--input-bg); padding: 6px 12px; border-radius: 10px; }
        .cnt-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem; padding: 0 5px; }
        .cnt-val { font-size: 0.85rem; font-weight: bold; min-width: 15px; text-align: center; }

        /* Expansible Details */
        .card-details { margin-top: 12px; padding-top: 12px; border-top: 1px solid #2d3139; display: none; }
        .card-details.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        
        .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .detail-item { font-size: 0.75rem; background: var(--input-bg); padding: 8px; border-radius: 8px; }
        .detail-item strong { display: block; color: var(--text-muted); font-size: 0.65rem; text-transform: uppercase; margin-bottom: 2px; }
        
        .social-links { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-social { flex: 1; padding: 8px; border-radius: 8px; text-align: center; text-decoration: none; font-size: 0.8rem; font-weight: bold; color: white; display: flex; justify-content: center; align-items: center; gap: 5px; }
        .btn-wa { background: rgba(37, 211, 102, 0.1); border: 1px solid var(--color-whatsapp); color: var(--color-whatsapp); }
        .btn-ig { background: rgba(225, 48, 108, 0.1); border: 1px solid var(--color-instagram); color: var(--color-instagram); }
        
        .expand-btn { font-size: 0.7rem; color: var(--color-blue); cursor: pointer; margin-top: 5px; display: inline-block; background: none; border: none; }

        /* Floating Button & Modal */
        .fab { position: fixed; bottom: 30px; right: 20px; width: 60px; height: 60px; background: var(--color-blue); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 28px; color: white; border: none; box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4); cursor: pointer; z-index: 100; transition: 0.3s; }
        
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px; overflow-y: auto; }
        .modal { background: var(--card-bg); width: 100%; max-width: 400px; padding: 24px; border-radius: 28px; border: 1px solid #2d3139; margin: auto; }
        .modal h2 { margin-bottom: 20px; font-size: 1.2rem; }
        
        /* Form Grid */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .form-full { width: 100%; margin-bottom: 12px; }
        .modal input, .modal select, .modal textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #3a3d46; background: var(--input-bg); color: white; outline: none; font-size: 0.85rem; }
        
        .modal-btns { display: flex; gap: 10px; margin-top: 15px; }
        .btn-primary { flex: 1; padding: 14px; border-radius: 12px; border: none; background: var(--color-blue); color: white; font-weight: bold; cursor: pointer; }
        .btn-secondary { flex: 1; padding: 14px; border-radius: 12px; border: 1px solid #2d3139; background: transparent; color: var(--text-muted); cursor: pointer; }

        .status-Conversando { border-left: 4px solid var(--color-blue); }
        .status-Ficando { border-left: 4px solid var(--color-orange); }
        .status-Transamos { border-left: 4px solid var(--color-teal); }
        
        #loadingMsg { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-top: 20px; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="header-title">Contact Hub v02<span style="color: var(--color-blue);">.</span></div>
        <div class="status-indicator">
            <div class="status-dot"></div>
            Online
        </div>
    </header>

    <div class="dashboard-card">
        <div class="charts-row">
            <div class="chart-container">
                <svg viewBox="0 0 120 120">
                    <circle class="bg-circle" cx="60" cy="60" r="50"></circle>
                    <circle id="ring-blue" stroke="#3b82f6" cx="60" cy="60" r="50" stroke-dasharray="314" stroke-dashoffset="314"></circle>
                    <circle class="bg-circle" cx="60" cy="60" r="38"></circle>
                    <circle id="ring-orange" stroke="#f97316" cx="60" cy="60" r="38" stroke-dasharray="238" stroke-dashoffset="238"></circle>
                    <circle class="bg-circle" cx="60" cy="60" r="26"></circle>
                    <circle id="ring-teal" stroke="#14b8a6" cx="60" cy="60" r="26" stroke-dasharray="163" stroke-dashoffset="163"></circle>
                </svg>
            </div>
            <div class="legend">
                <div class="legend-item"><span><i class="dot" style="background:var(--color-blue)"></i>Conversando</span> <b id="perc-blue">0%</b></div>
                <div class="legend-item"><span><i class="dot" style="background:var(--color-orange)"></i>Ficando</span> <b id="perc-orange">0%</b></div>
                <div class="legend-item"><span><i class="dot" style="background:var(--color-teal)"></i>Transamos</span> <b id="perc-teal">0%</b></div>
            </div>
        </div>
        <div class="funnel-bar">
            <div id="bar-blue" class="funnel-segment" style="background:var(--color-blue); width:0%"></div>
            <div id="bar-orange" class="funnel-segment" style="background:var(--color-orange); width:0%"></div>
            <div id="bar-teal" class="funnel-segment" style="background:var(--color-teal); width:0%"></div>
        </div>
    </div>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Procurar por nome, bairro ou nota..." oninput="renderList()">
    </div>

    <div id="loadingMsg">Sincronizando com Banco de Dados...</div>
    <div id="contactList"></div>
    
    <button class="fab" onclick="toggleModal(true)">+</button>
</div>

<div class="modal-overlay" id="modal">
    <div class="modal">
        <h2>Novo Registro</h2>
        
        <input type="text" id="name" class="form-full" placeholder="Nome Completo / Apelido">
        
        <div class="form-grid">
            <select id="status">
                <option value="Conversando">Conversando</option>
                <option value="Ficando">Ficando</option>
                <option value="Transamos">Transamos</option>
            </select>
            <input type="text" id="origin" placeholder="Origem (ex: Tinder)">
        </div>

        <div class="form-grid">
            <input type="tel" id="whatsapp" placeholder="WhatsApp (DDD+Num)">
            <input type="text" id="instagram" placeholder="Instagram (@)">
        </div>

        <div class="form-grid">
            <input type="number" id="age" placeholder="Idade">
            <input type="text" id="profession" placeholder="Profissão">
        </div>

        <div class="form-grid">
            <input type="text" id="college" placeholder="Faculdade">
            <input type="number" id="children" placeholder="Filhos (Qtd)">
        </div>

        <input type="text" id="neighborhood" class="form-full" placeholder="Bairro">

        <div class="form-grid">
            <input type="text" id="city" value="Fortaleza" placeholder="Cidade">
            <input type="text" id="state" value="CE" placeholder="UF">
        </div>

        <textarea id="notes" class="form-full" placeholder="Notas e observações internas..." rows="2"></textarea>
        
        <div class="modal-btns">
            <button class="btn-secondary" onclick="toggleModal(false)">Cancelar</button>
            <button class="btn-primary" onclick="saveContact()">Gravar BD</button>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzmNqRIo7AHp1bCV27XokIcQDauV5m__9AC7nGbaYjDx2gIf_4yD5UKYZk8wIH_DmaT/exec";
    
    // Fallback de cache local enquanto carrega do Sheets
    let contacts = JSON.parse(localStorage.getItem('contact_hub_cache')) || [];

    // Inicia buscando dados
    async function init() {
        if(contacts.length > 0) renderList(); // Mostra cache imediato
        
        try {
            const res = await fetch(API_URL);
            const data = await res.json();
            if(Array.isArray(data) && data.length > 0) {
                contacts = data;
                localStorage.setItem('contact_hub_cache', JSON.stringify(contacts));
            }
            document.getElementById('loadingMsg').style.display = 'none';
            renderList();
        } catch(e) {
            console.error("Erro na API, usando cache local", e);
            document.getElementById('loadingMsg').innerText = "Modo Offline (Usando Cache)";
        }
    }

    function toggleModal(show) {
        document.getElementById('modal').style.display = show ? 'flex' : 'none';
        if(!show) {
            // Limpa form mas mantém Fortaleza/CE
            const keepCity = document.getElementById('city').value;
            const keepState = document.getElementById('state').value;
            document.querySelectorAll('.modal input, .modal textarea').forEach(el => el.value = '');
            document.getElementById('city').value = keepCity || 'Fortaleza';
            document.getElementById('state').value = keepState || 'CE';
        }
    }

    // Processa links
    function buildWaLink(num) {
        if(!num) return '';
        let clean = String(num).replace(/\\D/g, '');
        if(clean.length === 10 || clean.length === 11) clean = '55' + clean;
        return `https://wa.me/${clean}`;
    }

    function buildIgLink(user) {
        if(!user) return '';
        let clean = String(user).replace('@', '').trim();
        return `https://instagram.com/${clean}`;
    }

    async function saveContact() {
        const name = document.getElementById('name').value;
        if(!name) { alert("Nome é obrigatório"); return; }

        const payload = {
            id: Date.now(),
            name: name,
            status: document.getElementById('status').value,
            origin: document.getElementById('origin').value || 'Direto',
            whatsapp: document.getElementById('whatsapp').value,
            instagram: document.getElementById('instagram').value,
            age: document.getElementById('age').value,
            profession: document.getElementById('profession').value,
            college: document.getElementById('college').value,
            children: document.getElementById('children').value,
            neighborhood: document.getElementById('neighborhood').value,
            city: document.getElementById('city').value,
            state: document.getElementById('state').value,
            notes: document.getElementById('notes').value,
            count: 0,
            updated: new Date().toLocaleDateString('pt-BR')
        };

        // UI Otimista
        contacts.push(payload);
        renderList();
        toggleModal(false);
        localStorage.setItem('contact_hub_cache', JSON.stringify(contacts));

        // Background sync
        try {
            await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            console.log("Salvo no BD.");
        } catch(e) {
            console.error("Falha ao salvar no BD remoto.");
        }
    }

    async function updateCount(id, delta) {
        const c = contacts.find(x => String(x.id) === String(id));
        if(c) {
            c.count = Math.max(0, parseInt(c.count || 0) + delta);
            c.updated = new Date().toLocaleDateString('pt-BR');
            renderList();
            localStorage.setItem('contact_hub_cache', JSON.stringify(contacts));
            
            // Aqui, o ideal seria ter uma rota de PUT no seu Apps Script.
            // Por enquanto atualiza local, e empurra como novo log (caso queira auditar) ou exige refinar o backend.
            // Para simplificar: estamos garantindo o cache.
        }
    }

    function toggleDetails(id) {
        document.getElementById(`details-${id}`).classList.toggle('active');
    }

    function renderList() {
        const list = document.getElementById('contactList');
        const query = document.getElementById('searchInput').value.toLowerCase();
        list.innerHTML = '';

        const filtered = contacts.filter(c => {
            const searchStr = `${c.name} ${c.neighborhood} ${c.notes} ${c.profession}`.toLowerCase();
            return searchStr.includes(query);
        }).reverse(); // Mais novos no topo

        filtered.forEach(c => {
            const waLink = buildWaLink(c.whatsapp);
            const igLink = buildIgLink(c.instagram);
            
            const card = document.createElement('div');
            card.className = `contact-card status-${c.status}`;
            
            // Tratamento de dados nulos
            const prof = c.profession ? c.profession : '-';
            const fac = c.college ? c.college : '-';
            const bair = c.neighborhood ? `${c.neighborhood}, ${c.city}` : '-';
            
            card.innerHTML = `
                <div class="card-main">
                    <div class="contact-info">
                        <h3>${c.name}</h3>
                        <div class="contact-tags">
                            <span class="tag">${c.status}</span>
                            <span class="tag">📍 ${c.origin || 'Direto'}</span>
                            ${c.age ? `<span class="tag">${c.age} anos</span>` : ''}
                        </div>
                        <button class="expand-btn" onclick="toggleDetails('${c.id}')">Ver Ficha Completa ▼</button>
                    </div>
                    <div class="counter-box">
                        <button class="cnt-btn" onclick="updateCount('${c.id}', -1)">-</button>
                        <span class="cnt-val">${c.count || 0}</span>
                        <button class="cnt-btn" onclick="updateCount('${c.id}', 1)">+</button>
                    </div>
                </div>
                
                <div class="card-details" id="details-${c.id}">
                    ${waLink || igLink ? `
                    <div class="social-links">
                        ${waLink ? `<a href="${waLink}" target="_blank" class="btn-social btn-wa">💬 WhatsApp</a>` : ''}
                        ${igLink ? `<a href="${igLink}" target="_blank" class="btn-social btn-ig">📷 Instagram</a>` : ''}
                    </div>` : ''}
                    
                    <div class="details-grid">
                        <div class="detail-item"><strong>Profissão</strong>${prof}</div>
                        <div class="detail-item"><strong>Faculdade</strong>${fac}</div>
                        <div class="detail-item"><strong>Local</strong>${bair}</div>
                        <div class="detail-item"><strong>Filhos</strong>${c.children ? c.children : '0'}</div>
                    </div>
                    
                    <div class="detail-item" style="margin-bottom:10px;">
                        <strong>Notas Internas</strong>
                        ${c.notes || 'Sem observações.'}
                    </div>
                    
                    <div style="text-align:right; font-size:0.7rem; color:var(--text-muted);">
                        Atualizado em: ${c.updated || '-'}
                    </div>
                </div>
            `;
            list.appendChild(card);
        });
        updateDashboard();
    }

    function updateDashboard() {
        const total = contacts.length;
        const counts = { Conversando: 0, Ficando: 0, Transamos: 0 };
        contacts.forEach(c => {
            if(counts[c.status] !== undefined) counts[c.status]++;
        });

        const rings = [
            { id: 'ring-blue', percId: 'perc-blue', barId: 'bar-blue', val: counts.Conversando, circ: 314 },
            { id: 'ring-orange', percId: 'perc-orange', barId: 'bar-orange', val: counts.Ficando, circ: 238 },
            { id: 'ring-teal', percId: 'perc-teal', barId: 'bar-teal', val: counts.Transamos, circ: 163 }
        ];

        rings.forEach(r => {
            const p = total ? Math.round((r.val / total) * 100) : 0;
            const offset = r.circ - (p / 100 * r.circ);
            document.getElementById(r.id).style.strokeDashoffset = offset;
            document.getElementById(r.percId).innerText = p + '%';
            document.getElementById(r.barId).style.width = p + '%';
        });
    }

    // Inicializa
    init();
</script>
</body>
</html>
