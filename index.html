<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DateMind | CRM Local v07</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .tinder-gradient { background: linear-gradient(135deg, #ff7854 0%, #fd267d 100%); }
        .crm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; padding: 2rem; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); transition: all 0.3s ease; }
        .glass-card:hover { transform: translateY(-5px); border-color: #fd267d; box-shadow: 0 10px 30px -10px rgba(253, 38, 125, 0.3); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="p-6 border-b border-white/10 flex justify-between items-center sticky top-0 z-50 bg-[#0f172a]/90 backdrop-blur-md">
        <div class="flex items-center gap-3">
            <div class="p-2 bg-white rounded-lg"><i class="fa-solid fa-fire text-[#fd267d] text-xl"></i></div>
            <h1 class="text-xl font-extrabold tracking-tighter uppercase">DateMind <span class="text-[#fd267d]">Offline</span></h1>
        </div>

        <div class="flex items-center gap-4">
            <span class="text-[10px] font-bold text-slate-400 uppercase bg-slate-800 px-3 py-1 rounded-full">Processamento Local Ativo</span>
            <label class="tinder-gradient px-6 py-2 rounded-full font-bold text-xs uppercase tracking-widest cursor-pointer shadow-lg hover:brightness-110 transition-all flex items-center gap-2">
                <input type="file" id="chatUpload" class="hidden" accept=".txt">
                <i class="fa-solid fa-plus"></i> Analisar .txt
            </label>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto">
        <div id="welcome" class="h-full flex flex-col items-center justify-center py-40 opacity-40">
            <i class="fa-solid fa-bolt-lightning text-8xl mb-6"></i>
            <h2 class="text-2xl font-bold uppercase italic">Motor de Padrões v07</h2>
            <p class="text-sm mt-2">Nenhuma chave API necessária. Arraste suas conversas abaixo.</p>
        </div>

        <div id="crmBoard" class="crm-grid hidden"></div>
    </main>

    <script>
        const chatUpload = document.getElementById('chatUpload');
        const crmBoard = document.getElementById('crmBoard');
        const welcome = document.getElementById('welcome');

        chatUpload.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const text = await file.text();
            const fileName = file.name.replace('.txt', '').replace('Conversa do WhatsApp com ', '');
            
            // Inicia o algoritmo Old School
            const analysis = processOldSchool(text, fileName);
            renderCard(analysis);
        });

        function processOldSchool(text, name) {
            const lines = text.split('\n');
            const totalMsgs = lines.length;
            
            // 1. Detectar última data
            const lastLine = lines[lines.length - 2] || "";
            const dateMatch = lastLine.match(/(\d{2}\/\d{2}\/\d{2,4})/);
            const lastDate = dateMatch ? dateMatch[0] : "Recente";

            // 2. Analisar Interesse (Baseado em Emojis e Volume)
            const hotEmojis = (text.match(/❤️|🔥|😍|😘|🥰|heart/g) || []).length;
            const funEmojis = (text.match(/😂|🤣|kkk|haha/g) || []).length;
            
            let interesse = "Morno";
            if (hotEmojis > 10 || totalMsgs > 500) interesse = "Quente";
            if (totalMsgs < 50) interesse = "Frio";

            // 3. Extrair Tags (Palavras com mais de 5 letras que mais repetem)
            const words = text.toLowerCase().replace(/[^\w\s]/gi, '').split(/\s+/);
            const freqMap = {};
            const stopWords = ['você', 'muito', 'minha', 'nossa', 'está', 'fazer', 'coisa', 'disse', 'áudio', 'oculto', 'mensagem'];
            
            words.forEach(word => {
                if (word.length > 5 && !stopWords.includes(word)) {
                    freqMap[word] = (freqMap[word] || 0) + 1;
                }
            });

            const sortedTags = Object.entries(freqMap)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 5)
                .map(item => item[0].toUpperCase());

            // 4. Gerar Bio e Insight Baseado em Lógica
            const personality = `Conexão baseada em ${totalMsgs} interações. Frequência alta de termos como "${sortedTags[0] || 'papo'}".`;
            const insight = interesse === "Quente" 
                ? `Forte presença de emojis positivos (${hotEmojis}). Hora de sugerir um encontro presencial.`
                : `Volume de mensagens moderado. Tente puxar assunto sobre "${sortedTags[1] || 'novidades'}".`;

            return {
                nome: name.split(' ')[0],
                ultimo_papo: lastDate,
                personalidade: personality,
                tags: sortedTags.length > 0 ? sortedTags : ["CONVERSA", "WHATSAPP"],
                insight: insight,
                interesse: interesse
            };
        }

            

        function renderCard(data) {
            welcome.classList.add('hidden');
            crmBoard.classList.remove('hidden');

            const card = document.createElement('div');
            card.className = "glass-card rounded-[2rem] overflow-hidden flex flex-col";
            
            const badgeClass = data.interesse === 'Quente' ? 'bg-red-500 animate-pulse' : (data.interesse === 'Frio' ? 'bg-blue-500' : 'bg-orange-500');

            card.innerHTML = `
                <div class="h-32 tinder-gradient p-6 flex flex-col justify-end relative">
                    <div class="absolute top-4 right-4 ${badgeClass} text-white text-[9px] font-black uppercase px-3 py-1 rounded-full shadow-lg">
                        ${data.interesse}
                    </div>
                    <h3 class="text-xl font-extrabold tracking-tight">${data.nome}</h3>
                    <p class="text-[9px] font-bold opacity-80 uppercase tracking-widest mt-1">Timeline: ${data.ultimo_papo}</p>
                </div>
                <div class="p-6 space-y-5 flex-1 flex flex-col">
                    <p class="text-xs text-slate-400 leading-relaxed italic">"${data.personalidade}"</p>
                    
                    <div class="flex flex-wrap gap-2">
                        ${data.tags.map(t => `<span class="bg-slate-800 text-slate-300 text-[9px] font-bold uppercase px-3 py-1 rounded-lg border border-white/5 tracking-tighter">${t}</span>`).join('')}
                    </div>

                    <div class="mt-auto pt-4 border-t border-white/5">
                        <h4 class="text-[9px] font-black text-[#fd267d] uppercase mb-2 tracking-widest flex items-center gap-2">
                            <i class="fa-solid fa-microchip"></i> Diagnóstico
                        </h4>
                        <p class="text-[11px] font-bold text-slate-200 leading-snug">${data.insight}</p>
                    </div>
                </div>
            `;
            crmBoard.prepend(card);
        }
    </script>
</body>
</html>
