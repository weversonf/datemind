<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DateMind v08.4.1 | Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .tinder-gradient { background: linear-gradient(135deg, #ff7854 0%, #fd267d 100%); }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); cursor: pointer; transition: all 0.3s ease; }
        .glass-card:hover { transform: translateY(-5px); border-color: #fd267d; box-shadow: 0 10px 30px -10px rgba(253, 38, 125, 0.3); }
        .input-field { background-color: #f1f5f9; color: #1e293b; width: 100%; padding: 1.2rem; border-radius: 1.5rem; outline: none; border: 2px solid transparent; }
        .input-field:focus { border-color: #fd267d; background-color: #ffffff; }
        .modal-bg { background: rgba(15, 23, 42, 0.98); backdrop-filter: blur(20px); }
        #loadingOverlay { background: #0f172a; position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; transition: opacity 0.5s ease; }
    </style>
</head>
<body class="min-h-screen">

    <div id="loadingOverlay">
        <div class="flex flex-col items-center">
            <i class="fa-solid fa-fire text-[#fd267d] text-5xl animate-pulse"></i>
            <p class="text-[10px] font-black uppercase tracking-[0.3em] mt-4 opacity-50">Sincronizando Dossiês...</p>
            <button onclick="forceAccess()" class="mt-8 text-[8px] text-slate-500 underline uppercase tracking-widest">Pular Carregamento</button>
        </div>
    </div>

    <div id="authSection" class="hidden h-screen flex items-center justify-center p-6 text-slate-900">
        <div class="bg-white p-10 md:p-14 rounded-[3.5rem] w-full max-w-md shadow-2xl">
            <div class="text-center mb-8">
                <i class="fa-solid fa-fire text-[#fd267d] text-6xl mb-4"></i>
                <h2 id="authTitle" class="text-3xl font-black italic tracking-tighter uppercase">DateMind</h2>
                <p id="authSubtitle" class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-2">Login Seguro</p>
            </div>
            <div class="space-y-4">
                <input type="email" id="email" placeholder="E-mail" class="input-field">
                <input type="password" id="pass" placeholder="Senha" class="input-field">
                <button id="btnPrimary" class="tinder-gradient w-full py-4 rounded-[1.5rem] text-white font-black uppercase tracking-widest shadow-lg hover:brightness-110 transition-all">Entrar</button>
                <div class="pt-6 text-center border-t border-slate-100">
                    <button id="btnSwitch" class="text-[10px] font-black uppercase text-slate-400 hover:text-[#fd267d] tracking-widest">Não tem conta? Cadastre-se</button>
                </div>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden flex flex-col min-h-screen">
        <header class="p-6 border-b border-white/10 flex justify-between items-center sticky top-0 z-40 bg-[#0f172a]/95 backdrop-blur-md">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-white rounded-lg shadow-lg"><i class="fa-solid fa-fire text-[#fd267d]"></i></div>
                <h1 class="text-xl font-black italic uppercase tracking-tighter">DateMind <span class="text-[#fd267d]">v08.4</span></h1>
            </div>
            <div class="flex items-center gap-4">
                <button id="btnLogout" class="text-[10px] font-black uppercase text-slate-500 hover:text-white">Sair</button>
                <label class="tinder-gradient px-8 py-3 rounded-full font-bold text-[10px] uppercase tracking-widest cursor-pointer shadow-lg hover:scale-105 flex items-center gap-2">
                    <input type="file" id="chatUpload" class="hidden" accept=".txt">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Novo Dossiê
                </label>
            </div>
        </header>

        <main id="crmBoard" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 p-8"></main>
    </div>

    <div id="modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 modal-bg">
        <div class="bg-white text-slate-900 w-full max-w-2xl rounded-[3rem] overflow-hidden shadow-2xl relative">
            <button id="btnCloseModal" class="absolute top-8 right-8 text-slate-300 hover:text-rose-500 text-3xl z-10"><i class="fa-solid fa-circle-xmark"></i></button>
            <div class="h-48 tinder-gradient p-12 flex flex-col justify-end">
                <h2 id="mName" class="text-6xl font-black text-white tracking-tighter leading-none">---</h2>
                <div id="mStatus" class="mt-4 inline-block bg-white/20 text-white text-[10px] font-black uppercase px-4 py-1 rounded-full border border-white/30 backdrop-blur-md">---</div>
            </div>
            <div class="p-12 space-y-8 overflow-y-auto" style="max-height: 60vh;">
                <div id="mTags" class="flex flex-wrap gap-3"></div>
                <div class="bg-slate-50 p-8 rounded-[2.5rem] border border-slate-100 italic text-slate-700 leading-relaxed">
                    <p id="mBio"></p>
                </div>
                <div class="flex justify-between items-center pt-6 border-t border-slate-100">
                    <div id="mDate" class="text-[10px] font-bold text-slate-400 uppercase tracking-widest"></div>
                    <button id="btnDelete" class="bg-rose-50 text-rose-500 px-6 py-2 rounded-xl text-[10px] font-black uppercase">Excluir</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, onSnapshot, orderBy, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCV1GoLh63JnbosKXY4eTMptOUedA29Jcs",
            authDomain: "memorymsg.firebaseapp.com",
            projectId: "memorymsg",
            storageBucket: "memorymsg.firebasestorage.app",
            messagingSenderId: "66381936065",
            appId: "1:66381936065:web:b440c0bbdfe63804f32b40"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Função Global de Emergência
        window.forceAccess = () => {
            document.getElementById('loadingOverlay').style.opacity = '0';
            setTimeout(() => document.getElementById('loadingOverlay').classList.add('hidden'), 500);
            if (!auth.currentUser) document.getElementById('authSection').classList.remove('hidden');
        };

        // Força a saída do carregamento após 4 segundos caso o Firebase trave
        setTimeout(window.forceAccess, 4000);

        let isLoginMode = true;

        document.getElementById('btnSwitch').onclick = () => {
            isLoginMode = !isLoginMode;
            document.getElementById('authTitle').innerText = isLoginMode ? "DATEMIND" : "CRIAR CONTA";
            document.getElementById('btnPrimary').innerText = isLoginMode ? "Entrar" : "Cadastrar";
        };

        document.getElementById('btnPrimary').onclick = () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            if(isLoginMode) {
                signInWithEmailAndPassword(auth, email, pass);
            } else {
                createUserWithEmailAndPassword(auth, email, pass);
            }
        };

        document.getElementById('btnLogout').onclick = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            window.forceAccess();
            if (user) {
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                syncBoard(user.uid);
            } else {
                document.getElementById('authSection').classList.remove('hidden');
                document.getElementById('mainApp').classList.add('hidden');
            }
        });

        document.getElementById('chatUpload').onchange = async (e) => {
            const file = e.target.files[0];
            const text = await file.text();
            const result = {
                nome: file.name.split(' ')[0],
                status: "🔥 Processado",
                tags: ["Analizado Local"],
                bio: `Dossiê criado em ${new Date().toLocaleDateString()}.`,
                lastPapo: "Hoje",
                uid: auth.currentUser.uid,
                createdAt: Date.now()
            };
            await addDoc(collection(db, "profiles"), result);
        };

        function syncBoard(uid) {
            const q = query(collection(db, "profiles"), where("uid", "==", uid), orderBy("createdAt", "desc"));
            onSnapshot(q, (snap) => {
                const board = document.getElementById('crmBoard');
                board.innerHTML = '';
                snap.forEach(docSnap => {
                    const d = docSnap.data();
                    const card = document.createElement('div');
                    card.className = "glass-card rounded-[2.5rem] overflow-hidden p-8 animate-in fade-in slide-in-from-bottom-4 duration-500";
                    card.innerHTML = `<h3 class="text-2xl font-black">${d.nome}</h3><p class="text-[8px] opacity-50 uppercase mt-4">${d.status}</p>`;
                    board.appendChild(card);
                });
            });
        }
    </script>
</body>
</html>
