<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Hub v01</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <style>
        :root {
            --bg-color: #0f1012;
            --card-bg: #1c1e22;
            --input-bg: #25282e;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            
            --color-conheci: #10b981;      
            --color-conversando: #eab308;  
            --color-fiquei: #ef4444;       
            --color-transei: #3b82f6;      
            
            --color-whatsapp: #25D366;
            --color-instagram: #E1306C;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding-bottom: 50px; overflow-x: hidden; }

        /* REORGANIZAÇÃO PARA DESKTOP */
        .app-container { 
            width: 100%; 
            max-width: 1400px; 
            margin: 0 auto;
            padding: 40px 20px; 
            display: grid;
            grid-template-columns: 320px 1fr 300px; /* 3 Colunas: Dash | Lista | Filtros */
            gap: 30px;
            align-items: start;
        }

        header { 
            grid-column: 1 / -1; /* Header ocupa o topo todo */
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 10px;
            padding: 0 10px;
        }

        .header-title { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; }
        .status-indicator { font-size: 0.8rem; color: var(--color-conheci); display: flex; align-items: center; gap: 8px; }
        .status-dot { width: 10px; height: 10px; background: var(--color-conheci); border-radius: 50%; box-shadow: 0 0 12px var(--color-conheci); }

        /* COLUNA 1: DASHBOARD FIXO */
        .dashboard-column { position: sticky; top: 40px; }
        .dashboard-card { background: var(--card-bg); border-radius: 24px; padding: 25px; border: 1px solid #2d3139; }
        .charts-row { display: flex; flex-direction: column; align-items: center; gap: 25px; }
        .chart-container { position: relative; width: 160px; height: 160px; }
        svg { transform: rotate(-90deg); width: 100%; height: 100%; }
        circle { fill: none; stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 0.8s ease; }
        .bg-circle { stroke: #2d3139; }
        
        .legend { width: 100%; display: flex; flex-direction: column; gap: 10px; }
        .legend-item { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); text-transform: capitalize; }
        .dot { width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; display: inline-block; }
        .funnel-bar { height: 6px; background: #2d3139; border-radius: 3px; margin-top: 25px; display: flex; overflow: hidden; }

        /* COLUNA 2: LISTA (CENTRO) */
        .main-column { min-width: 0; }
        .search-bar { background: var(--input-bg); border-radius: 16px; padding: 15px 20px; display: flex; align-items: center; margin-bottom: 20px; border: 1px solid #2d3139; transition: 0.3s; }
        .search-bar:focus-within { border-color: var(--color-transei); box-shadow: 0 0 15px rgba(59, 130, 246, 0.1); }
        .search-bar input { background: transparent; border: none; color: white; width: 100%; outline: none; font-size: 1rem; }

        .contact-card { background: var(--card-bg); border-radius: 20px; padding: 20px; margin-bottom: 15px; border: 1px solid #2d3139; transition: transform 0.2s; }
        .contact-card:hover { transform: translateX(5px); border-color: #444; }
        
        /* COLUNA 3: FILTROS LATERAIS */
        .filters-column { position: sticky; top: 40px; display: flex; flex-direction: column; gap: 20px; }
        .filter-section-title { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; display: block;}

        .status-filters { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 0; padding-bottom: 0; overflow: visible; }
        .status-btn { width: 100%; justify-content: flex-start; padding: 12px 16px; background: var(--card-bg); border: 1px solid #2d3139; border-radius: 12px; }
        .status-btn.active { background: var(--input-bg); transform: scale(1.02); }

        .alpha-filters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; overflow: visible; padding-bottom: 0; }
        .alpha-btn { min-width: 0; padding: 10px 5px; }

        /* DETALHES EM GRID NO DESKTOP */
        .details-grid { grid-template-columns: repeat(4, 1fr); gap: 15px; }
        .social-links { display: flex; gap: 15px; }

        /* FLOATING ACTION BUTTON (FAB) ADAPTADO */
        .fab { bottom: 40px; right: 40px; width: 70px; height: 70px; font-size: 32px; border-radius: 24px; }

        /* MODAL RESPONSIVO */
        .modal { max-width: 600px; padding: 35px; border-radius: 32px; }
        .form-grid { grid-template-columns: 1fr 1fr; gap: 15px; }

        /* MEDIA QUERY PARA VOLTAR AO MOBILE SE A TELA FOR PEQUENA */
        @media (max-width: 1024px) {
            .app-container { display: flex; flex-direction: column; max-width: 450px; margin: 0 auto; }
            .dashboard-column, .filters-column { position: static; width: 100%; }
            .alpha-filters { display: flex; overflow-x: auto; }
            .status-filters { display: flex; overflow-x: auto; }
            .details-grid { grid-template-columns: 1fr 1fr; }
        }

        /* STATUS CLASSES */
        .status-conheci { border-left: 6px solid var(--color-conheci); }
        .status-conversando { border-left: 6px solid var(--color-conversando); }
        .status-fiquei { border-left: 6px solid var(--color-fiquei); }
        .status-transei { border-left: 6px solid var(--color-transei); }

        #loadingMsg { grid-column: 1 / -1; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="header-title">Contact Hub <span style="color: var(--color-transei);">.</span></div>
        <div class="status-indicator">
            <div class="status-dot"></div>
            Desktop + Cloud Active
        </div>
    </header>

    <aside class="dashboard-column">
        <span class="filter-section-title">Estatísticas Reais</span>
        <div class="dashboard-card">
            <div class="charts-row">
                <div class="chart-container">
                    <svg viewBox="0 0 120 120">
                        <circle class="bg-circle" cx="60" cy="60" r="50"></circle>
                        <circle id="ring-conheci" stroke="var(--color-conheci)" cx="60" cy="60" r="50" stroke-dasharray="314" stroke-dashoffset="314"></circle>
                        <circle class="bg-circle" cx="60" cy="60" r="38"></circle>
                        <circle id="ring-conversando" stroke="var(--color-conversando)" cx="60" cy="60" r="38" stroke-dasharray="238" stroke-dashoffset="238"></circle>
                        <circle class="bg-circle" cx="60" cy="60" r="26"></circle>
                        <circle id="ring-fiquei" stroke="var(--color-fiquei)" cx="60" cy="60" r="26" stroke-dasharray="163" stroke-dashoffset="163"></circle>
                        <circle class="bg-circle" cx="60" cy="60" r="14"></circle>
                        <circle id="ring-transei" stroke="var(--color-transei)" cx="60" cy="60" r="14" stroke-dasharray="88" stroke-dashoffset="88"></circle>
                    </svg>
                </div>
                <div class="legend">
                    <div class="legend-item"><span><i class="dot" style="background:var(--color-conheci)"></i>Conheci</span> <b id="perc-conheci">0%</b></div>
                    <div class="legend-item"><span><i class="dot" style="background:var(--color-conversando)"></i>Conversando</span> <b id="perc-conversando">0%</b></div>
                    <div class="legend-item"><span><i class="dot" style="background:var(--color-fiquei)"></i>Fiquei</span> <b id="perc-fiquei">0%</b></div>
                    <div class="legend-item"><span><i class="dot" style="background:var(--color-transei)"></i>Transei</span> <b id="perc-transei">0%</b></div>
                </div>
            </div>
            <div class="funnel-bar">
                <div id="bar-conheci" class="funnel-segment" style="background:var(--color-conheci); width:0%"></div>
                <div id="bar-conversando" class="funnel-segment" style="background:var(--color-conversando); width:0%"></div>
                <div id="bar-fiquei" class="funnel-segment" style="background:var(--color-fiquei); width:0%"></div>
                <div id="bar-transei" class="funnel-segment" style="background:var(--color-transei); width:0%"></div>
            </div>
        </div>
    </aside>

    <main class="main-column">
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Pesquisar em toda a Base de Dados..." oninput="renderList()">
        </div>
        <div id="loadingMsg">A sincronizar com a Base de Dados...</div>
        <div id="contactList"></div>
    </main>

    <aside class="filters-column">
        <div>
            <span class="filter-section-title">Filtrar por Status</span>
            <div class="status-filters" id="statusFilters">
                <button class="status-btn active" id="btn-filter-All" onclick="setStatusFilter('All')">Todos os Registos</button>
                <button class="status-btn" id="btn-filter-conheci" onclick="setStatusFilter('conheci')"><i class="dot" style="background:var(--color-conheci)"></i>Conheci</button>
                <button class="status-btn" id="btn-filter-conversando" onclick="setStatusFilter('conversando')"><i class="dot" style="background:var(--color-conversando)"></i>Conversando</button>
                <button class="status-btn" id="btn-filter-fiquei" onclick="setStatusFilter('fiquei')"><i class="dot" style="background:var(--color-fiquei)"></i>Fiquei</button>
                <button class="status-btn" id="btn-filter-transei" onclick="setStatusFilter('transei')"><i class="dot" style="background:var(--color-transei)"></i>Transei</button>
            </div>
        </div>

        <div>
            <span class="filter-section-title">Índice Alfabético</span>
            <div class="alpha-filters" id="alphaFilters"></div>
        </div>
    </aside>

    <button class="fab" onclick="openNewModal()">+</button>
</div>

<div class="modal-overlay" id="modal">
    <div class="modal">
        <h2 id="modalTitle">Novo Registo</h2>
        <div class="security-badge">🔒 Folha de Cálculo 100% Blindada</div>
        <input type="text" id="nome" class="form-full" placeholder="Nome Completo / Apelido">
        <div class="form-grid">
            <select id="status">
                <option value="conheci">Conheci</option>
                <option value="conversando">Conversando</option>
                <option value="fiquei">Fiquei</option>
                <option value="transei">Transei</option>
            </select>
            <input type="text" id="origin" placeholder="Origem (ex: Tinder)">
        </div>
        <div class="upload-container">
            <div class="upload-btn-wrapper">
                <button class="btn-upload">📷 Anexar Foto da Galeria</button>
                <input type="file" id="photoUpload" accept="image/*" onchange="updateFileName()" />
            </div>
            <div id="fileNameDisplay"></div>
        </div>
        <input type="hidden" id="photoUrl">
        <div id="uploadProgress">A enviar foto para a nuvem... ⏳</div>
        <div class="form-grid">
            <input type="tel" id="whatsapp" placeholder="WhatsApp (DDD+Num)">
            <input type="text" id="instagram" placeholder="Instagram (@)">
        </div>
        <div class="form-grid">
            <input type="number" id="age" placeholder="Idade">
            <input type="text" id="profession" placeholder="Profissão">
        </div>
        <div class="form-grid">
            <input type="text" id="college" placeholder="Faculdade">
            <input type="number" id="children" placeholder="Filhos (Qtd)">
        </div>
        <input type="text" id="neighborhood" class="form-full" placeholder="Bairro">
        <div class="form-grid">
            <input type="text" id="city" value="Fortaleza" placeholder="Cidade">
            <input type="text" id="state" value="CE" placeholder="UF">
        </div>
        <textarea id="notes" class="form-full" placeholder="Notas e observações internas..." rows="3"></textarea>
        <div class="modal-btns">
            <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
            <button class="btn-primary" id="btnSave" onclick="handleSave()">Gravar BD</button>
        </div>
    </div>
</div>

<script>
    // [TODO O SEU SCRIPT JAVASCRIPT ORIGINAL FOI MANTIDO AQUI PARA GARANTIR COMPATIBILIDADE TOTAL]
    const API_URL = "https://script.google.com/macros/s/AKfycbzmNqRIo7AHp1bCV27XokIcQDauV5m__9AC7nGbaYjDx2gIf_4yD5UKYZk8wIH_DmaT/exec";
    const SECRET_KEY = "WeversonCRM_2026_!@#"; 
    const IMGBB_API_KEY = "019c10971b4aab9c354e2e8d8681d744"; 

    let contacts = JSON.parse(localStorage.getItem('contact_hub_cache')) || [];
    let currentInitialFilter = 'All';
    let currentStatusFilter = 'All'; 
    let editingId = null;

    function encryptText(text) {
        if (!text && text !== 0) return ""; 
        return CryptoJS.AES.encrypt(text.toString(), SECRET_KEY).toString();
    }

    function decryptText(ciphertext) {
        if (!ciphertext) return "";
        if (!ciphertext.toString().startsWith('U2FsdGVk')) return ciphertext;
        try {
            const bytes = CryptoJS.AES.decrypt(ciphertext.toString(), SECRET_KEY);
            return bytes.toString(CryptoJS.enc.Utf8);
        } catch(e) { return "Erro"; }
    }

    async function init() {
        buildAlphaFiltersUI(); 
        if(contacts.length > 0) renderList(); 
        try {
            const res = await fetch(API_URL);
            const data = await res.json();
            if(Array.isArray(data) && data.length > 0) {
                contacts = data.map(c => ({
                    id: c.id,
                    nome: decryptText(c.nome || c.Nome || c.name),
                    status: decryptText(c.status), 
                    origin: decryptText(c.origin || c.Origem),
                    photoUrl: decryptText(c.photoUrl || c.Foto),
                    whatsapp: decryptText(c.whatsapp || c.Whatsapp),
                    instagram: decryptText(c.instagram || c.Instagram),
                    age: decryptText(c.age || c.Idade), 
                    profession: decryptText(c.profession || c.Profissao),
                    college: decryptText(c.college || c.Faculdade),
                    children: decryptText(c.children || c.Filhos), 
                    neighborhood: decryptText(c.neighborhood || c.Bairro),
                    city: decryptText(c.city || c.Cidade),
                    state: decryptText(c.state || c.Estado),
                    notes: decryptText(c.notes || c.Notas),
                    updated: decryptText(c.updated || c.Atualizado) 
                }));
                localStorage.setItem('contact_hub_cache', JSON.stringify(contacts));
            }
            document.getElementById('loadingMsg').style.display = 'none';
            renderList();
        } catch(e) {
            document.getElementById('loadingMsg').innerText = "Modo Offline";
        }
    }

    function updateFileName() {
        const fileInput = document.getElementById('photoUpload');
        const display = document.getElementById('fileNameDisplay');
        if (fileInput.files.length > 0) {
            display.innerText = `✅ Foto selecionada: ${fileInput.files[0].name}`;
        }
    }

    async function uploadImageToImgBB(file) {
        const formData = new FormData();
        formData.append('image', file);
        try {
            const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            return data.data.url;
        } catch (e) { return null; }
    }

    async function handleSave() {
        const nome = document.getElementById('nome').value;
        if(!nome) return alert("O nome é obrigatório");

        const fileInput = document.getElementById('photoUpload');
        let finalPhotoUrl = document.getElementById('photoUrl').value; 
        const btnSave = document.getElementById('btnSave');
        const progress = document.getElementById('uploadProgress');

        if (fileInput.files.length > 0) {
            btnSave.disabled = true;
            progress.style.display = "block";
            const uploadedUrl = await uploadImageToImgBB(fileInput.files[0]);
            if (uploadedUrl) finalPhotoUrl = uploadedUrl;
            progress.style.display = "none";
            btnSave.disabled = false;
        }
        saveContactToSheets(finalPhotoUrl);
    }

    function buildAlphaFiltersUI() {
        const container = document.getElementById('alphaFilters');
        const alphabet = ['All', ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('')];
        alphabet.forEach(letter => {
            const btn = document.createElement('button');
            btn.className = 'alpha-btn';
            btn.id = `alpha-btn-${letter}`;
            btn.onclick = () => setInitialFilter(letter);
            btn.innerHTML = `<span class="letter">${letter === 'All' ? 'All' : letter}</span><span class="count" id="alpha-count-${letter}">(0)</span>`;
            container.appendChild(btn);
        });
        document.getElementById('alpha-btn-All').classList.add('active');
    }

    function setInitialFilter(letter) {
        currentInitialFilter = letter;
        document.querySelectorAll('.alpha-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`alpha-btn-${letter}`).classList.add('active');
        renderList(); 
    }

    function setStatusFilter(status) {
        currentStatusFilter = status;
        document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-filter-${status}`).classList.add('active');
        renderList();
    }

    function updateAlphaCounts() {
        const counts = { All: contacts.length };
        'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(l => counts[l] = 0);
        contacts.forEach(c => {
            const name = (c.nome || '').trim();
            if (name) {
                const initial = name.charAt(0).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
                if (counts[initial] !== undefined) counts[initial]++;
            }
        });
        for (const [letter, count] of Object.entries(counts)) {
            const btn = document.getElementById(`alpha-btn-${letter}`);
            const countSpan = document.getElementById(`alpha-count-${letter}`);
            if (btn && countSpan) {
                countSpan.innerText = `(${count})`;
                btn.style.opacity = (count === 0 && letter !== 'All') ? '0.3' : '1';
            }
        }
    }

    function openNewModal() {
        editingId = null;
        document.getElementById('modalTitle').innerText = "Novo Registo";
        document.querySelectorAll('.modal input, .modal textarea').forEach(el => el.value = '');
        document.getElementById('city').value = 'Fortaleza';
        document.getElementById('state').value = 'CE';
        document.getElementById('status').value = 'conheci';
        document.getElementById('modal').style.display = 'flex';
    }

    function openEditModal(id) {
        const contact = contacts.find(c => String(c.id) === String(id));
        if(!contact) return;
        editingId = contact.id;
        document.getElementById('nome').value = contact.nome || '';
        document.getElementById('status').value = contact.status || 'conheci';
        document.getElementById('origin').value = contact.origin || '';
        document.getElementById('photoUrl').value = contact.photoUrl || ''; 
        document.getElementById('whatsapp').value = contact.whatsapp || '';
        document.getElementById('instagram').value = contact.instagram || '';
        document.getElementById('age').value = contact.age || '';
        document.getElementById('profession').value = contact.profession || '';
        document.getElementById('college').value = contact.college || '';
        document.getElementById('children').value = contact.children || '';
        document.getElementById('neighborhood').value = contact.neighborhood || '';
        document.getElementById('notes').value = contact.notes || '';
        document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; editingId = null; }

    async function saveContactToSheets(finalPhotoUrl) {
        const contactId = editingId ? editingId : Date.now();
        const localData = {
            id: contactId,
            nome: document.getElementById('nome').value,
            status: document.getElementById('status').value,
            origin: document.getElementById('origin').value || 'Direto',
            photoUrl: finalPhotoUrl, 
            whatsapp: document.getElementById('whatsapp').value,
            instagram: document.getElementById('instagram').value,
            age: document.getElementById('age').value,
            profession: document.getElementById('profession').value,
            college: document.getElementById('college').value,
            children: document.getElementById('children').value,
            neighborhood: document.getElementById('neighborhood').value,
            city: document.getElementById('city').value,
            state: document.getElementById('state').value,
            notes: document.getElementById('notes').value,
            updated: new Date().toLocaleDateString('pt-PT')
        };

        const encryptedPayload = {
            action: editingId ? "update" : "create",
            id: localData.id,
            nome: encryptText(localData.nome),
            status: encryptText(localData.status), 
            origin: encryptText(localData.origin),
            photoUrl: encryptText(localData.photoUrl), 
            whatsapp: encryptText(localData.whatsapp),
            instagram: encryptText(localData.instagram),
            age: encryptText(localData.age), 
            profession: encryptText(localData.profession),
            college: encryptText(localData.college),
            children: encryptText(localData.children),
            neighborhood: encryptText(localData.neighborhood),
            city: encryptText(localData.city),
            state: encryptText(localData.state),
            notes: encryptText(localData.notes),
            updated: encryptText(localData.updated)
        };

        if (editingId) {
            const index = contacts.findIndex(c => String(c.id) === String(editingId));
            if (index > -1) contacts[index] = localData;
        } else { contacts.push(localData); }

        renderList(); closeModal();
        localStorage.setItem('contact_hub_cache', JSON.stringify(contacts));
        try { await fetch(API_URL, { method: 'POST', body: JSON.stringify(encryptedPayload) }); } catch(e) {}
    }

    function toggleDetails(id) { document.getElementById(`details-${id}`).classList.toggle('active'); }
    function buildWaLink(num) { 
        if(!num) return ''; 
        let clean = String(num).replace(/\D/g, '');
        if(clean.length === 10 || clean.length === 11) clean = '55' + clean;
        return `https://wa.me/${clean}`;
    }
    function buildIgLink(user) { 
        if(!user) return '';
        let clean = String(user).replace(/https?:\/\/(www\.)?instagram\.com\//i, '').replace('@', '').split('/')[0].trim();
        return `https://instagram.com/${clean}`;
    }

    function renderList() {
        updateAlphaCounts(); 
        const list = document.getElementById('contactList');
        const query = document.getElementById('searchInput').value.toLowerCase();
        list.innerHTML = '';
        const filtered = contacts.filter(c => {
            const searchStr = `${c.nome || ''} ${c.neighborhood || ''} ${c.notes || ''}`.toLowerCase();
            const matchesSearch = searchStr.includes(query);
            let matchesLetter = currentInitialFilter === 'All' || (c.nome || '').charAt(0).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase() === currentInitialFilter;
            let matchesStatus = currentStatusFilter === 'All' || (c.status || 'conheci').toLowerCase() === currentStatusFilter;
            return matchesSearch && matchesLetter && matchesStatus;
        }).reverse(); 

        filtered.forEach(c => {
            const st = (c.status || 'conheci').toLowerCase();
            const wa = buildWaLink(c.whatsapp);
            const ig = buildIgLink(c.instagram);
            const avatar = c.photoUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(c.nome)}&background=25282e&color=fff&bold=true`;
            
            const card = document.createElement('div');
            card.className = `contact-card status-${st}`;
            card.innerHTML = `
                <div class="card-header-flex">
                    <div class="profile-section">
                        <img src="${avatar}" class="profile-avatar" alt="Avatar">
                        <div class="contact-info-left">
                            <h3>${c.nome}${c.age ? ', '+c.age : ''}</h3>
                            <div class="contact-tags">
                                <span class="tag" style="border: 1px solid var(--color-${st});">${st}</span>
                                <span class="tag">📍 ${c.origin || 'Direto'}</span>
                            </div>
                        </div>
                    </div>
                    <div class="card-actions-right">
                        <button class="btn-icon" onclick="toggleDetails('${c.id}')">🔍</button>
                        <button class="btn-icon" onclick="openEditModal('${c.id}')">✏️</button>
                    </div>
                </div>
                <div class="card-details" id="details-${c.id}">
                    <div class="social-links">
                        ${wa ? `<a href="${wa}" target="_blank" class="btn-social btn-wa">WhatsApp</a>` : ''}
                        ${ig ? `<a href="${ig}" target="_blank" class="btn-social btn-ig">Instagram</a>` : ''}
                    </div>
                    <div class="details-grid">
                        <div class="detail-item"><strong>Profissão</strong>${c.profession || '-'}</div>
                        <div class="detail-item"><strong>Faculdade</strong>${c.college || '-'}</div>
                        <div class="detail-item"><strong>Local</strong>${c.neighborhood || '-'}</div>
                        <div class="detail-item"><strong>Filhos</strong>${c.children || '0'}</div>
                    </div>
                    <div class="detail-item" style="margin-top:10px;"><strong>Notas</strong>${c.notes || '-'}</div>
                </div>
            `;
            list.appendChild(card);
        });
        updateDashboard();
    }

    function updateDashboard() {
        const total = contacts.length;
        const counts = { conheci: 0, conversando: 0, fiquei: 0, transei: 0 };
        contacts.forEach(c => { let s = (c.status || '').toLowerCase(); if(counts[s] !== undefined) counts[s]++; });
        const rings = [
            { id: 'ring-conheci', percId: 'perc-conheci', barId: 'bar-conheci', val: counts.conheci, circ: 314 },
            { id: 'ring-conversando', percId: 'perc-conversando', barId: 'bar-conversando', val: counts.conversando, circ: 238 },
            { id: 'ring-fiquei', percId: 'perc-fiquei', barId: 'bar-fiquei', val: counts.fiquei, circ: 163 },
            { id: 'ring-transei', percId: 'perc-transei', barId: 'bar-transei', val: counts.transei, circ: 88 }
        ];
        rings.forEach(r => {
            const p = total ? Math.round((r.val / total) * 100) : 0;
            document.getElementById(r.id).style.strokeDashoffset = r.circ - (p / 100 * r.circ);
            document.getElementById(r.percId).innerText = p + '%';
            document.getElementById(r.barId).style.width = p + '%';
        });
    }

    init();
</script>
</body>
</html>
