<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DateMind | v03</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .tinder-gradient { background: linear-gradient(262deg, #ff7854 0%, #fd267d 100%); }
        .sidebar-item:hover { background-color: #f3f4f6; }
        .active-match { border-right: 4px solid #fd267d; background-color: #fff1f2; }
        body { background-color: #f0f2f5; font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="w-80 bg-white border-r flex flex-col z-20 shadow-lg">
        <div class="p-6 border-b flex items-center justify-between">
            <h1 class="text-2xl font-bold text-[#fd267d]"><i class="fa-solid fa-fire"></i> DateMind</h1>
            <span class="text-[10px] bg-gray-100 px-2 py-1 rounded text-gray-400 font-mono font-bold">v03</span>
        </div>
        <div class="overflow-y-auto flex-1" id="sideList">
            <div class="p-4 uppercase text-[10px] font-black tracking-widest text-gray-400 text-center italic">Aguardando importação...</div>
        </div>
        <div class="p-4 border-t bg-gray-50">
            <label class="tinder-gradient text-white w-full py-3 rounded-xl font-bold flex items-center justify-center cursor-pointer shadow-md hover:scale-[1.02] transition-all">
                <i class="fa-solid fa-cloud-arrow-up mr-2"></i> Importar .txt
                <input type="file" id="chatUpload" class="hidden" accept=".txt">
            </label>
        </div>
    </aside>

    <main class="flex-1 flex flex-col items-center justify-center p-10 relative">
        <div id="profileCard" class="w-full max-w-md bg-white rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col border border-gray-100 hidden">
            <div class="h-64 tinder-gradient relative">
                <div class="absolute bottom-6 left-8 text-white z-10">
                    <h2 class="text-3xl font-extrabold" id="cardName">Nome</h2>
                    <p class="text-sm opacity-90 flex items-center gap-2 font-medium" id="cardJob">Analista</p>
                </div>
            </div>
            <div class="p-8 overflow-y-auto bg-white" style="max-height: 400px;">
                <section class="mb-6">
                    <h3 class="text-[10px] font-black uppercase tracking-widest text-gray-400 mb-3 tracking-widest">Resumo do Papo</h3>
                    <p id="bioText" class="text-gray-700 text-sm leading-relaxed font-medium italic text-center">Suba um chat para analisar.</p>
                </section>
                <section class="mb-6">
                    <h3 class="text-[10px] font-black uppercase tracking-widest text-gray-400 mb-3 tracking-widest">Informações Extraídas</h3>
                    <div id="tagContainer" class="flex flex-wrap gap-2"></div>
                </section>
                <div class="p-5 bg-rose-50 rounded-2xl border-l-4 border-[#fd267d]">
                    <h3 class="text-[10px] font-black uppercase text-[#fd267d] mb-2 text-center">Insight do DateMind</h3>
                    <p id="aiInsight" class="text-xs text-gray-700 font-medium"></p>
                </div>
            </div>
        </div>
        <div id="welcomeMsg" class="text-gray-400 flex flex-col items-center">
            <i class="fa-solid fa-comments text-6xl mb-4"></i>
            <p>Importe um chat para começar a gerir os seus dates.</p>
        </div>
    </main>

    <script>
        document.getElementById('chatUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const content = event.target.result;
                    const fileName = file.name.replace('.txt', '').replace('Conversa do WhatsApp com ', '');
                    runParser(fileName, content);
                };
                reader.readAsText(file);
            }
        });

        function runParser(name, text) {
            document.getElementById('welcomeMsg').classList.add('hidden');
            document.getElementById('profileCard').classList.remove('hidden');

            const textLower = text.toLowerCase();
            const tags = [];

            // LÓGICA DO PARSER v03
            if (textLower.includes("ceará") || textLower.includes("vozão")) tags.push("Ceará SC 🏁");
            if (textLower.includes("filho") || textLower.includes("mãe")) tags.push("Tem Filhos");
            if (textLower.includes("tatuagem") || textLower.includes("tattoo")) tags.push("Tatuada");
            if (textLower.includes("caipirinha") || textLower.includes("drink")) tags.push("Gosta de Drinks");
            if (textLower.includes("suits") || textLower.includes("série")) tags.push("Séries/Netflix");
            if (textLower.includes("projeart")) tags.push("Projeart");
            if (textLower.includes("sagitário") || textLower.includes("signo")) tags.push("Sagitariana");

            // Atualização Visual
            document.getElementById('cardName').innerText = name;
            document.getElementById('cardJob').innerText = textLower.includes("projeart") ? "Trabalha na Projeart" : "Ocupação não identificada";
            
            const msgCount = text.split('\n').length;
            document.getElementById('bioText').innerText = `Análise de ${msgCount} mensagens. A conversa parece ${msgCount > 300 ? 'muito intensa' : 'em desenvolvimento'}.`;
            
            document.getElementById('tagContainer').innerHTML = tags.map(t => 
                `<span class="bg-gray-100 text-gray-700 px-3 py-1 rounded-lg text-xs font-bold uppercase">${t}</span>`
            ).join('') || "<span class='text-xs text-gray-400'>Nenhuma tag identificada.</span>";

            document.getElementById('aiInsight').innerText = textLower.includes("beijo") ? 
                "Atenção: Houve menção a beijo. O clima está favorável para um convite físico." : 
                "Dica: Tente descobrir mais sobre os hobbies dela para gerar conexão.";

            // Adicionar à Sidebar
            const sideList = document.getElementById('sideList');
            if(sideList.innerText.includes("Aguardando")) sideList.innerHTML = "";
            const div = document.createElement('div');
            div.className = "sidebar-item active-match p-4 flex items-center cursor-pointer transition border-b";
            div.innerHTML = `<div class="font-bold text-sm">${name}</div>`;
            sideList.prepend(div);
        }
    </script>
</body>
</html>
