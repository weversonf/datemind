<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DateMind v08.3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f8fafc; overflow-x: hidden; }
        .tinder-gradient { background: linear-gradient(135deg, #ff7854 0%, #fd267d 100%); }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); cursor: pointer; }
        .crm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; padding: 2rem; }
        .input-field { background-color: #f1f5f9; color: #1e293b; width: 100%; padding: 1rem; border-radius: 1.25rem; outline: none; border: 2px solid transparent; transition: all 0.3s; }
        .input-field:focus { border-color: #fd267d; background-color: #ffffff; }
    </style>
</head>
<body>

    <div id="authSection" class="min-h-screen flex items-center justify-center p-6">
        <div class="bg-white p-10 md:p-14 rounded-[3.5rem] w-full max-w-md shadow-2xl text-slate-900">
            <div class="text-center mb-10">
                <i class="fa-solid fa-fire text-[#fd267d] text-6xl mb-4"></i>
                <h2 id="authTitle" class="text-3xl font-black italic tracking-tighter">DATEMIND</h2>
                <p id="authSubtitle" class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em] mt-2">Entre no seu CRM Amoroso</p>
            </div>

            <div class="space-y-4">
                <input type="email" id="email" placeholder="Seu melhor e-mail" class="input-field">
                <input type="password" id="pass" placeholder="Sua senha secreta" class="input-field">
                
                <button id="btnPrimary" class="tinder-gradient w-full py-4 rounded-[1.25rem] text-white font-black uppercase tracking-widest shadow-lg hover:scale-[1.02] transition-all mt-4">
                    Entrar
                </button>
                
                <p id="authError" class="text-center text-xs text-red-500 font-bold hidden"></p>

                <div class="pt-6 text-center border-t border-slate-100 mt-6">
                    <button id="btnSwitch" class="text-[10px] font-black uppercase text-slate-400 hover:text-[#fd267d] transition-colors tracking-widest">
                        Não tem conta? Cadastre-se agora
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden flex flex-col min-h-screen">
        <header class="p-6 border-b border-white/10 flex justify-between items-center sticky top-0 z-40 bg-[#0f172a]/95 backdrop-blur-md">
            <h1 class="text-xl font-black italic uppercase tracking-tighter">DateMind <span class="text-[#fd267d]">PRO</span></h1>
            <div class="flex items-center gap-4">
                <button id="btnLogout" class="text-[9px] font-black uppercase text-slate-500 hover:text-white transition-colors">Sair da Conta</button>
                <label class="tinder-gradient px-8 py-3 rounded-full font-bold text-[10px] uppercase tracking-widest cursor-pointer shadow-lg flex items-center gap-2 hover:brightness-110">
                    <input type="file" id="chatUpload" class="hidden" accept=".txt">
                    <i class="fa-solid fa-plus-circle"></i> Novo Dossiê
                </label>
            </div>
        </header>

        <main id="crmBoard" class="crm-grid">
            </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, onSnapshot, orderBy } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCV1GoLh63JnbosKXY4eTMptOUedA29Jcs",
            authDomain: "memorymsg.firebaseapp.com",
            projectId: "memorymsg",
            storageBucket: "memorymsg.firebasestorage.app",
            messagingSenderId: "66381936065",
            appId: "1:66381936065:web:b440c0bbdfe63804f32b40"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let isLoginMode = true;

        // ALTERNAR ENTRE LOGIN E CADASTRO
        const btnSwitch = document.getElementById('btnSwitch');
        btnSwitch.onclick = () => {
            isLoginMode = !isLoginMode;
            document.getElementById('authTitle').innerText = isLoginMode ? "DATEMIND" : "CRIAR CONTA";
            document.getElementById('authSubtitle').innerText = isLoginMode ? "Entre no seu CRM Amoroso" : "Cadastre-se para salvar dossiês";
            document.getElementById('btnPrimary').innerText = isLoginMode ? "Entrar" : "Criar Minha Conta";
            btnSwitch.innerText = isLoginMode ? "Não tem conta? Cadastre-se agora" : "Já tem conta? Faça Login";
        };

        // AÇÃO PRINCIPAL (LOGIN OU CADASTRO)
        document.getElementById('btnPrimary').onclick = () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            const errorEl = document.getElementById('authError');
            errorEl.classList.add('hidden');

            if (isLoginMode) {
                signInWithEmailAndPassword(auth, email, pass).catch(e => showError("E-mail ou senha incorretos."));
            } else {
                createUserWithEmailAndPassword(auth, email, pass).catch(e => showError("Erro ao cadastrar. Verifique os dados."));
            }
        };

        function showError(msg) {
            const err = document.getElementById('authError');
            err.innerText = msg;
            err.classList.remove('hidden');
        }

        document.getElementById('btnLogout').onclick = () => signOut(auth);

        // PERSISTÊNCIA E SINCRONIZAÇÃO
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                syncDashboard(user.uid);
            } else {
                document.getElementById('authSection').classList.remove('hidden');
                document.getElementById('mainApp').classList.add('hidden');
            }
        });

        // REUTILIZE A FUNÇÃO processOldSchool E syncBoard DO CÓDIGO ANTERIOR AQUI PARA COMPLETAR
        // ... (Mantendo a lógica de processamento local para segurança e velocidade)
        
        function syncDashboard(uid) {
            const q = query(collection(db, "profiles"), where("uid", "==", uid));
            onSnapshot(q, (snap) => {
                const board = document.getElementById('crmBoard');
                board.innerHTML = '';
                snap.forEach(doc => {
                    const d = doc.data();
                    const card = document.createElement('div');
                    card.className = "glass-card rounded-[2.5rem] overflow-hidden p-8 animate-in fade-in zoom-in duration-300 mb-4";
                    card.innerHTML = `<h3 class="text-xl font-black">${d.nome}</h3><p class="text-[10px] opacity-50 uppercase font-bold mt-2 tracking-widest">${d.status}</p>`;
                    board.prepend(card);
                });
            });
        }

        document.getElementById('chatUpload').onchange = async (e) => {
            const file = e.target.files[0];
            const text = await file.text();
            // Chame a função processOldSchool aqui
            const data = { nome: file.name.split(' ')[0], status: "Morno", uid: auth.currentUser.uid };
            await addDoc(collection(db, "profiles"), data);
        };
    </script>
</body>
</html>
