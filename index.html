<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DateMind v05 | CRM Amoroso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .tinder-gradient { background: linear-gradient(262deg, #ff7854 0%, #fd267d 100%); }
        .card-appear { animation: slideUp 0.6s cubic-bezier(0.17, 0.67, 0.83, 0.67); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .glass-badge { background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.3); }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-slate-800">

    <aside class="w-80 bg-white border-r flex flex-col shadow-2xl z-10">
        <div class="p-8 border-b">
            <h1 class="text-2xl font-black text-[#fd267d] tracking-tighter italic uppercase">DateMind</h1>
            <span class="text-[9px] text-slate-400 font-bold tracking-widest uppercase">CRM Amoroso v06</span>
        </div>
        
        <div class="p-4 m-4 bg-slate-50 rounded-2xl border border-dashed border-slate-200">
            <label class="text-[9px] font-black text-slate-500 uppercase mb-2 block tracking-widest">Configuração de IA</label>
            <input type="password" id="gemini_key" placeholder="Insira sua Gemini Key..." 
                   class="w-full p-2.5 text-xs rounded-xl border border-slate-200 focus:ring-2 focus:ring-[#fd267d] focus:outline-none transition-all">
            <p class="text-[8px] text-slate-400 mt-2 italic font-medium">A chave é usada apenas no seu navegador.</p>
        </div>

        <div class="flex-1 overflow-y-auto px-4 py-2" id="sideList">
            <div id="emptyMsg" class="text-center py-20 text-slate-300 text-[10px] font-bold uppercase tracking-[0.2em]">Dossiês Vazios</div>
        </div>

        <div class="p-6 bg-slate-50 border-t">
            <label class="tinder-gradient text-white w-full py-4 rounded-2xl font-black text-[10px] uppercase tracking-widest flex items-center justify-center cursor-pointer shadow-lg hover:scale-[1.02] transition-all active:scale-95">
                <input type="file" id="chatUpload" class="hidden" accept=".txt">
                <i class="fa-solid fa-cloud-arrow-up mr-2"></i> Importar WhatsApp
            </label>
        </div>
    </aside>

    <main class="flex-1 flex flex-col items-center justify-center p-12 bg-[#f0f2f5] relative">
        
        <div id="loading" class="hidden absolute inset-0 bg-white/90 z-50 flex flex-col items-center justify-center backdrop-blur-sm">
            <div class="w-14 h-14 border-4 border-slate-100 border-t-[#fd267d] rounded-full animate-spin mb-4 shadow-sm"></div>
            <p class="text-[#fd267d] font-black text-[10px] uppercase tracking-widest animate-pulse">Extraindo Inteligência...</p>
        </div>

        <div id="profileCard" class="hidden w-full max-w-md bg-white rounded-[3rem] shadow-[0_25px_60px_-15px_rgba(0,0,0,0.15)] overflow-hidden flex flex-col card-appear border border-white">
            <div class="h-80 tinder-gradient relative flex items-end p-10">
                <div id="statusBadge" class="absolute top-8 right-8 glass-badge px-4 py-1.5 rounded-full">
                    <span id="interestText" class="text-white text-[10px] font-black uppercase tracking-tighter">Analizando...</span>
                </div>
                <div class="z-10 text-white">
                    <h2 id="cardName" class="text-5xl font-black tracking-tighter leading-none mb-2">Nome</h2>
                    <p class="text-[11px] font-bold opacity-90 uppercase tracking-[0.2em] flex items-center gap-2">
                        <i class="fa-solid fa-calendar-check"></i> Última: <span id="lastDate">--/--</span>
                    </p>
                </div>
                <div class="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent"></div>
            </div>

            <div class="p-10 space-y-8 bg-white overflow-y-auto" style="max-height: 450px;">
                <section>
                    <h3 class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 mb-3 flex items-center gap-2">
                        <div class="w-1 h-3 tinder-gradient rounded-full"></div> Perfil Psicológico
                    </h3>
                    <p id="bioText" class="text-slate-600 text-sm leading-relaxed font-medium"></p>
                </section>
                
                <section>
                    <h3 class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 mb-4 flex items-center gap-2">
                        <div class="w-1 h-3 tinder-gradient rounded-full"></div> Dossiê de Fatos
                    </h3>
                    <div id="tagContainer" class="flex flex-wrap gap-2"></div>
                </section>

                <section class="bg-rose-50 p-7 rounded-[2.5rem] border border-rose-100 shadow-inner">
                    <h3 class="text-[10px] font-black uppercase text-[#fd267d] mb-3 flex items-center gap-2">
                        <i class="fa-solid fa-chess-knight"></i> Jogada Estratégica
                    </h3>
                    <p id="aiInsight" class="text-slate-800 text-sm font-bold italic leading-snug"></p>
                </section>
            </div>
        </div>

        <div id="welcome" class="flex flex-col items-center opacity-20">
            <i class="fa-solid fa-heart-pulse text-8xl mb-4 text-slate-300"></i>
            <p class="font-black uppercase tracking-[0.3em] text-[10px] text-slate-400 text-center">DateMind Engine Ready<br>Aguardando Timeline</p>
        </div>
    </main>

    <script>
        const chatUpload = document.getElementById('chatUpload');
        
        chatUpload.addEventListener('change', async (e) => {
            const key = document.getElementById('gemini_key').value;
            const file = e.target.files[0];
            if (!file) return;

            const text = await file.text();
            document.getElementById('loading').classList.remove('hidden');

            // Fallback: Se não tiver chave, gera o "Mystery Match"
            if (!key) {
                setTimeout(() => {
                    renderCard(generateMockData(file.name));
                    document.getElementById('loading').classList.add('hidden');
                }, 1500);
                return;
            }

            await analyzeChat(text, key, file.name);
        });

        async function analyzeChat(content, key, fileName) {
            const cleanName = fileName.replace('.txt', '').replace('Conversa do WhatsApp com ', '');
            // Pegamos o final da conversa (últimos 15k caracteres)
            const chatChunk = content.slice(-15000);

            const prompt = `Analise este chat com ${cleanName}. Retorne EXCLUSIVAMENTE um JSON:
            {"nome": "${cleanName}", "ultimo_papo": "data da ultima msg", "personalidade": "resumo 2 frases", "tags": ["fato1", "fato2", "gosto"], "insight": "estratégia", "interesse": "Quente/Morno/Frio"}
            Chat: ${chatChunk}`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);

                const rawResponse = data.candidates[0].content.parts[0].text;
                const jsonMatch = rawResponse.match(/\{[\s\S]*\}/);
                renderCard(JSON.parse(jsonMatch[0]));
            } catch (err) {
                console.warn("IA Falhou, usando modo Fallback:", err.message);
                renderCard(generateMockData(cleanName, true));
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }

        function generateMockData(name, error = false) {
            return {
                nome: name.split(' ')[0],
                ultimo_papo: "Recentemente",
                personalidade: error ? "Modo de segurança ativado. A IA detectou uma chave inválida, mas o dossiê visual está pronto." : "Personalidade Mystery Match. Insira uma chave Gemini válida para desbloquear a análise real.",
                tags: ["Mistério", "Pendente IA", "CRM Ativo"],
                insight: error ? "Verifique sua chave de API no Google AI Studio (sua chave anterior foi bloqueada)." : "Adicione sua chave Gemini Key no menu lateral para ver insights estratégicos reais.",
                interesse: "Morno"
            };
        }

        function renderCard(data) {
            document.getElementById('welcome').classList.add('hidden');
            document.getElementById('profileCard').classList.remove('hidden');
            
            document.getElementById('cardName').innerText = data.nome;
            document.getElementById('lastDate').innerText = data.ultimo_papo;
            document.getElementById('bioText').innerText = data.personalidade;
            document.getElementById('aiInsight').innerText = data.insight;
            
            // Badge de Interesse
            const badge = document.getElementById('statusBadge');
            const txt = document.getElementById('interestText');
            txt.innerText = data.interesse;
            if(data.interesse === 'Quente') badge.className = "absolute top-8 right-8 bg-red-500 shadow-lg px-4 py-1.5 rounded-full animate-pulse";
            else badge.className = "absolute top-8 right-8 glass-badge px-4 py-1.5 rounded-full";

            // Tags
            document.getElementById('tagContainer').innerHTML = data.tags.map(t => 
                `<span class="bg-slate-100 text-slate-700 px-4 py-2 rounded-2xl text-[10px] font-black uppercase border border-slate-50 tracking-tighter">${t}</span>`
            ).join('');

            // Sidebar Update
            const sideList = document.getElementById('sideList');
            if(document.getElementById('emptyMsg')) document.getElementById('emptyMsg').remove();
            const div = document.createElement('div');
            div.className = "p-4 mb-3 flex items-center bg-white rounded-2xl border border-slate-100 shadow-sm animate-slide-in hover:border-[#fd267d] transition-all cursor-pointer";
            div.innerHTML = `<div class="w-10 h-10 rounded-full tinder-gradient mr-3 flex items-center justify-center text-white font-black text-xs">${data.nome.charAt(0)}</div><div class="text-xs font-bold text-slate-700 uppercase tracking-widest">${data.nome}</div>`;
            sideList.prepend(div);
        }
    </script>
</body>
</html>
